{{/* Restyle the navbar brand to match the homepage hero title font treatment. */}}
<script>
  (function () {
    document.querySelectorAll('.navbar-brand').forEach(function (el) {
      if (el.querySelector('img')) return; // skip if a logo image is set
      var text = el.textContent.trim();
      var html = text
        .replace(/Math/, '<span class="math-word">Math</span>')
        .replace(/Things/, '<em>Things</em>');
      el.innerHTML = html;
    });
  })();
</script>

{{/* Theme toggle: convert dropdown to simple light/dark toggle */}}
<style>
  /* Hide theme dropdown menu */
  .theme-dropdown .dropdown-menu {
    display: none !important;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const themeLink = document.querySelector('.theme-dropdown .nav-link');

    function getCurrentTheme() {
      // Check which menu item is active
      if (document.querySelector('.theme-dropdown .js-set-theme-light.dropdown-item-active')) {
        return 'light';
      } else if (document.querySelector('.theme-dropdown .js-set-theme-dark.dropdown-item-active')) {
        return 'dark';
      }
      return 'light'; // default
    }

    if (themeLink) {
      themeLink.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();

        // Get current theme from active menu item
        const currentTheme = getCurrentTheme();

        // Toggle theme
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';

        // Click the corresponding menu item
        const menuItemClass = newTheme === 'light' ? 'js-set-theme-light' : 'js-set-theme-dark';
        const menuItem = document.querySelector('.' + menuItemClass);

        if (menuItem) {
          menuItem.click();
        }
      });
    }
  });
</script>
