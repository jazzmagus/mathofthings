<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trigonometria: Risoluzione dei Triangoli — Lezione interattiva</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<script>
MathJax = {
  tex: {
    inlineMath: [['\\(','\\)']],
    displayMath: [['\\[','\\]']]
  },
  svg: { fontCache: 'global', scale: 1.05 },
  startup: {
    ready() {
      MathJax.startup.defaultReady();
      MathJax.startup.promise.then(() => { document.body.style.opacity = '1'; });
    }
  }
};
</script>

<style>
:root {
  --bg:#faf7f2; --surface:#fff; --surface-alt:#f5f0e8;
  --border:#e4ddd4; --border-light:#ece7de;
  --text:#2c2520; --text-mid:#5a524a; --text-dim:#6e6760;
  --accent:#c2185b; --accent-light:#fce4ec;
  --blue:#3a6b8c; --blue-light:#e8f0f5;
  --green:#4a7c59; --green-light:#eaf5ed;
  --purple:#6a1b9a; --purple-light:#f3e5f5;
  --gold:#b8860b;
  --teal:#4f6d7a; --teal-light:#e8eff2;
  --danger:#b33a3a;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--text);line-height:1.75;font-size:17px;opacity:0;transition:opacity .3s}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,247,242,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border-light);height:52px;display:flex;align-items:center;padding:0 clamp(16px,4vw,40px);gap:16px}
.topbar-brand{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;color:var(--text);white-space:nowrap;flex-shrink:0}
.topbar-nav{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;flex:1}
.topbar-nav::-webkit-scrollbar{display:none}
.nav-pill{background:none;border:none;font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--text-dim);padding:6px 14px;cursor:pointer;white-space:nowrap;transition:color .2s;border-bottom:2px solid transparent}
.nav-pill:hover{color:var(--text)}
.nav-pill.active{color:var(--accent);font-weight:600;border-bottom:2px solid var(--accent)}
.topbar-home{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--text-dim);text-decoration:none;cursor:pointer;white-space:nowrap;flex-shrink:0}
.topbar-home:hover{color:var(--accent)}

/* LAYOUT */
.container{max-width:780px;margin:0 auto;padding:84px clamp(20px,5vw,48px) 60px}
.section{display:none;animation:appear .4s ease}
.section.active{display:block}
@keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* HERO */
.hero{margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border-light)}
.hero-tag{font-family:'Fira Code',monospace;font-size:.73rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(1.9rem,5vw,2.65rem);font-weight:800;line-height:1.15;margin-bottom:12px}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero-sub{font-size:1.02rem;color:var(--text-mid);line-height:1.7;text-wrap:pretty}

/* CALLOUT */
.cb{background:var(--surface-alt);border-left:2px solid var(--accent);border-radius:0 8px 8px 0;padding:16px 18px;margin:18px 0}
.cb-label{font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-weight:600;color:var(--accent)}
.cb.tip .cb-label{color:var(--blue)}
.cb.warn .cb-label{color:var(--gold)}
.cb.danger .cb-label{color:var(--danger)}
.cb.success .cb-label{color:var(--green)}
.cb.purple .cb-label{color:var(--purple)}
.cb.teal .cb-label{color:var(--teal)}

/* MATH */
.math-block{background:rgba(0,0,0,.025);padding:12px 16px;margin:10px 0;overflow-x:auto;border-radius:2px}
.math-block.center{text-align:center}
.math-block.result{border-left:2px solid var(--green);background:rgba(74,124,89,.04)}
.math-block.warn{border-left:2px solid var(--danger);background:rgba(179,58,58,.04)}
mjx-container[jax="SVG"]{direction:ltr}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}

/* ACCORDION */
.accordion{margin:16px 0}
.acc-item{border-bottom:1px solid rgba(0,0,0,.08)}
.acc-item:last-child{border-bottom:none}
.acc-header{display:flex;align-items:center;gap:12px;padding:14px 0;cursor:pointer;user-select:none;background:none;border:none;width:100%;text-align:left}
.acc-num{width:24px;height:24px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.7rem;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.acc-title{font-weight:600;font-size:.93rem;flex:1;color:var(--text);font-family:Georgia,serif;text-align:left;line-height:1.4}
.acc-arrow{width:16px;height:16px;color:var(--text-dim);transition:transform .3s;flex-shrink:0}
.acc-item.open .acc-arrow{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.acc-item.open .acc-body{max-height:9000px}
.acc-inner{padding:8px 0 18px 36px}

/* TABLE */
.ct{width:100%;border-collapse:collapse;margin:14px 0;font-size:.88rem}
.ct th{text-align:left;padding:10px 14px;font-weight:600;color:var(--accent);border-bottom:1px solid var(--border-light);font-size:.74rem;letter-spacing:.5px;text-transform:uppercase;font-family:'Fira Code',monospace}
.ct td{padding:9px 14px;border-bottom:1px solid var(--border-light);vertical-align:top;line-height:1.65}
.ct tr:last-child td{border-bottom:none}

/* SVG / GRAPH */
.graph-box{background:var(--surface);border:1px solid var(--border-light);border-radius:12px;padding:22px;margin:18px 0;overflow-x:auto;text-align:center;box-shadow:0 2px 10px rgba(44,37,32,.05)}
.graph-box svg{max-width:100%;height:auto}
.graph-cap{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--text-dim);margin-top:10px;letter-spacing:.3px}

/* BOTTOM NAV */
.bottom-nav{display:flex;justify-content:space-between;align-items:center;margin-top:44px;padding-top:20px;border-top:1px solid var(--border-light)}
.bb{font-family:'JetBrains Mono',monospace;font-size:.85rem;padding:0;border:none;background:none;color:var(--text);transition:all .2s;cursor:pointer}
.bb:hover{color:var(--accent);text-decoration:underline}
.bb:disabled{opacity:.35;cursor:not-allowed}
.bb:disabled:hover{color:var(--text);text-decoration:none}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border);transition:all .3s;cursor:pointer;border:none;padding:0;flex-shrink:0}
.dot.active{background:var(--accent);width:20px;border-radius:4px}

/* TYPOGRAPHY */
p{margin:6px 0}
ul,ol{margin:8px 0 8px 24px}
li{margin:3px 0;line-height:1.7}
strong{font-weight:700}
.dim{color:var(--text-dim)}
h2{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;margin:26px 0 10px;color:var(--text)}
h3{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:600;margin:18px 0 8px;color:var(--text)}

/* RESPONSIVE */
@media(max-width:640px){
  body{font-size:15.5px}
  .hero h1{font-size:1.65rem}
  .cb{padding:14px 14px}
  .container{padding:80px 18px 60px}
  .topbar-brand{font-size:.9rem}
  .acc-inner{padding:8px 0 16px 24px}
  .acc-title{font-size:.88rem}
  .ct{font-size:.82rem}
  .ct th,.ct td{padding:8px 10px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">Trigonometria · Triangoli</div>
  <div class="topbar-nav" id="topNav"></div>
  <a href="/" class="topbar-home">← home</a>
</div>
<div class="container" id="app"></div>

<script>

/* ═══════════════ ACCORDION ═══════════════ */
function acc(items) {
  return '<div class="accordion">' + items.map((it, i) => `
    <div class="acc-item">
      <button class="acc-header" onclick="toggleAcc(this)">
        <div class="acc-num">${i + 1}</div>
        <div class="acc-title">${it.t}</div>
        <svg class="acc-arrow" viewBox="0 0 20 20" fill="none">
          <path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="acc-body"><div class="acc-inner">${it.h}</div></div>
    </div>`).join('') + '</div>';
}

function toggleAcc(el) {
  const item = el.closest('.acc-item');
  item.classList.toggle('open');
  if (item.classList.contains('open') && typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([item]);
  }
}

/* ═══════════════ SCHERMATE ═══════════════ */
const S = [

/* ──── 0 · MOTIVAZIONE ──── */
{
  tag: `MOTIVAZIONE`,
  title: `Oltre il triangolo <em>rettangolo</em>`,
  nav: `Motivazione`,
  sub: `Finora hai risolto solo triangoli rettangoli, dove un angolo di 90&deg; semplifica tutto. Ma la maggior parte dei triangoli — nella topografia, nella navigazione, in un rilevamento GPS — non ha nessun angolo retto. Servono strumenti nuovi.`,
  body: `
    <div class="cb tip">
      <div class="cb-label">Un problema concreto</div>
      <p>Un rilevatore misura la distanza da due antenne e l'angolo tra le due direzioni di visuale: come calcola la distanza tra le antenne, se non può misurarla direttamente? Il triangolo che si forma quasi certamente non è rettangolo: qui i teoremi che già conosci non bastano.</p>
    </div>

    <p>In questa lezione costruiamo, un passo alla volta, gli strumenti per risolvere <strong>qualunque</strong> triangolo, cioè per calcolare tutti i suoi lati e angoli a partire da un numero minimo di informazioni. Il percorso parte da un risultato sulla circonferenza — il <strong>teorema della corda</strong> — che porta quasi per mano al <strong>teorema dei seni</strong>; poi arriva al <strong>teorema del coseno</strong> (o di Carnot), che generalizza Pitagora.</p>

    <div class="cb">
      <div class="cb-label">Mappa della lezione</div>
      <table class="ct">
        <tr><th>#</th><th>Argomento</th></tr>
        <tr><td style="font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:600">1</td><td>Richiami: i teoremi sui triangoli rettangoli</td></tr>
        <tr><td style="font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:600">2</td><td>Il teorema della corda</td></tr>
        <tr><td style="font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:600">3</td><td>Il teorema dei seni</td></tr>
        <tr><td style="font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:600">4</td><td>Il teorema del coseno (Carnot)</td></tr>
        <tr><td style="font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:600">5</td><td>Risolvere un triangolo qualunque: i quattro casi</td></tr>
        <tr><td style="font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:600">6</td><td>Formulario riepilogativo</td></tr>
      </table>
    </div>

    <div class="cb warn">
      <div class="cb-label">Notazione che useremo</div>
      <p>Indichiamo i vertici del triangolo con <strong>A, B, C</strong>, gli angoli in quei vertici con le stesse lettere, e i lati con le lettere minuscole <strong>a, b, c</strong> — dove ogni lato prende il nome dell'angolo <em>opposto</em>: il lato \\(a\\) è opposto ad \\(A\\), e così via. Gli angoli sono sempre espressi in <strong>radianti</strong>: un angolo retto è \\(\\dfrac{\\pi}{2}\\), un angolo piatto è \\(\\pi\\).</p>
    </div>
  `
},

/* ──── 1 · TRIANGOLI RETTANGOLI ──── */
{
  tag: `RICHIAMI`,
  title: `I teoremi sui triangoli <em>rettangoli</em>`,
  nav: `Triangoli rettangoli`,
  sub: `Prima di affrontare il caso generale, ripassiamo le relazioni che già conosci: sono il mattone su cui costruiamo tutto il resto.`,
  body: `
    <div class="graph-box"><svg viewBox="0 0 380 260" width="380" style="width:100%;max-width:380px;height:auto;font-family:Georgia,serif" role="img" aria-label="Triangolo rettangolo con angolo retto in C, angolo α in A, angolo β in B, cateti a e b, ipotenusa c"><polygon points="60.0,50.0 330.0,220.0 60.0,220.0" fill="var(--accent)" fill-opacity="0.08" stroke="none"/><line x1="60.0" y1="220.0" x2="60.0" y2="50.0" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/><line x1="60.0" y1="220.0" x2="330.0" y2="220.0" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/><line x1="60.0" y1="50.0" x2="330.0" y2="220.0" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/><path d="M60.0 207.0 L73.0 207.0 L73.0 220.0" fill="none" stroke="var(--text)" stroke-width="1.4"/><path d="M60.0 84.0 A34 34 0 0 0 88.8 68.1" fill="none" stroke="var(--accent)" stroke-width="1.8"/><text x="83.7" y="92.9" fill="var(--accent)" font-size="17" font-style="italic" text-anchor="middle" dominant-baseline="central">α</text><path d="M290.0 220.0 A40 40 0 0 1 296.2 198.7" fill="none" stroke="var(--accent)" stroke-width="1.8"/><text x="274.3" y="203.9" fill="var(--accent)" font-size="17" font-style="italic" text-anchor="middle" dominant-baseline="central">β</text><text x="40.0" y="135.0" fill="var(--text)" font-size="18" font-style="italic" text-anchor="middle" dominant-baseline="central">b</text><text x="195.0" y="242.0" fill="var(--text)" font-size="18" font-style="italic" text-anchor="middle" dominant-baseline="central">a</text><text x="213.6" y="123.3" fill="var(--text)" font-size="18" font-style="italic" text-anchor="middle" dominant-baseline="central">c</text><text x="58.0" y="32.0" fill="var(--text)" font-size="18" font-style="italic" text-anchor="middle" dominant-baseline="central">A</text><text x="42.0" y="234.0" fill="var(--text)" font-size="18" font-style="italic" text-anchor="middle" dominant-baseline="central">C</text><text x="346.0" y="234.0" fill="var(--text)" font-size="18" font-style="italic" text-anchor="middle" dominant-baseline="central">B</text></svg></div>
    <p class="graph-cap">Angolo retto in C, angolo α in A, angolo β in B, ipotenusa c</p>
    <p>In un triangolo rettangolo con angolo retto in \\(C\\), ipotenusa \\(c\\) e angolo \\(\\alpha\\) in \\(A\\):</p>
    <div class="math-block center">\\[a = c \\cdot \\sin\\alpha \\qquad b = c \\cdot \\cos\\alpha \\qquad a = b \\cdot \\tan\\alpha\\]</div>
    <p>In parole: <strong>un cateto è uguale all'ipotenusa per il seno dell'angolo opposto</strong> (o per il coseno dell'angolo adiacente), e <strong>un cateto è uguale all'altro cateto per la tangente dell'angolo opposto</strong>.</p>

    <div class="cb">
      <div class="cb-label">Da non dimenticare</div>
      <p>L'<strong>area</strong> del triangolo rettangolo è, come sempre, metà del prodotto dei due cateti: \\(\\text{Area} = \\dfrac{a\\cdot b}{2}\\).</p>
    </div>

    ${acc([
      {
        t: `Esempio: un cateto e un angolo`,
        h: `<p>Un triangolo rettangolo ha ipotenusa \\(c=10\\) e un angolo \\(\\alpha=\\dfrac{\\pi}{6}\\). Calcoliamo i cateti.</p>
            <div class="math-block">\\[a = 10 \\cdot \\sin\\frac{\\pi}{6} = 10 \\cdot \\frac{1}{2} = 5\\]</div>
            <div class="math-block">\\[b = 10 \\cdot \\cos\\frac{\\pi}{6} = 10 \\cdot \\frac{\\sqrt{3}}{2} = 5\\sqrt{3} \\approx 8{,}66\\]</div>
            <p class="dim">Verifica con Pitagora: \\(5^2+(5\\sqrt3)^2 = 25+75=100=10^2\\). ✓ esatto, senza arrotondamenti.</p>`
      }
    ])}
  `
},

/* ──── 2 · TEOREMA DELLA CORDA ──── */
{
  tag: `TEOREMA 1`,
  title: `Il teorema della <em>corda</em>`,
  nav: `Corda`,
  sub: `Il ponte tra la circonferenza e i triangoli: ci servirà tra poco per dimostrare, in modo quasi immediato, il teorema dei seni.`,
  body: `
    <div class="cb">
      <div class="cb-label">Enunciato</div>
      <p>In una circonferenza di raggio \\(R\\), la misura di una <strong>corda</strong> è uguale al prodotto del <strong>diametro</strong> per il <strong>seno</strong> di uno qualsiasi degli angoli alla circonferenza che insistono su di essa:</p>
    </div>
    <div class="math-block center result">\\[\\overline{AB} = 2R \\cdot \\sin\\gamma\\]</div>

    <div class="graph-box"><svg viewBox="0 0 380 350" width="380" style="width:100%;max-width:380px;height:auto;font-family:Georgia,serif" role="img" aria-label="Circonferenza con diametro AD, corda AB, angolo γ in D, angolo retto in B per il teorema di Talete"><circle cx="190" cy="175" r="140" fill="none" stroke="var(--text)" stroke-width="1.8"/><line x1="50.0" y1="175.0" x2="330.0" y2="175.0" stroke="var(--text)" stroke-width="1.4" stroke-linecap="round"/><line x1="330.0" y1="175.0" x2="128.6" y2="300.8" stroke="var(--text)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="50.0" y1="175.0" x2="128.6" y2="300.8" stroke="var(--accent)" stroke-width="2.8" stroke-linecap="round"/><path d="M121.7 289.8 L132.8 282.9 L139.7 293.9" fill="none" stroke="var(--text)" stroke-width="1.4"/><path d="M294.0 175.0 A36 36 0 0 0 299.5 194.1" fill="none" stroke="var(--accent)" stroke-width="1.8"/><text x="280.0" y="189.3" fill="var(--accent)" font-size="17" font-style="italic" text-anchor="middle" dominant-baseline="central">γ</text><circle cx="190.0" cy="175.0" r="3.2" fill="var(--text)"/><text x="190.0" y="191.0" fill="var(--text)" font-size="18" font-style="italic" text-anchor="middle" dominant-baseline="central">O</text><text x="32.0" y="175.0" fill="var(--text)" font-size="18" font-style="italic" text-anchor="middle" dominant-baseline="central">A</text><text x="348.0" y="175.0" fill="var(--text)" font-size="18" font-style="italic" text-anchor="middle" dominant-baseline="central">D</text><text x="132.6" y="318.8" fill="var(--text)" font-size="18" font-style="italic" text-anchor="middle" dominant-baseline="central">B</text></svg></div>
    <p class="graph-cap">AD è diametro ⇒ per Talete l'angolo in B è retto</p>

    ${acc([
      {
        t: `Dimostrazione`,
        h: `<p>Tracciamo il diametro \\(\\overline{AD}\\) passante per l'estremo \\(A\\) della corda. Il triangolo \\(ABD\\) ha l'ipotenusa \\(\\overline{AD}=2R\\) sul diametro, quindi per il <strong>teorema di Talete</strong> l'angolo \\(A\\hat{B}D\\) è retto: \\(ABD\\) è un triangolo rettangolo.</p>
            <p>Nel triangolo rettangolo \\(ABD\\), il cateto \\(\\overline{AB}\\) è opposto all'angolo \\(A\\hat{D}B\\). Per i teoremi sui triangoli rettangoli appena ripassati:</p>
            <div class="math-block center">\\[\\overline{AB} = \\overline{AD}\\cdot \\sin(A\\hat{D}B) = 2R\\sin\\gamma\\]</div>
            <p>Resta da giustificare perché l'angolo in un punto \\(D\\) qualunque dell'arco maggiore dia lo stesso risultato che in ogni altro punto \\(C\\): per il <strong>teorema degli angoli alla circonferenza</strong>, tutti gli angoli alla circonferenza che insistono sullo stesso arco \\(AB\\) sono <strong>congruenti</strong>. Possiamo quindi scegliere il punto più comodo — quello diametralmente opposto ad \\(A\\) — senza perdere generalità.</p>`
      },
      {
        t: `Esempio numerico`,
        h: `<p>Una corda vede un angolo alla circonferenza di \\(\\dfrac{\\pi}{6}\\) in una circonferenza di raggio \\(R=6\\text{ cm}\\). Quanto misura la corda?</p>
            <div class="math-block">\\[\\overline{AB} = 2\\cdot 6\\cdot \\sin\\frac{\\pi}{6} = 12\\cdot\\frac{1}{2} = 6\\text{ cm}\\]</div>`
      }
    ])}
  `
},

/* ──── 3 · TEOREMA DEI SENI ──── */
{
  tag: `TEOREMA 2`,
  title: `Il teorema dei <em>seni</em>`,
  nav: `Teorema dei seni`,
  sub: `Una conseguenza quasi immediata del teorema della corda, applicato a ciascun lato del triangolo inscritto nella sua circonferenza circoscritta.`,
  body: `
    <div class="cb">
      <div class="cb-label">Enunciato</div>
      <p>In un triangolo qualunque, il rapporto tra ciascun lato e il seno dell'angolo opposto è costante, ed è uguale al diametro della circonferenza circoscritta al triangolo:</p>
    </div>
    <div class="math-block center result">\\[\\frac{a}{\\sin A} = \\frac{b}{\\sin B} = \\frac{c}{\\sin C} = 2R\\]</div>

            <p>Per il teorema della corda, appena dimostrato:</p>
