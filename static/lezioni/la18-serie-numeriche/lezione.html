<style>
:root {
  --bg: #faf7f2; --surface: #ffffff; --surface-alt: #f5f0e8;
  --border: #e4ddd4; --border-light: #ece7de;
  --text: #2c2520; --text-mid: #5a524a; --text-dim: #6e6760;

  --blue: #3a6b8c; --green: #4a7c59; --gold: #b8860b;
  --danger: #b33a3a; --purple: #7a5197; --radius: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Georgia',serif; background:var(--bg); color:var(--text);
  line-height:1.75; font-size:17px; opacity:0; transition:opacity .3s;
}
.topbar {
  position:fixed; top:0; left:0; right:0; z-index:100;
  background:rgba(250,247,242,.96); border-bottom:1px solid var(--border-light);
  height:52px; display:flex; align-items:center; padding:0 clamp(16px,4vw,40px); gap:16px;
}
.topbar-brand { font-family:'Playfair Display',serif; font-size:1.05rem; font-weight:700; }
.topbar-nav { display:flex; gap:3px; overflow-x:auto; flex:1; }
.nav-pill {
  background:none; border:none; font-family:'JetBrains Mono',monospace;
  font-size:.82rem; color:var(--text-dim); padding:6px 14px;
  cursor:pointer; white-space:nowrap; transition:all .2s; border-bottom:2px solid transparent;
}
.nav-pill:hover { color:var(--text); }
.nav-pill.active { color:var(--accent); font-weight:600; border-bottom:2px solid var(--accent); }
.topbar-home {
  font-family:'JetBrains Mono',monospace; font-size:0.75rem;
  color:var(--text-dim); text-decoration:none; white-space:nowrap;
}
.topbar-home:hover { color:var(--accent); }
.container { max-width:780px; margin:0 auto; padding:84px clamp(20px,5vw,48px) 60px; }
.section { display:none; animation:appear .4s ease; }
.section.active { display:block; }
@keyframes appear { from { opacity:0; transform:translateY(14px); } to { opacity:1; } }
.hero { margin-bottom:32px; padding-bottom:24px; border-bottom:1px solid var(--border-light); }
.hero-tag { font-family:'Fira Code',monospace; font-size:.73rem; text-transform:uppercase; color:var(--accent); letter-spacing:1px; }
.hero h1 { font-family:'Playfair Display',serif; font-size:2.2rem; font-weight:800; margin:8px 0; }
.hero h1 em { font-style:italic; color:var(--accent); }
.hero-sub { font-size:1rem; color:var(--text-mid); line-height:1.7; }
.cb { background:var(--surface-alt); padding:16px 0 16px 18px; margin:18px 0; border-left:3px solid var(--accent); }
.cb-label { font-family:'Fira Code',monospace; font-size:.65rem; text-transform:uppercase; letter-spacing:1.5px; margin-bottom:6px; font-weight:600; color:var(--accent); }
.cb.tip { border-left-color:var(--blue); } .cb.tip .cb-label { color:var(--blue); }
.cb.warn { border-left-color:var(--gold); } .cb.warn .cb-label { color:var(--gold); }
.cb.danger { border-left-color:var(--danger); } .cb.danger .cb-label { color:var(--danger); }
.cb.success { border-left-color:var(--green); } .cb.success .cb-label { color:var(--green); }
.cb.purple { border-left-color:var(--purple); } .cb.purple .cb-label { color:var(--purple); }
.math-block { background:rgba(0,0,0,.02); padding:12px 16px; margin:10px 0; overflow-x:auto; }
.math-block.hero-formula { background:var(--surface-alt); text-align:center; }
.math-block.result { border-left:2px solid var(--green); background:rgba(74,124,89,.04); }
.math-block.warning { border-left:2px solid var(--danger); background:rgba(179,58,58,.04); }
p { margin:6px 0; }
ul, ol { margin:8px 0 8px 20px; }
li { margin:2px 0; }
strong { font-weight:600; }
h3 { margin:18px 0 8px; font-family:'Playfair Display',serif; font-size:1.15rem; }
.dim { color:var(--text-dim); }
.accordion { margin:16px 0; }
.acc-item { border-bottom:1px solid rgba(0,0,0,.08); }
.acc-item:last-child { border-bottom:none; }
.acc-header { display:flex; align-items:center; gap:12px; padding:14px 0; cursor:pointer; user-select:none; }
.acc-num { width:24px; height:24px; background:var(--accent); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.75rem; flex-shrink:0; font-family:'JetBrains Mono',monospace; }
.acc-title { font-weight:600; font-size:.95rem; flex:1; color:var(--text); }
.acc-arrow { width:16px; height:16px; color:var(--text-dim); transition:transform .3s; flex-shrink:0; }
.acc-item.open .acc-arrow { transform:rotate(180deg); }
.acc-body { max-height:0; overflow:hidden; transition:max-height .3s ease; }
.acc-item.open .acc-body { max-height:8000px; }
.acc-inner { padding:4px 0 16px 36px; }
.ct { width:100%; border-collapse:collapse; margin:14px 0; font-size:.9rem; }
.ct th { text-align:left; padding:10px 14px; font-weight:600; color:var(--accent); border-bottom:1px solid var(--border-light); font-size:.75rem; letter-spacing:.5px; text-transform:uppercase; font-family:'Fira Code',monospace; }
.ct td { padding:9px 14px; border-bottom:1px solid var(--border-light); vertical-align:top; }
.ct tr:last-child td { border-bottom:none; }
.bottom-nav { display:flex; justify-content:space-between; margin-top:52px; padding-top:26px; border-top:1px solid var(--border-light); }
.bb { font-family:'JetBrains Mono',monospace; font-size:.85rem; background:none; border:none; color:var(--text); cursor:pointer; }
.bb:hover { color:var(--accent); text-decoration:underline; }
.bb:disabled { opacity:.35; cursor:not-allowed; }
.page-info { font-family:'JetBrains Mono',monospace; font-size:.75rem; color:var(--text-dim); }
mjx-container { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
@media(max-width:640px) { body { font-size:16px; } .hero h1 { font-size:1.7rem; } .acc-inner { padding:4px 0 16px 14px; } }

<div class="topbar">
  <div class="topbar-brand">Le Serie Numeriche · avanzato</div>

<script>
function acc(items) {
  return '<div class="accordion">' + items.map((it, i) =>
    '<div class="acc-item">' +
      '<div class="acc-header" onclick="toggleAcc(this)">' +
        '<div class="acc-num">' + (i + 1) + '</div>' +
        '<div class="acc-title">' + it.t + '</div>' +
        '<svg class="acc-arrow" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
      '</div>' +
      '<div class="acc-body"><div class="acc-inner">' + it.h + '</div></div>' +
    '</div>'
  ).join('') + '</div>';
}

function toggleAcc(el) {
  const item = el.parentElement;
  item.classList.toggle('open');
  if (item.classList.contains('open') && typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([item]);
  }
}

const S = [
{
  tag:"FONDAMENTI",
  title:"Successioni di <em>somme parziali</em>",
  nav:"Definizione",
  body:
    '<p>Cosa significa "sommare infiniti numeri"? Prendiamo una successione \\(a_1, a_2, a_3, \\dots\\) e proviamo a sommarne i termini uno dopo l\'altro. A ogni passo otteniamo una nuova successione, quella delle <strong>somme parziali</strong>:</p>' +
    '<div class="cb"><div class="cb-label">Somme parziali</div><div class="math-block hero-formula">\\[ S_n = a_1+a_2+\\cdots+a_n = \\sum_{k=1}^{n} a_k \\]</div></div>' +
    '<p>La domanda "quanto vale \\(a_1+a_2+a_3+\\cdots\\) all\'infinito" diventa allora una domanda che sappiamo già affrontare: <strong>qual è il limite della successione \\(S_n\\)</strong>, quando \\(n\\to+\\infty\\)?</p>' +
    '<div class="cb success"><div class="cb-label">Definizione di serie</div><p>Data una successione \\(a_n\\), si chiama <strong>serie</strong> di termine generale \\(a_n\\) la coppia (successione, successione delle somme parziali), indicata con il simbolo:</p><div class="math-block hero-formula">\\[ \\sum_{n=1}^{\\infty} a_n \\]</div><p>La serie si dice:</p><ul><li><strong>convergente</strong> con somma \\(S\\), se \\[\\displaystyle\\lim_{n\\to\\infty} S_n = S\\] (finito);</li><li><strong>divergente</strong>, se \\[\\displaystyle\\lim_{n\\to\\infty} S_n = \\pm\\infty\\];</li><li><strong>indeterminata</strong> (o oscillante), se il limite non esiste.</li></ul></div>' +
    '<div class="cb tip"><div class="cb-label">Un cambio di prospettiva</div><p>Nota che, se conosci la successione \\(S_n\\), puoi sempre recuperare il termine generale della serie: \\(a_n = S_n - S_{n-1}\\) (per \\(n\\geq2\\)). Serie e successioni sono, in questo senso, due facce della stessa idea: ogni serie è associata a una successione (le somme parziali), e ogni successione può essere vista come le somme parziali di un\'opportuna serie.</p></div>' +
    acc([
      { t:"Esempio — Costruire le somme parziali", h:'<p>Considera la serie di termine generale \\(a_n = \\dfrac{1}{2^n}\\). Calcoliamo le prime somme parziali:</p><div class="math-block">\\[ S_1=\\frac12=0.5, \\quad S_2=\\frac12+\\frac14=0.75, \\quad S_3=0.875, \\quad S_4=0.9375, \\ \\dots \\]</div><p class="dim">I valori si avvicinano sempre di più a 1: è ragionevole congetturare che la serie converga con somma \\(S=1\\). Lo dimostreremo con rigore nella prossima sezione, parlando delle serie geometriche.</p>' }
    ])
},
{
  tag:"CASI NOTEVOLI",
  title:"Serie <em>geometrica</em> e serie telescopiche",
  nav:"Geometrica",
  body:
    '<p>Poche serie si riescono a sommare esplicitamente in forma chiusa. Le due famiglie più importanti — e più utili come "pietre di paragone" per i criteri che vedremo dopo — sono la serie geometrica e le serie telescopiche.</p>' +
    '<div class="cb success"><div class="cb-label">Serie geometrica</div><p>Data una ragione \\(q\\), la serie geometrica di primo termine \\(a\\) è \\(\\sum_{n=0}^{\\infty} a\\,q^n\\). Ricordando la formula per la somma di una progressione geometrica finita, \\(S_n = a\\dfrac{1-q^{n+1}}{1-q}\\) (per \\(q\\neq1\\)):</p><div class="math-block hero-formula">\\[ \\sum_{n=0}^{\\infty} a\\,q^n = \\frac{a}{1-q} \\qquad \\text{se e solo se } |q|<1 \\tag{G} \\]</div></div>' +
    '<div class="cb purple"><div class="cb-label">Dimostrazione</div><p>Se \\(|q|<1\\), allora \\(q^{n+1}\\to0\\) per \\(n\\to\\infty\\) (una potenza con base di modulo minore di 1 tende a zero), quindi:</p><div class="math-block">\\[ \\lim_{n\\to\\infty} S_n = \\lim_{n\\to\\infty} a\\,\\frac{1-q^{n+1}}{1-q} = a\\,\\frac{1-0}{1-q} = \\frac{a}{1-q} \\]</div><p>Se invece \\(|q|\\geq1\\) (con \\(q\\neq1\\)), \\(q^{n+1}\\) non ha limite finito (diverge in modulo, o oscilla se \\(q\\leq-1\\)): la serie non converge. Per \\(q=1\\), \\(S_n=a(n+1)\\to\\pm\\infty\\): diverge. \\(\\blacksquare\\)</p></div>' +
    '<h3>Serie telescopiche</h3>' +
    '<p>Una serie si dice <strong>telescopica</strong> quando il termine generale si può scrivere come differenza di termini consecutivi di un\'altra successione, \\(a_n = b_n - b_{n+1}\\). In questo caso le somme parziali "si accorciano" quasi tutte, lasciando solo il primo e l\'ultimo termine:</p>' +
    '<div class="cb tip"><div class="cb-label">Il meccanismo del telescopio</div><div class="math-block">\\[ S_n = (b_1-b_2)+(b_2-b_3)+\\cdots+(b_n-b_{n+1}) = b_1 - b_{n+1} \\]</div><p>Tutti i termini "intermedi" si cancellano a due a due: da qui il nome, come i segmenti di un cannocchiale che scorrono uno dentro l\'altro.</p></div>' +
    acc([
      { t:"Esempio 1 — Verifica della congettura precedente", h:'<p>Riprendiamo \\(\\sum_{n=1}^\\infty \\dfrac{1}{2^n}\\). È geometrica con primo termine (per \\(n=1\\)) \\(a=\\frac12\\) e ragione \\(q=\\frac12\\):</p><div class="math-block">\\[ \\sum_{n=1}^\\infty \\left(\\frac12\\right)^n = \\frac{1/2}{1-1/2} = \\frac{1/2}{1/2} = 1 \\]</div><p class="dim">Confermiamo con rigore la congettura numerica della sezione precedente.</p>' },
      { t:"Esempio 2 — Serie telescopica classica", h:'<p>Calcola \\(\\displaystyle\\sum_{n=1}^\\infty \\frac{1}{n(n+1)}\\).</p><p>Scomponiamo in fratti semplici: \\(\\dfrac{1}{n(n+1)} = \\dfrac1n - \\dfrac1{n+1}\\). È telescopica con \\(b_n=\\frac1n\\):</p><div class="math-block">\\[ S_n = \\left(1-\\frac12\\right)+\\left(\\frac12-\\frac13\\right)+\\cdots+\\left(\\frac1n-\\frac1{n+1}\\right) = 1-\\frac1{n+1} \\]</div><div class="math-block result">\\[ \\sum_{n=1}^\\infty \\frac{1}{n(n+1)} = \\lim_{n\\to\\infty}\\left(1-\\frac1{n+1}\\right) = 1 \\]</div>' },
      { t:"Esempio 3 — Serie geometrica di segno alterno", h:'<p>Calcola \\(\\displaystyle\\sum_{n=0}^\\infty \\left(-\\frac13\\right)^n\\).</p><p>Geometrica con \\(a=1\\), \\(q=-\\frac13\\) (e \\(|q|=\\frac13<1\\)):</p><div class="math-block result">\\[ \\sum_{n=0}^\\infty \\left(-\\frac13\\right)^n = \\frac{1}{1-(-1/3)} = \\frac{1}{4/3} = \\frac34 \\]</div>' }
    ])
},
{
  tag:"CONDIZIONE",
  title:"La condizione <em>necessaria</em> per la convergenza",
  nav:"Necessaria",
  body:
    '<p>Prima di introdurre i criteri veri e propri, vediamo un test rapidissimo — ma solo per <strong>escludere</strong> la convergenza, mai per confermarla.</p>' +
    '<div class="cb success"><div class="cb-label">Teorema (condizione necessaria)</div><p>Se la serie \\(\\sum a_n\\) converge, allora il termine generale tende a zero:</p><div class="math-block hero-formula">\\[ \\sum_{n=1}^\\infty a_n \\ \\text{converge} \\quad\\Longrightarrow\\quad \\lim_{n\\to\\infty} a_n = 0 \\tag{CN} \\]</div></div>' +
    '<div class="cb purple"><div class="cb-label">Dimostrazione</div><p>Se la serie converge, esiste finito \\[\\displaystyle\\lim_{n\\to\\infty} S_n = S\\]. Poiché anche \\(S_{n-1}\\to S\\) (stesso limite, successione "shiftata" di un indice), e ricordando che \\(a_n=S_n-S_{n-1}\\):</p><div class="math-block">\\[ \\lim_{n\\to\\infty} a_n = \\lim_{n\\to\\infty}(S_n-S_{n-1}) = S-S = 0 \\quad \\blacksquare \\]</div></div>' +
    '<div class="cb danger"><div class="cb-label">Attenzione: il contrario è FALSO</div><p>\\(a_n\\to0\\) è <strong>necessaria</strong> ma non <strong>sufficiente</strong> per la convergenza. Il controesempio più celebre è la <strong>serie armonica</strong>:</p><div class="math-block hero-formula">\\[ \\sum_{n=1}^{\\infty} \\frac1n = 1+\\frac12+\\frac13+\\frac14+\\cdots \\]</div><p>Il termine generale \\(\\frac1n \\to 0\\), eppure la serie <strong>diverge</strong> (a \\(+\\infty\\))!</p></div>' +
    '<h3>Dimostrazione della divergenza della serie armonica</h3>' +
    '<div class="cb tip"><div class="cb-label">L\'argomento di Oresme (XIV secolo)</div><p>Raggruppiamo i termini in blocchi di lunghezza raddoppiante, e minoriamo ogni blocco con il suo termine più piccolo:</p><div class="math-block">\\[ \\underbrace{\\frac13+\\frac14}_{>\\, \\frac14+\\frac14=\\frac12} + \\underbrace{\\frac15+\\frac16+\\frac17+\\frac18}_{>\\,4\\cdot\\frac18=\\frac12} + \\cdots \\]</div><p>Ogni blocco contribuisce con più di \\(\\frac12\\): sommando infiniti blocchi, ciascuno maggiore di \\(\\frac12\\), la somma totale supera ogni valore prefissato, quindi \\(S_n \\to +\\infty\\). \\(\\blacksquare\\)</p></div>' +
    '<div class="cb warn"><div class="cb-label">Come usare la (CN) in pratica</div><p>Il test si usa così: se \\(a_n \\not\\to 0\\) (o il limite non esiste), la serie <strong>diverge o è indeterminata</strong> immediatamente — nessun bisogno di altri criteri. Se invece \\(a_n\\to0\\), non si può concludere nulla: serve un criterio più fine, come quelli che vedremo ora.</p></div>' +
    acc([
      { t:"Esempio — Applicare subito la condizione necessaria", h:'<p>La serie \\(\\displaystyle\\sum_{n=1}^\\infty \\frac{n}{n+1}\\) converge?</p><p>Calcoliamo il limite del termine generale: \\[\\displaystyle\\lim_{n\\to\\infty}\\frac{n}{n+1}=1 \\neq 0\\].</p><div class="math-block result">\\[ \\text{La serie diverge, senza bisogno di altri criteri.} \\]</div>' }
    ])
},
{
  tag:"CRITERI",
  title:"Criteri di <em>convergenza</em>",
  nav:"Criteri",
  body:
    '<p>Per le serie a termini <strong>positivi</strong> (\\(a_n\\geq0\\)), esistono criteri potenti che permettono di stabilire la convergenza senza dover calcolare esplicitamente la somma.</p>' +
    '<div class="cb success"><div class="cb-label">Criterio del confronto</div><p>Siano \\(0 \\leq a_n \\leq b_n\\) per ogni \\(n\\) (da un certo punto in poi). Allora:</p><ul><li>se \\(\\sum b_n\\) converge, anche \\(\\sum a_n\\) converge;</li><li>se \\(\\sum a_n\\) diverge, anche \\(\\sum b_n\\) diverge.</li></ul></div>' +
    '<div class="cb tip"><div class="cb-label">Perché funziona</div><p>Le somme parziali \\(S_n^{(a)}\\) sono crescenti (termini non negativi) e limitate superiormente da \\(S_n^{(b)} \\leq S^{(b)}\\): una successione crescente e limitata converge sempre (per il teorema di monotonia). Se invece \\(S_n^{(a)}\\to\\infty\\), a maggior ragione \\(S_n^{(b)}\\geq S_n^{(a)}\\to\\infty\\).</p></div>' +
    '<h3>Criterio del rapporto (D\'Alembert)</h3>' +
    '<div class="cb"><div class="cb-label">Enunciato</div><p>Sia \\(a_n>0\\) e supponiamo esista \\[\\displaystyle L = \\lim_{n\\to\\infty} \\frac{a_{n+1}}{a_n}\\]. Allora:</p><table class="ct"><tr><th>Valore di L</th><th>Conclusione</th></tr><tr><td>\\(L<1\\)</td><td>la serie converge</td></tr><tr><td>\\(L>1\\) (anche \\(+\\infty\\))</td><td>la serie diverge</td></tr><tr><td>\\(L=1\\)</td><td>il criterio non decide: serve altro</td></tr></table></div>' +
    '<div class="cb purple"><div class="cb-label">Perché funziona (idea della dimostrazione)</div><p>Se \\(L<1\\), scegliamo \\(q\\) con \\(L\\lt q<1\\). Da un certo indice in poi, \\(\\frac{a_{n+1}}{a_n}\\lt q\\), quindi i termini della serie decrescono più rapidamente di una progressione geometrica di ragione \\(q<1\\): per confronto con una serie geometrica convergente, anche \\(\\sum a_n\\) converge.</p></div>' +
    '<h3>Criterio della radice (Cauchy)</h3>' +
    '<div class="cb"><div class="cb-label">Enunciato</div><p>Sia \\(a_n\\geq0\\) e supponiamo esista \\[\\displaystyle L = \\lim_{n\\to\\infty} \\sqrt[n]{a_n}\\]. Valgono le <strong>stesse conclusioni</strong> del criterio del rapporto: converge se \\(L<1\\), diverge se \\(L>1\\), non decide se \\(L=1\\).</p></div>' +
    '<div class="cb warn"><div class="cb-label">Quale criterio scegliere</div><p>Il criterio del rapporto è comodo quando \\(a_n\\) contiene <strong>fattoriali</strong> o <strong>prodotti</strong> (il rapporto \\(a_{n+1}/a_n\\) semplifica bene); quello della radice è comodo quando \\(a_n\\) è già una <strong>potenza n-esima</strong> di qualcosa. Entrambi falliscono (\\(L=1\\)) sulle stesse serie "borderline", come la serie armonica.</p></div>' +
    acc([
      { t:"Esempio 1 — Criterio del rapporto", h:'<p>Studia la convergenza di \\(\\displaystyle\\sum_{n=1}^\\infty \\frac{n}{2^n}\\).</p><div class="math-block">\\[ \\frac{a_{n+1}}{a_n} = \\frac{(n+1)/2^{n+1}}{n/2^n} = \\frac{n+1}{2n} \\ \\xrightarrow[n\\to\\infty]{}\\ \\frac12 \\]</div><div class="math-block result">\\[ L=\\frac12<1 \\quad\\Rightarrow\\quad \\text{la serie converge} \\]</div>' },
      { t:"Esempio 2 — Criterio della radice", h:'<p>Studia la convergenza di \\(\\displaystyle\\sum_{n=1}^\\infty \\left(\\frac{n}{2n+1}\\right)^n\\).</p><div class="math-block">\\[ \\sqrt[n]{a_n} = \\frac{n}{2n+1} \\ \\xrightarrow[n\\to\\infty]{}\\ \\frac12 \\]</div><div class="math-block result">\\[ L=\\frac12<1 \\quad\\Rightarrow\\quad \\text{la serie converge} \\]</div>' },
      { t:"Esempio 3 — Confronto con la serie armonica", h:'<p>Studia la convergenza di \\(\\displaystyle\\sum_{n=1}^\\infty \\frac{1}{\\sqrt n}\\).</p><p>Poiché \\(\\sqrt n \\leq n\\) per \\(n\\geq1\\), si ha \\(\\dfrac{1}{\\sqrt n} \\geq \\dfrac1n\\). Per confronto con la serie armonica (divergente):</p><div class="math-block result">\\[ \\sum_{n=1}^\\infty \\frac{1}{\\sqrt n} \\ \\text{diverge} \\]</div><p class="dim">Nota: qui il criterio del rapporto darebbe \\(L=1\\) (non decide) — il confronto era la strada giusta.</p>' }
    ])
},
{
  tag:"PRATICA",
  title:"Esercizi e <em>sintesi</em>",
  nav:"Esercizi",
  body:
    '<p>Prova a risolvere ogni esercizio prima di aprire la soluzione.</p>' +
    acc([
      { t:"Problema 1 — Serie geometrica", h:'<p>Calcola \\(\\displaystyle\\sum_{n=1}^\\infty \\frac{3}{4^n}\\).</p><p>Primo termine (per \\(n=1\\)) \\(a=\\frac34\\), ragione \\(q=\\frac14\\):</p><div class="math-block result">\\[ \\sum_{n=1}^\\infty \\frac{3}{4^n} = \\frac{3/4}{1-1/4} = \\frac{3/4}{3/4} = 1 \\]</div>' },
      { t:"Problema 2 — Condizione necessaria", h:'<p>La serie \\(\\displaystyle\\sum_{n=1}^\\infty \\cos\\left(\\frac1n\\right)\\) converge?</p><p>\\[\\displaystyle\\lim_{n\\to\\infty}\\cos\\left(\\frac1n\\right) = \\cos(0) = 1 \\neq 0\\].</p><div class="math-block result">\\[ \\text{La serie diverge (condizione necessaria non soddisfatta).} \\]</div>' },
      { t:"Problema 3 — Serie telescopica", h:'<p>Calcola \\(\\displaystyle\\sum_{n=1}^\\infty \\left(\\frac{1}{\\sqrt n} - \\frac{1}{\\sqrt{n+1}}\\right)\\).</p><p>È telescopica con \\(b_n = \\frac1{\\sqrt n}\\): \\(S_n = 1 - \\frac{1}{\\sqrt{n+1}}\\).</p><div class="math-block result">\\[ \\sum_{n=1}^\\infty \\left(\\frac1{\\sqrt n}-\\frac1{\\sqrt{n+1}}\\right) = 1 \\]</div>' },
      { t:"Problema 4 — Criterio del rapporto con fattoriali", h:'<p>Studia \\(\\displaystyle\\sum_{n=1}^\\infty \\frac{n!}{n^n}\\).</p><div class="math-block">\\[ \\frac{a_{n+1}}{a_n} = \\frac{(n+1)!/(n+1)^{n+1}}{n!/n^n} = \\frac{n^n}{(n+1)^n} = \\left(\\frac{n}{n+1}\\right)^n = \\left(1-\\frac1{n+1}\\right)^n \\xrightarrow[n\\to\\infty]{} \\frac1e \\]</div><div class="math-block result">\\[ L = \\frac1e \\approx 0.37 < 1 \\quad\\Rightarrow\\quad \\text{converge} \\]</div>' },
      { t:"Problema 5 — Scegliere il criterio giusto", h:'<p>Studia \\(\\displaystyle\\sum_{n=1}^\\infty \\left(\\frac{2n+1}{3n+2}\\right)^n\\). Quale criterio conviene?</p><p>La forma \\((\\cdot)^n\\) suggerisce la <strong>radice</strong>:</p><div class="math-block">\\[ \\sqrt[n]{a_n} = \\frac{2n+1}{3n+2} \\xrightarrow[n\\to\\infty]{} \\frac23 \\]</div><div class="math-block result">\\[ L=\\frac23<1 \\quad\\Rightarrow\\quad \\text{converge} \\]</div>' }
    ]) +
    '<h3>Formule da ricordare</h3>' +
    '<table class="ct"><tr><th>Concetto</th><th>Formula</th></tr>' +
    '<tr><td>Somma parziale</td><td>\\(S_n = \\sum_{k=1}^n a_k\\)</td></tr>' +
    '<tr><td>Serie geometrica</td><td>\\(\\sum_{n=0}^\\infty aq^n = \\dfrac{a}{1-q}\\) se \\(|q|<1\\)</td></tr>' +
    '<tr><td>Condizione necessaria</td><td>converge \\(\\Rightarrow a_n\\to0\\) (non viceversa)</td></tr>' +
    '<tr><td>Criterio del rapporto</td><td>\\(L=\\lim \\frac{a_{n+1}}{a_n}\\): converge se \\(L<1\\)</td></tr>' +
    '<tr><td>Criterio della radice</td><td>\\(L=\\lim \\sqrt[n]{a_n}\\): converge se \\(L<1\\)</td></tr></table>' +
    '<div class="cb success"><div class="cb-label">Come orientarsi</div><p>Davanti a una serie, chiediti: il termine generale tende a zero? Se no, diverge subito. Se sì, riconosci una <strong>geometrica</strong> o una <strong>telescopica</strong> (somma esplicita)? Altrimenti: c\'è un <strong>fattoriale</strong> (rapporto) o una <strong>potenza n-esima</strong> (radice)? Se entrambi i criteri danno \\(L=1\\), prova il <strong>confronto</strong> con una serie nota, come la serie armonica.</p></div>'
}
];

let currentIdx = 0;

function render() {
  const s = S[currentIdx];
  const html = '<div class="hero">' +
    '<div class="hero-tag">' + s.tag + '</div>' +
    '<h1>' + s.title + '</h1></div>' +
    '<div class="section-body">' + s.body + '</div>' +
    '<div class="bottom-nav">' +
    '<button class="bb" onclick="prev()" ' + (currentIdx === 0 ? 'disabled' : '') + '>← Indietro</button>' +
    '<div class="page-info">' + (currentIdx + 1) + ' / ' + S.length + '</div>' +
    '<button class="bb" onclick="next()" ' + (currentIdx === S.length - 1 ? 'disabled' : '') + '>Avanti →</button>' +
    '</div>';

  document.getElementById('app').innerHTML = html;

  const pills = S.map((s, i) =>
    '<button class="nav-pill ' + (i === currentIdx ? 'active' : '') + '" onclick="go(' + i + ')">' + s.nav + '</button>'
  ).join('');
  document.getElementById('topNav').innerHTML = pills;

  if (typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([document.getElementById('app')]);
  }
  document.body.style.opacity = '1';
}

function prev() { if (currentIdx > 0) { currentIdx--; render(); window.scrollTo(0, 0); } }
function next() { if (currentIdx < S.length - 1) { currentIdx++; render(); window.scrollTo(0, 0); } }
function go(i) { currentIdx = i; render(); window.scrollTo(0, 0); }

render();
</script>
</body>
</html>
