function acc(items, off) {
  off = off || 0;
  return '<div class="accordion">' + items.map((it, i) =>
    '<div class="acc-item">' +
      '<div class="acc-header" onclick="toggleAcc(this)">' +
        '<div class="acc-num">' + (i + 1 + off) + '</div>' +
        '<div class="acc-title">' + it.t + '</div>' +
        '<svg class="acc-arrow" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
      '</div>' +
      '<div class="acc-body"><div class="acc-inner">' + it.h + '</div></div>' +
    '</div>'
  ).join('') + '</div>';
}

function toggleAcc(el) {
  const item = el.parentElement;
  item.classList.toggle('open');
  if (item.classList.contains('open') && typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([item]);
  }
}

const S = [

/* ---------- PARTE I ---------- */

{
  part:"Parte I — Descrivere il moto sul cerchio",
  tag:"GIOSTRE, LAVATRICI E DISCHI IN VINILE",
  title:"Un moto che <em>ritorna</em> su se stesso",
  nav:"Periodo e frequenza",
  body: R`
    <p>Sali su una giostra, accendi la centrifuga della lavatrice, metti sul piatto un disco in vinile: sono tre situazioni molto diverse, ma hanno in comune una cosa sola. Il punto che stai guardando percorre sempre la <strong>stessa circonferenza</strong>, e dopo un certo tempo si ritrova esattamente dov'era, pronto a ricominciare. Per descrivere un moto così non ti serve una fisica nuova: ti servono due o tre grandezze scelte bene.</p>
    <div class="cb"><div class="cb-label">Moto circolare uniforme</div><p>Un punto si muove di <strong>moto circolare uniforme</strong> quando la sua traiettoria è una circonferenza e la sua <strong>rapidità</strong> (il modulo della velocità) resta costante: in tempi uguali percorre archi uguali.</p></div>
    <div class="cb tip"><div class="cb-label">Periodo e frequenza</div>
      <ul style="margin-left:18px">
        <li><strong>Periodo</strong> \(T\): il tempo che il punto impiega a compiere <em>un giro completo</em>. Si misura in secondi (s).</li>
        <li><strong>Frequenza</strong> \(f\): quanti giri compie in <em>un secondo</em>. Si misura in hertz (Hz), cioè giri al secondo.</li>
      </ul>
      <div class="math-block hero-formula">\[ f = \frac{1}{T} \qquad\qquad T = \frac{1}{f} \]</div>
      <p>Più il moto è lento, più il periodo è lungo e la frequenza è bassa: sono grandezze <strong>inversamente proporzionali</strong>.</p>
    </div>
    <div class="cb success"><div class="cb-label">Esempio: il disco in vinile</div><p>Un giradischi gira a 33 giri al minuto. Un minuto sono 60 secondi, quindi la frequenza è
      \[ f = \frac{33}{60}\ \text{Hz} = 0{,}55\ \text{Hz} \]
      e il periodo è \(T = 1/f \approx 1{,}82\) s: un giro ogni quasi due secondi, il tempo di una battuta di un blues lento.</p></div>
    <div class="cb warn"><div class="cb-label">La trappola delle unità</div><p>I giri al minuto sono comodi nella vita (motori, dischi, lavatrici), ma <strong>non sono l'unità del Sistema Internazionale</strong>. Per passare da giri/min a Hz si divide per 60; per passare da Hz a giri/min si moltiplica per 60. Fallo <em>prima</em> di cominciare i calcoli, altrimenti i risultati saranno sbagliati di un fattore 60 senza che te ne accorga.</p></div>
    ` + acc([

      { t:"Esercizio — dal periodo ai giri al minuto", h:R`<p>Una pala di un frullatore compie un giro in \(T = 0{,}25\) s. Quanti giri compie al secondo e al minuto? <em>Traccia</em>: \(f = 1/T\); poi moltiplica per 60.</p><p><strong>Risultato:</strong> \(f = 4\ \text{Hz} = 240\) giri/min.</p>` },

{

  title:"Gradi e <em>radianti</em>",
  nav:"Radianti",
  body: R`
    <p>Per dire "quanto" un punto ha girato basta un angolo. Finora l'hai misurato in <strong>gradi</strong>, ma i gradi sono una scelta storica e un po' arbitraria (il 360 piaceva ai Babilonesi perché ha moltissimi divisori). In fisica serve un angolo che <em>parli la lingua delle lunghezze</em>, perché dobbiamo mettere in relazione quanto ruota un punto con quanta strada percorre. Quell'angolo è il <strong>radiante</strong>.</p>

    <p class="fig-cap">Un radiante è l'angolo al centro che sottende un arco lungo quanto il raggio.</p>
    <div class="cb"><div class="cb-label">Definizione di angolo in radianti</div>
      <div class="math-block hero-formula">\[ \theta = \frac{\ell}{R} \]</div>
      <p>dove \(\ell\) è la lunghezza dell'arco e \(R\) il raggio. È un rapporto tra due lunghezze: è un numero puro, l'unità "rad" è solo un'etichetta per ricordarci come lo abbiamo misurato. Per un giro intero l'arco è tutta la circonferenza, \(\ell = 2\pi R\), quindi \(\theta_{giro} = 2\pi\) rad.</p></div>
    <div class="cb tip"><div class="cb-label">La proporzione per passare da un'unità all'altra</div>
      <div class="math-block hero-formula">\[ \alpha_{gradi} : \alpha_{rad} = 360° : 2\pi \]</div>
      <p>Da qui, con il prodotto dei medi e degli estremi, ricavi le due formule operative:</p>
      \[ \alpha_{rad} = \alpha_{gradi}\cdot\frac{\pi}{180°} \qquad\qquad \alpha_{gradi} = \alpha_{rad}\cdot\frac{180°}{\pi} \]</div>
    <table class="ct">
      <tr><th>Gradi</th><th>0°</th><th>30°</th><th>45°</th><th>60°</th><th>90°</th><th>180°</th><th>270°</th><th>360°</th></tr>
      <tr><td><strong>Radianti</strong></td><td>\(0\)</td><td>\(\pi/6\)</td><td>\(\pi/4\)</td><td>\(\pi/3\)</td><td>\(\pi/2\)</td><td>\(\pi\)</td><td>\(3\pi/2\)</td><td>\(2\pi\)</td></tr>
    </table>
    <div class="cb success"><div class="cb-label">Due conversioni svolte</div>
      <p><strong>Da gradi a radianti.</strong> \(120° \to 120\cdot\dfrac{\pi}{180} = \dfrac{2\pi}{3}\) rad.</p>
      <p><strong>Da radianti a gradi.</strong> \(\dfrac{3\pi}{4}\) rad \(\to \dfrac{3\pi}{4}\cdot\dfrac{180°}{\pi} = 135°\).</p></div>
    <div class="cb warn"><div class="cb-label">Un trucco per non sbagliare</div><p>Ricorda la corrispondenza di base: <strong>\(\pi\) rad \(= 180°\)</strong>. Tutto il resto si ottiene da lì. Mezzo giro è \(\pi\), un quarto di giro \(\pi/2\), un ottavo di giro \(\pi/4\). Se il risultato di una conversione non rispetta queste proporzioni, c'è un errore.</p></div>
    ` + acc([
      { t:"Esercizio — da gradi a radianti", h:R`<p>Trasforma in radianti: \(72°\), \(135°\), \(225°\). <em>Traccia</em>: moltiplica per \(\pi/180\) e semplifica la frazione.</p><p><strong>Risultato:</strong> \(\dfrac{2\pi}{5}\); \(\dfrac{3\pi}{4}\); \(\dfrac{5\pi}{4}\).</p>` },
      { t:"Esercizio — da radianti a gradi", h:R`<p>Trasforma in gradi: \(\dfrac{\pi}{5}\), \(\dfrac{5\pi}{6}\), \(\dfrac{7\pi}{6}\). <em>Traccia</em>: moltiplica per \(180°/\pi\): il \(\pi\) si semplifica.</p><p><strong>Risultato:</strong> \(36°\); \(150°\); \(210°\).</p>` },
      { t:"Domanda concettuale — quanti gradi è 1 radiante?", h:R`<p>Dalla proporzione, \(\alpha_{gradi} = 1\cdot 180°/\pi \approx 57{,}3°\). Non è un valore "tondo" proprio perché il radiante nasce dal raggio e non da una convenzione sui giri. È il prezzo da pagare per avere formule poi molto più semplici.</p>` }
    ])
},

{
  part:"Parte I — Descrivere il moto sul cerchio",

  title:"Velocità <em>angolare</em> e velocità tangenziale",
  nav:"ω e v",
  body: R`
    <p>Un punto che gira ha due modi di "andare veloce". Può spazzare molti radianti in poco tempo (e allora gira in fretta), oppure percorrere molti metri in poco tempo (e allora sta correndo). Sono due grandezze diverse, legate dal raggio.</p>
    <div class="cb"><div class="cb-label">Velocità angolare</div>
      <p>È l'angolo spazzato nell'unità di tempo. Nel moto circolare uniforme è costante, e in un giro (\(\Delta\theta = 2\pi\), \(\Delta t = T\)) vale:</p>
      <div class="math-block hero-formula">\[ \omega = \frac{\Delta\theta}{\Delta t} = \frac{2\pi}{T} = 2\pi f \]</div>
      <p>Si misura in <strong>rad/s</strong>.</p></div>
    <div class="cb"><div class="cb-label">Velocità tangenziale</div>
      <p>È la rapidità con cui il punto percorre la circonferenza: in un giro percorre \(2\pi R\) in un tempo \(T\), quindi</p>
      <div class="math-block hero-formula">\[ v = \frac{2\pi R}{T} = 2\pi R f \qquad\Longrightarrow\qquad v = \omega R \tag{1} \]</div>
      <p>Si misura in <strong>m/s</strong>. La relazione \(v = \omega R\) è quella che userai di più in tutta la lezione.</p></div>
    ` + SVG_MCU + R`
    <p class="fig-cap">Il vettore velocità è tangente alla traiettoria; il vettore accelerazione, che incontreremo nella Parte II, punta verso il centro.</p>
    <div class="cb danger"><div class="cb-label">Dove punta la velocità</div><p>La velocità tangenziale <strong>non punta verso il centro</strong>, né verso l'esterno: è sempre <strong>tangente</strong> alla circonferenza. Lo vedi quando una fionda lascia andare il sasso, o quando il lanciatore del martello molla la presa: l'oggetto parte dritto, lungo la tangente nel punto in cui si trovava.</p></div>
    <div class="cb success"><div class="cb-label">Esempio: la pallina sulla corda</div>
      <p>Una pallina ruota su una circonferenza di raggio \(R = 90\) cm compiendo un giro ogni 3 s. Il raggio va convertito in metri: \(R = 0{,}90\) m.</p>
      \[ \omega = \frac{2\pi}{T} = \frac{2\pi}{3}\ \text{rad/s} \approx 2{,}09\ \text{rad/s} \qquad\qquad v = \omega R \approx 2{,}09\cdot 0{,}90 \approx 1{,}88\ \text{m/s} \]</div>
    <div class="cb purple"><div class="cb-label">Stessa ω, velocità tangenziali diverse</div>
      <p>Su una piattaforma che ruota a 60 giri/min (cioè \(f = 1\) Hz, \(\omega = 2\pi \approx 6{,}28\) rad/s), tutti i punti hanno la <strong>stessa velocità angolare</strong>, ma la velocità tangenziale dipende dalla distanza dal centro, perché \(v = \omega R\):</p>
      <table class="ct">
        <tr><th>R (m)</th><th>0,1</th><th>0,2</th><th>0,3</th><th>0,4</th><th>0,5</th></tr>
        <tr><td><strong>v (m/s)</strong></td><td>0,63</td><td>1,26</td><td>1,88</td><td>2,51</td><td>3,14</td></tr>
      </table>
      <p>Raddoppiare la distanza dal centro raddoppia la velocità: il grafico di \(v\) in funzione di \(R\) è una <strong>retta per l'origine</strong>, con pendenza \(\omega\).</p></div>
    ` + SVG_VR + R`
    <p class="fig-cap">Velocità tangenziale in funzione della distanza dal centro, per \(\omega = 6{,}28\) rad/s.</p>
    <p>Per questo, su una giostra, i cavallini più vicini al bordo corrono di più: fanno più strada nello stesso tempo, anche se tutti completano il giro insieme.</p>
    ` + acc([
      { t:"Esercizio — il rotore", h:R`<p>Il bordo di un rotore di raggio \(R = 25\) cm ha una velocità di 20 m/s. Calcola la velocità angolare, la frequenza e il periodo. <em>Traccia</em>: da \(v = \omega R\) ricava \(\omega\); poi \(f = \omega/2\pi\) e \(T = 1/f\).</p><p><strong>Risultato:</strong> \(\omega = 80\) rad/s; \(f \approx 12{,}7\) Hz; \(T \approx 0{,}0785\) s.</p>` },
      { t:"Esercizio — la ruota di raggio 30 cm", h:R`<p>Una ruota di raggio \(R = 30\) cm compie 4 giri al secondo. Calcola \(\omega\) e la velocità di un punto del bordo. <em>Traccia</em>: \(\omega = 2\pi f\), poi \(v = \omega R\).</p><p><strong>Risultato:</strong> \(\omega \approx 25{,}1\) rad/s; \(v \approx 7{,}54\) m/s.</p>` },
      { t:"Domanda concettuale — chi corre di più?", h:R`<p>Sulla Terra, una persona a Bassano del Grappa e una persona a Quito (sull'equatore) hanno la stessa velocità angolare? E la stessa velocità tangenziale? <em>Traccia</em>: la stessa \(\omega\) (la Terra gira rigida, un giro in 24 h per tutti); ma la velocità tangenziale dipende dalla distanza dall'<strong>asse</strong> di rotazione, che all'equatore è massima e ai poli è zero.</p>` }
    ])

{
  part:"Parte II — Il moto uniforme che accelera",
  tag:"IL TACHIMETRO È FERMO, EPPURE SENTI QUALCOSA CHE TI SPINGE",
  title:"Se la direzione cambia, la velocità <em>cambia</em>",
  nav:"Δv",
  body: R`
    <p>Sei in auto su una rotatoria, il tachimetro segna 30 km/h e non si muove. Eppure sei spinto contro la portiera. Se il moto fosse davvero "senza novità", non sentiresti niente. Dove sta il trucco? Nel fatto che la velocità è un <strong>vettore</strong>: ha modulo, direzione e verso, e basta che uno solo dei tre cambi perché la velocità cambi.</p>
    <div class="cb"><div class="cb-label">Accelerazione e variazione di velocità</div>
      <p>L'accelerazione media è la variazione del <em>vettore</em> velocità divisa per il tempo:</p>
      <div class="math-block hero-formula">\[ \vec a = \frac{\Delta\vec v}{\Delta t} = \frac{\vec v_2 - \vec v_1}{\Delta t} \]</div>
      <p>Nel moto circolare uniforme \(\vec v_1\) e \(\vec v_2\) hanno lo stesso modulo, ma <strong>direzioni diverse</strong>. La differenza non è zero: quindi c'è un'accelerazione, anche se il modulo della velocità non varia mai.</p></div>
    <div class="cb tip"><div class="cb-label">Come si fa la differenza di due vettori</div>
      <p>Si disegnano \(\vec v_1\) e \(\vec v_2\) con la stessa origine. Il vettore \(\Delta\vec v = \vec v_2 - \vec v_1\) è la freccia che va dalla <em>punta</em> di \(\vec v_1\) alla <em>punta</em> di \(\vec v_2\).</p></div>
    ` + SVG_DV + R`
    <div class="cb success"><div class="cb-label">Due casi da conoscere a memoria</div>
      <ul style="margin-left:18px">
        <li><strong>Curva di 90°.</strong> \(\vec v_1\) e \(\vec v_2\) sono perpendicolari, \(|\Delta\vec v|\) è la diagonale di un quadrato di lato \(v\): \(|\Delta\vec v| = v\sqrt 2\).</li>
        <li><strong>Curva di 180°.</strong> \(\vec v_2 = -\vec v_1\): \(|\Delta\vec v| = 2v\).</li>
      </ul>
      <p>Esempio: a \(v = 10\) m/s, una curva di 90° produce \(|\Delta\vec v| \approx 14{,}1\) m/s, una di 180° produce 20 m/s, <strong>senza che la rapidità sia cambiata di un briciolo</strong>.</p></div>
    ` + SVG_CURVA + R`
    <p class="fig-cap">A sinistra due istanti ravvicinati sulla circonferenza; a destra gli stessi vettori con la stessa origine: la freccia tratteggiata è \(\Delta\vec v = \vec v_2 - \vec v_1\).</p>
    <div class="cb purple"><div class="cb-label">Dove punta Δv</div><p>Se disegni \(\Delta\vec v\) tra due istanti molto vicini, vedi che punta <strong>verso l'interno della curva</strong>, cioè verso il centro della circonferenza. L'accelerazione ha la stessa direzione di \(\Delta\vec v\): anche lei punta al centro. È per questo che si chiama <em>centripeta</em> ("che cerca il centro").</p></div>
    ` + acc([
      { t:"Esercizio — lo slittino", h:R`<p>Uno slittino percorre una curva di 90° con velocità costante di 20 m/s. Quanto vale \(|\Delta\vec v|\) tra l'ingresso e l'uscita? E in una curva a U di 180°? <em>Traccia</em>: 90° \(\Rightarrow v\sqrt2\); 180° \(\Rightarrow 2v\).</p><p><strong>Risultato:</strong> \(|\Delta\vec v| \approx 28{,}3\) m/s; \(|\Delta\vec v| = 40\) m/s.</p>` },
      { t:"Domanda concettuale — la rapidità non basta", h:R`<p>Può un corpo avere accelerazione nulla e muoversi su una circonferenza? <em>Traccia</em>: no. Se l'accelerazione fosse nulla, per il primo principio il corpo procederebbe in <strong>linea retta</strong>. Curvare richiede sempre un'accelerazione, ed è proprio la sua direzione (al centro) a tenerlo sulla curva.</p>` }
    ])
},

{
  part:"Parte II — Il moto uniforme che accelera",
  tag:"UNA FORMULA, DUE VOLTI",
  title:"L'accelerazione <em>centripeta</em>",
  nav:"a centripeta",
  body: R`
    <p>Sappiamo che l'accelerazione c'è e che punta al centro. Ci manca il valore. Si può ricavare con un ragionamento geometrico che richiede soltanto due triangoli e un po' di pazienza.</p>
    <div class="cb"><div class="cb-label">L'accelerazione centripeta</div>
      <div class="math-block hero-formula">\[ a_c = \frac{v^2}{R} = \omega^2 R \tag{2} \]</div>
      <p>La direzione è quella del raggio, il verso è verso il centro, il modulo è costante nel moto circolare uniforme (ma il <em>vettore</em> cambia direzione di istante in istante). Si misura in m/s².</p></div>
    <div class="cb purple"><div class="cb-label">Da dove viene (per chi vuole il ragionamento)</div>
      <p>In un piccolo intervallo \(\Delta t\), il punto spazza un angolo \(\Delta\theta = \omega\,\Delta t\). In quel tempo, la velocità ruota dello <em>stesso</em> angolo \(\Delta\theta\). Il triangolo formato da \(\vec v_1\), \(\vec v_2\) e \(\Delta\vec v\) è isoscele, con angolo al vertice \(\Delta\theta\) e lati uguali di lunghezza \(v\). Se \(\Delta\theta\) è piccolo, il lato \(\Delta v\) è quasi un arco di raggio \(v\), quindi</p>
      \[ |\Delta\vec v| \approx v\,\Delta\theta \quad\Longrightarrow\quad a_c = \frac{|\Delta\vec v|}{\Delta t} = \frac{v\,\Delta\theta}{\Delta t} = v\,\omega \]
      <p>Con \(v = \omega R\) si ottiene \(a_c = \omega^2 R\), e con \(\omega = v/R\) si ottiene \(a_c = v^2/R\). Sono la stessa cosa scritta in due modi.</p></div>
    <div class="cb tip"><div class="cb-label">Che cosa dice la formula</div>
      <ul style="margin-left:18px">
        <li><strong>Se raddoppi la velocità</strong> (a raggio fisso), l'accelerazione diventa <strong>quattro volte</strong> più grande: \(a_c \propto v^2\).</li>
        <li><strong>Se dimezzi il raggio</strong> (a velocità fissa), l'accelerazione <strong>raddoppia</strong>: curve strette, accelerazioni grandi.</li>
        <li>Se la velocità angolare è fissa, \(a_c \propto R\): i punti più lontani dall'asse accelerano di più.</li>
      </ul></div>
    <div class="cb success"><div class="cb-label">Esempio: una curva d'autostrada</div>
      <p>Un'auto percorre una curva di raggio \(R = 300\) m a 108 km/h. Prima converti: \(108\ \text{km/h} = 30\ \text{m/s}\). Poi</p>
      \[ a_c = \frac{v^2}{R} = \frac{30^2}{300} = 3\ \text{m/s}^2 \]
      <p>circa un terzo dell'accelerazione di gravità: è quella "spinta laterale" che senti sul sedile.</p></div>
    <div class="cb danger"><div class="cb-label">E la forza centrifuga?</div><p>Nel moto circolare uniforme non agisce nessuna forza "verso l'esterno" sul corpo. Il motivo per cui sei spinto contro la portiera è l'<strong>inerzia</strong> (primo principio): il tuo corpo vorrebbe proseguire dritto, lungo la tangente, ed è l'auto che con la portiera lo costringe a curvare. La forza che davvero agisce su di te è quella che la portiera esercita <em>verso il centro</em>: la <strong>forza centripeta</strong>, che per il secondo principio vale \(F = m a_c\).</p></div>
    ` + acc([
      { t:"Esercizio — dati v e R", h:R`<p>Un punto percorre una circonferenza di raggio \(R = 2\) m con velocità \(v = 4\) m/s. Calcola l'accelerazione centripeta e il tempo che impiega a percorrere un quarto di giro. <em>Traccia</em>: \(a_c = v^2/R\); l'arco di un quarto di circonferenza è \(\ell = \tfrac{1}{4}\cdot 2\pi R = \pi R/2\) e \(\Delta t = \ell/v\).</p><p><strong>Risultato:</strong> \(a_c = 8\ \text{m/s}^2\); \(\Delta t = \pi/4 \approx 0{,}79\) s.</p>` },
      { t:"Esercizio — dato a e R", h:R`<p>Un punto su una circonferenza di raggio \(R = 0{,}5\) m ha un'accelerazione centripeta di 20 m/s². Quanto vale la velocità tangenziale? <em>Traccia</em>: da \(a_c = v^2/R\) ricava \(v = \sqrt{a_c R}\).</p><p><strong>Risultato:</strong> \(v = \sqrt{10} \approx 3{,}16\) m/s.</p>` },
      { t:"Domanda concettuale — raggi e velocità", h:R`<p>Due auto percorrono due curve con la stessa accelerazione centripeta. Una curva ha raggio quadruplo dell'altra. Che rapporto c'è tra le velocità? <em>Traccia</em>: \(v = \sqrt{a_c R}\), quindi a \(a_c\) fissa \(v \propto \sqrt R\): raggio quadruplo, velocità <strong>doppia</strong>.</p>` }
    ])
},

{
  part:"Parte II — Il moto uniforme che accelera",
  tag:"UN METODO, E POI NON SI SBAGLIA PIÙ",
  title:"La mappa delle <em>formule</em>",
  nav:"Il metodo",
  body: R`
    <p>Finora hai incontrato cinque grandezze: \(T\), \(f\), \(\omega\), \(v\), \(a_c\), più il raggio \(R\). Sembra una giungla di formule, in realtà sono tutte collegate in modo semplice, e il segreto è avere un'unica "stazione centrale" da cui passare: la <strong>velocità angolare</strong> \(\omega\).</p>
    <div class="cb"><div class="cb-label">La mappa</div>
      <table class="ct">
        <tr><th>Parto da…</th><th>Per trovare ω</th></tr>
        <tr><td>il periodo \(T\)</td><td>\(\omega = \dfrac{2\pi}{T}\)</td></tr>
        <tr><td>la frequenza \(f\)</td><td>\(\omega = 2\pi f\)</td></tr>
        <tr><td>la velocità \(v\) e il raggio \(R\)</td><td>\(\omega = \dfrac{v}{R}\)</td></tr>
        <tr><td>l'accelerazione \(a_c\) e il raggio \(R\)</td><td>\(\omega = \sqrt{\dfrac{a_c}{R}}\)</td></tr>
      </table>
      <p>Una volta trovata \(\omega\), tutto il resto è in discesa:</p>
      <table class="ct">
        <tr><th>Da \(\omega\) ricavo…</th><th>Formula</th><th>Serve \(R\)?</th></tr>
        <tr><td>il periodo \(T\)</td><td>\(T = \dfrac{2\pi}{\omega}\)</td><td>no</td></tr>
        <tr><td>la frequenza \(f\)</td><td>\(f = \dfrac{\omega}{2\pi}\)</td><td>no</td></tr>
        <tr><td>la velocità \(v\)</td><td>\(v = \omega R\)</td><td>sì</td></tr>
        <tr><td>l'accelerazione \(a_c\)</td><td>\(a_c = \omega^2 R\)</td><td>sì</td></tr>
      </table>
      <p>Il raggio entra solo quando si passa da una grandezza angolare a una lineare. La velocità angolare è il punto di passaggio obbligato tra tutte le grandezze del moto circolare.</p></div>
    <div class="cb warn"><div class="cb-label">Il metodo in quattro passi</div>
      <ol style="margin-left:18px">
        <li><strong>Unità SI.</strong> cm \(\to\) m; giri/min \(\to\) Hz (dividi per 60); km/h \(\to\) m/s (dividi per 3,6).</li>
        <li><strong>Raggio, non diametro.</strong> Se il testo dà il diametro, dividi per 2.</li>
        <li><strong>Trova \(\omega\)</strong>, la stazione centrale.</li>
        <li><strong>Scegli la formula</strong> per ciò che chiede il problema e controlla che il risultato sia sensato (l'ordine di grandezza, le unità).</li>
      </ol></div>
    <div class="cb success"><div class="cb-label">Esempio svolto: la centrifuga della lavatrice</div>
      <p>Il cestello ha diametro 50 cm e ruota a 900 giri/min. Calcola velocità tangenziale e accelerazione centripeta di un punto sul bordo.</p>
      <p><strong>1. Unità.</strong> \(f = 900/60 = 15\) Hz; \(R = 0{,}50/2 = 0{,}25\) m.</p>
      <p><strong>2. Stazione centrale.</strong> \(\omega = 2\pi f = 2\pi\cdot 15 \approx 94{,}2\) rad/s.</p>
      <p><strong>3. Risultati.</strong></p>
      \[ v = \omega R \approx 94{,}2\cdot 0{,}25 \approx 23{,}6\ \text{m/s} \qquad a_c = \omega^2 R \approx 94{,}2^2\cdot 0{,}25 \approx 2{,}2\cdot 10^3\ \text{m/s}^2 \]
      <p>L'accelerazione è circa 226 volte quella di gravità: è proprio ciò che strizza i panni.</p></div>
    <div class="cb success"><div class="cb-label">Esempio svolto: parto dall'accelerazione</div>
      <p>Un punto sul bordo di una puleggia di diametro 20 cm ha accelerazione centripeta \(a_c = 50\ \text{m/s}^2\). Quanti giri al minuto compie la puleggia?</p>
      <p><strong>1. Unità.</strong> \(R = 0{,}10\) m.</p>
      <p><strong>2. Stazione centrale.</strong> \(\omega = \sqrt{a_c/R} = \sqrt{500} \approx 22{,}4\) rad/s.</p>
      <p><strong>3. Risultati.</strong> \(v = \omega R \approx 2{,}24\) m/s; \(f = \omega/2\pi \approx 3{,}56\) Hz, cioè \(3{,}56 \cdot 60 \approx 214\) giri/min.</p></div>
    ` + acc([
      { t:"Esercizio — la sega circolare", h:R`<p>La lama di una sega circolare ha diametro 20 cm e ruota a 3000 giri/min. Calcola velocità tangenziale e accelerazione centripeta dei denti. <em>Traccia</em>: \(f = 3000/60 = 50\) Hz; \(R = 0{,}10\) m; poi \(\omega = 2\pi f\).</p><p><strong>Risultato:</strong> \(\omega \approx 314\) rad/s; \(v \approx 31{,}4\) m/s; \(a_c \approx 9{,}9\cdot 10^3\ \text{m/s}^2\) (circa 1000 volte \(g\)).</p>` },
      { t:"Esercizio — la centrifuga di laboratorio", h:R`<p>Una provetta, a 0,20 m dall'asse di una centrifuga, subisce un'accelerazione centripeta di 500 m/s². Calcola velocità, frequenza e giri al minuto. <em>Traccia</em>: \(\omega = \sqrt{a_c/R}\).</p><p><strong>Risultato:</strong> \(\omega = 50\) rad/s; \(v = 10\) m/s; \(f \approx 7{,}96\) Hz \(\approx 477\) giri/min.</p>` },
      { t:"Domanda concettuale — qual è l'errore più frequente?", h:R`<p>Dimenticarsi di convertire giri/min in Hz e usare direttamente i giri al minuto come se fossero giri al secondo. Il risultato è fuori di un fattore 60 (o di \(60^2\) per l'accelerazione, che dipende dal quadrato). Se la velocità della lavatrice ti viene di 1400 m/s, rileggi il testo.</p>` }
    ])
},

{
  part:"Parte III — Dalla lavatrice alla Luna",
  tag:"IL PUNTO CHE NON SCIVOLA",
  title:"Ruote e <em>cinghie</em>",
  nav:"Ruote e cinghie",
  body: R`
    <p>Due situazioni quotidianissime nascondono lo stesso trucco: una bicicletta che avanza e una cinghia che collega due pulegge. In entrambe c'è un'uguaglianza tra velocità che trasforma un problema "difficile" in una sola equazione.</p>
    <div class="cb"><div class="cb-label">La bicicletta: la ruota che non scivola</div>
      <p>Se la ruota rotola <em>senza strisciare</em>, il punto del bordo che tocca terra è fermo rispetto al terreno, e la ruota "srotola" sul suolo una lunghezza pari all'arco percorso. Visto dal telaio della bici, un punto del bordo ha velocità tangenziale
      \[ v_{bordo} = v_{bici} \]
      Per questo il contachilometri di una bici, che conta solo i giri della ruota, riesce a misurare la velocità.</p></div>
    <div class="cb success"><div class="cb-label">Esempio svolto: la bici a 18 km/h</div>
      <p>Una bici procede a 18 km/h, con ruote di diametro 70 cm. Prima le unità: \(v = 18/3{,}6 = 5\) m/s; \(R = 0{,}35\) m.</p>
      \[ \omega = \frac{v}{R} = \frac{5}{0{,}35} \approx 14{,}3\ \text{rad/s} \qquad f = \frac{\omega}{2\pi} \approx 2{,}27\ \text{Hz} \approx 136\ \text{giri/min} \]
      \[ T = \frac{1}{f} \approx 0{,}44\ \text{s} \qquad a_c = \frac{v^2}{R} = \frac{25}{0{,}35} \approx 71{,}4\ \text{m/s}^2 \]
      <p>Un punto sul copertone subisce quindi un'accelerazione di oltre sette \(g\), a una velocità che definiresti "tranquilla".</p></div>
    <div class="cb"><div class="cb-label">La cinghia di trasmissione</div>
      <p>Due ruote collegate da una cinghia che non scivola: ogni punto della cinghia ha la stessa velocità, e quindi <strong>le due ruote hanno la stessa velocità tangenziale sul bordo</strong>:</p>
      <div class="math-block hero-formula">\[ v_1 = v_2 \quad\Longrightarrow\quad \omega_1 R_1 = \omega_2 R_2 \quad\Longrightarrow\quad f_1 R_1 = f_2 R_2 \]</div>
      <p>La ruota più piccola gira <strong>più in fretta</strong>: frequenza e raggio sono inversamente proporzionali. È il principio del cambio della bicicletta.</p></div>
    ` + SVG_CINGHIA + R`
    <p class="fig-cap">La ruota più piccola gira più in fretta: la cinghia impone la stessa velocità sul bordo di entrambe.</p>
    <div class="cb success"><div class="cb-label">Esempio svolto: motore e ventola</div>
      <p>Un motore con puleggia di diametro 8 cm gira a 1800 giri/min e, tramite una cinghia, aziona una ventola con puleggia di diametro 24 cm. Con \(f_1 = 30\) Hz, \(R_1 = 4\) cm e \(R_2 = 12\) cm:</p>
      \[ f_2 = f_1\,\frac{R_1}{R_2} = 30\cdot\frac{4}{12} = 10\ \text{Hz} = 600\ \text{giri/min} \]
      <p>La velocità della cinghia è \(v = 2\pi f_1 R_1 = 2\pi\cdot 30\cdot 0{,}04 \approx 7{,}54\) m/s. La ruota tre volte più grande gira tre volte più piano.</p></div>
    ` + acc([
      { t:"Esercizio — la ruota dell'auto", h:R`<p>Un'auto procede a 90 km/h con ruote di diametro 60 cm. Quanti giri al minuto compie ciascuna ruota? <em>Traccia</em>: \(v = 25\) m/s; \(R = 0{,}30\) m; \(\omega = v/R\); poi \(f = \omega/2\pi\) e moltiplica per 60.</p><p><strong>Risultato:</strong> \(\omega \approx 83{,}3\) rad/s; \(f \approx 13{,}3\) Hz \(\approx 796\) giri/min.</p>` },
      { t:"Esercizio — due pulegge", h:R`<p>Due ruote collegate da una cinghia hanno diametro 10 cm e 30 cm. La più piccola compie 300 giri. Quanti giri compie la più grande? <em>Traccia</em>: le velocità tangenziali sono uguali, quindi i giri compiuti nello stesso tempo stanno nel rapporto inverso dei raggi.</p><p><strong>Risultato:</strong> \(300\cdot\dfrac{10}{30} = 100\) giri.</p>` },
      { t:"Domanda concettuale — cambio della bici", h:R`<p>Salendo di marcia in una bici si passa a una corona anteriore più grande o a un pignone posteriore più piccolo. Perché a parità di pedalata la bici va più veloce? <em>Traccia</em>: il rapporto \(R_{corona}/R_{pignone}\) aumenta, quindi per ogni giro dei pedali il pignone (e la ruota) compie più giri: stessa \(\omega\) dei pedali, ma più \(\omega\) alla ruota.</p>` }

{
  part:"Parte III — Dalla lavatrice alla Luna",

  nav:"Il cielo",
  body: R`
    <p>Non serve cambiare formula per salire dal cestello della lavatrice al cielo: la fisica del moto circolare vale uguale. Cambiano solo le scale, e con loro i numeri, che diventano giganteschi o minuscoli. Una raccomandazione pratica: lavora in notazione scientifica e controlla sempre l'ordine di grandezza.</p>
    <div class="cb success"><div class="cb-label">Un punto dell'equatore</div>
      <p>La Terra compie un giro in 24 h attorno al suo asse, \(R_T = 6{,}4\cdot 10^6\) m. Un punto dell'equatore percorre una circonferenza di raggio \(R_T\) in \(T = 86400\) s:</p>
      \[ v = \frac{2\pi R_T}{T} = \frac{2\pi\cdot 6{,}4\cdot 10^6}{86400} \approx 465\ \text{m/s} \approx 1675\ \text{km/h} \]
      \[ a_c = \frac{v^2}{R_T} \approx \frac{465^2}{6{,}4\cdot 10^6} \approx 3{,}4\cdot 10^{-2}\ \text{m/s}^2 \]
      <p>Giriamo a più di 1600 km/h e non ce ne accorgiamo: l'accelerazione centripeta è circa lo 0,35% di \(g\), troppo piccola per sentirla (ma abbastanza per rendere il peso all'equatore un filo più leggero che ai poli).</p></div>
    <div class="cb"><div class="cb-label">La Luna e la mela, un secolo dopo</div>
      <p>La Luna orbita in un'orbita quasi circolare di raggio pari a 60 raggi terrestri, \(R = 60\cdot 6{,}4\cdot 10^6 = 3{,}84\cdot 10^8\) m, con periodo di 27,3 giorni (\(T = 2{,}36\cdot 10^6\) s).</p>
      \[ v = \frac{2\pi R}{T} \approx 1{,}02\cdot 10^3\ \text{m/s} \qquad a_c = \frac{v^2}{R} \approx 2{,}72\cdot 10^{-3}\ \text{m/s}^2 \]
      <p>Un dettaglio che farebbe sorridere Newton: \(g/60^2 = 9{,}8/3600 \approx 2{,}72\cdot 10^{-3}\ \text{m/s}^2\). L'accelerazione della Luna è esattamente quella della mela, ridotta di un fattore \(60^2\) perché la Luna è 60 volte più lontana dal centro della Terra. È il confronto che lo convinse che la gravità è una forza che decresce con il <strong>quadrato</strong> della distanza (la storia completa è nella lezione sulla gravitazione universale).</p></div>
    <div class="cb purple"><div class="cb-label">La Stazione Spaziale Internazionale</div>
      <p>La ISS orbita a circa 400 km di quota, quindi a \(R = 6{,}38\cdot 10^6 + 4{,}0\cdot 10^5 \approx 6{,}78\cdot 10^6\) m, con periodo di 92,7 min (\(T = 5562\) s).</p>
      \[ \omega = \frac{2\pi}{T} \approx 1{,}13\cdot 10^{-3}\ \text{rad/s} \qquad v = \omega R \approx 7{,}66\cdot 10^3\ \text{m/s} \qquad a_c = \omega^2 R \approx 8{,}65\ \text{m/s}^2 \]
      <p>L'accelerazione è circa l'88% di \(g\): a quella quota la gravità non è "quasi nulla", è quasi quella a terra. Gli astronauti sono senza peso perché sono in <strong>caduta libera continua</strong> attorno alla Terra, esattamente come in un ascensore col cavo spezzato, ma con una velocità tangente così grande che il suolo, curvando, "scappa" sempre davanti a loro.</p></div>
    ` + acc([
      { t:"Esercizio — un satellite da dati angolari", h:R`<p>Un satellite ha velocità angolare \(\omega = 5{,}5\cdot 10^{-4}\) rad/s e accelerazione centripeta \(a_c = 4{,}84\ \text{m/s}^2\). Calcola il raggio dell'orbita e la velocità. <em>Traccia</em>: da \(a_c = \omega^2 R\) ricava \(R = a_c/\omega^2\); poi \(v = \omega R\).</p><p><strong>Risultato:</strong> \(R \approx 1{,}6\cdot 10^7\) m (circa 2,5 raggi terrestri); \(v \approx 8{,}8\cdot 10^3\) m/s.</p>` },
      { t:"Esercizio — la Luna in un anno", h:R`<p>Quante rivoluzioni compie la Luna in un anno di 365 giorni, se un giro dura 27,3 giorni? <em>Traccia</em>: dividi 365 per 27,3.</p><p><strong>Risultato:</strong> circa 13,4 rivoluzioni (ed è per questo che ci sono, più o meno, tredici lune piene l'anno, non dodici).</p>` },
      { t:"Per chi vuole andare oltre", h:R`<p>Un satellite <strong>geostazionario</strong> resta sempre sopra lo stesso punto dell'equatore: significa che ha lo stesso periodo di rotazione della Terra (\(T \approx 86164\) s). Con un raggio orbitale di \(4{,}22\cdot 10^7\) m, calcola velocità e accelerazione centripeta: ottieni \(v \approx 3{,}08\cdot 10^3\) m/s e \(a_c \approx 0{,}22\ \text{m/s}^2\). Più è alta l'orbita, più è lenta e meno accelera.</p>` }
    ])
},

let currentIdx = 0;

function render() {
  const s = S[currentIdx];
  const html = '<div class="hero">' +
    '<div class="part-label">' + s.part + '</div>' +
    '<div class="hero-tag">' + s.tag + '</div>' +
    '<h1>' + s.title + '</h1></div>' +
    '<div class="section-body">' + s.body + '</div>' +
    '<div class="bottom-nav">' +
    '<button class="bb" onclick="prev()" ' + (currentIdx === 0 ? 'disabled' : '') + '>← Indietro</button>' +
    '<div class="page-info">' + (currentIdx + 1) + ' / ' + S.length + '</div>' +
    '<button class="bb" onclick="next()" ' + (currentIdx === S.length - 1 ? 'disabled' : '') + '>Avanti →</button>' +
    '</div>';

  document.getElementById('app').innerHTML = html;

  let pills = '';
  let lastPart = null;
  S.forEach((sec, i) => {
    if (sec.part !== lastPart) {
      const m = sec.part.match(/Parte\s+(\S+)/);
      pills += '<span class="nav-group">' + (m ? m[1] : '') + '</span>';
      lastPart = sec.part;
    }
    pills += '<button class="nav-pill ' + (i === currentIdx ? 'active' : '') + '" onclick="go(' + i + ')">' + sec.nav + '</button>';
  });
  document.getElementById('topNav').innerHTML = pills;

  if (typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([document.getElementById('app')]);
  }
  document.body.style.opacity = '1';
}

function prev() { if (currentIdx > 0) { currentIdx--; render(); window.scrollTo(0, 0); } }
function next() { if (currentIdx < S.length - 1) { currentIdx++; render(); window.scrollTo(0, 0); } }
function go(i) { currentIdx = i; render(); window.scrollTo(0, 0); }

function renderAll() {
  document.querySelector('.topbar').style.display = 'none';
  const html = S.map(s =>
    '<div class="section active">' +
      '<div class="hero">' +
        '<div class="part-label">' + s.part + '</div>' +
        '<div class="hero-tag">' + s.tag + '</div>' +
        '<h1>' + s.title + '</h1></div>' +
      '<div class="section-body">' + s.body + '</div>' +
    '</div>'
  ).join('');
  document.getElementById('app').innerHTML = html;
  document.querySelectorAll('.acc-item').forEach(el => el.classList.add('open'));
  if (typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([document.getElementById('app')]);
  }
  document.body.style.opacity = '1';
}

if (new URLSearchParams(location.search).get('print') === '1') {
  renderAll();
} else {
  render();
}
</script>
