<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lezione — Limiti di funzione</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<script>
MathJax = {
  tex: {
    inlineMath: [['\\(','\\)']],
    displayMath: [['\\[','\\]']],
  },
  svg: {
    fontCache: 'global',
    scale: 1.05
  },
  startup: {
    ready: () => {
      MathJax.startup.defaultReady();
      MathJax.startup.promise.then(() => {
        document.body.style.opacity = '1';
      });
    }
  }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"></script>
<style>
:root {
  --bg: #faf7f2;
  --surface: #ffffff;
  --surface-alt: #f5f0e8;
  --border: #e4ddd4;
  --border-light: #ece7de;
  --text: #2c2520;
  --text-mid: #5a524a;
  --text-dim: #6e6760;
  --accent: #c2185b;
  --accent-light: #fce4ec;
  --blue: #3a6b8c;
  --blue-light: #e8f0f5;
  --green: #4a7c59;
  --green-light: #eaf5ed;
  --purple: #6a1b9a;
  --purple-light: #f3e5f5;
  --gold: #b8860b;
  --gold-light: #fdf8ed;
  --teal: #4f6d7a;
  --teal-light: #e8eff2;
  --danger: #b33a3a;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(44,37,32,.04);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  font-family:'Georgia',serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.75;
  font-size:17px;
  opacity:0;
  transition: opacity .3s;
}

/* ── TOPBAR ── */
.topbar {
  position:fixed; top:0; left:0; right:0; z-index:100;
  background:rgba(250,247,242,.96);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border-light);
  height:52px; display:flex; align-items:center;
  padding:0 clamp(16px,4vw,40px); gap:16px;
}
.topbar-brand {
  font-family:'Playfair Display',serif;
  font-size:1.05rem; font-weight:700;
  color:var(--text); white-space:nowrap;
}
.topbar-nav {
  display:flex; gap:3px; overflow-x:auto;
  scrollbar-width:none; flex:1;
}
.topbar-nav::-webkit-scrollbar{display:none}
.nav-pill {
  background:none; border:none;
  font-family:'JetBrains Mono',monospace;
  font-size:.82rem; color:var(--text-dim);
  padding:6px 14px; border-radius:0;
  cursor:pointer; white-space:nowrap; transition:all .2s;
  border-bottom:2px solid transparent;
}
.nav-pill:hover{background:none;color:var(--text)}
.nav-pill.active{background:none;color:var(--accent);font-weight:600;border-bottom:2px solid var(--accent)}
.topbar-home {
  font-family:'JetBrains Mono',monospace;
  font-size:0.75rem; color:var(--text-dim);
  text-decoration:none; cursor:pointer;
  white-space:nowrap;
}
.topbar-home:hover{color:var(--accent)}

/* ── CONTAINER ── */
.container{max-width:780px;margin:0 auto;padding:84px clamp(20px,5vw,48px) 60px}

/* ── SECTIONS ── */
.section{display:none;animation:appear .4s ease}
.section.active{display:block}
@keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ── HERO ── */
.hero{margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border-light)}
.hero-tag{font-family:'Fira Code',monospace;font-size:.73rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(1.9rem,5vw,2.7rem);font-weight:800;line-height:1.15;margin-bottom:12px}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero-sub{font-size:1.02rem;color:var(--text-mid);max-width:580px;line-height:1.7;text-align:justify}

/* ── CONCEPT BOXES ── */
.cb{background:var(--surface-alt);border:none;border-radius:0;padding:16px 0 16px 18px;margin:18px 0;box-shadow:none;position:relative;border-left:2px solid var(--accent)}
.cb::before{content:'';position:absolute;left:0;top:0;bottom:0;width:0;display:none}
.cb-label{font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-weight:600;color:var(--accent)}
.cb.tip .cb-label{color:var(--blue)} .cb.warn .cb-label{color:var(--gold)}
.cb.danger .cb-label{color:var(--danger)} .cb.success .cb-label{color:var(--green)}
.cb.method .cb-label{color:var(--accent)} .cb.purple .cb-label{color:var(--purple)}
.cb.teal .cb-label{color:var(--teal)}

/* ── MATH DISPLAY BLOCKS ── */
.math-block {
  background: rgba(0,0,0,.02);
  border: none;
  border-radius: 0;
  padding: 12px 16px;
  margin: 10px 0;
  overflow-x: auto;
}
.math-block.dark { background: rgba(0,0,0,.04); }
.math-block.hero-formula {
  background: var(--surface-alt);
  border: none;
  padding: 16px 20px;
  text-align: center;
}
.math-block.result {
  border-left: 2px solid var(--green);
  background: rgba(74,124,89,.04);
  padding: 12px 16px;
  margin: 10px 0;
}
.math-block.warning {
  border-left: 2px solid var(--danger);
  background: rgba(179,58,58,.04);
  padding: 12px 16px;
  margin: 10px 0;
}

/* ── STEP-BY-STEP ── */
.step-math { margin: 6px 0; padding: 4px 0; }
.step-math .label {
  font-family: 'Fira Code', monospace;
  font-size: .72rem; letter-spacing: 1px;
  text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px;
}
.step-math .label.green { color: var(--green); }

/* ── ACCORDION ── */
.accordion{border:none;border-radius:0;overflow:visible;margin:16px 0;box-shadow:none}
.acc-item{border-bottom:1px solid rgba(0,0,0,.08);border-top:none}
.acc-item:last-child{border-bottom:none}
.acc-header{display:flex;align-items:center;gap:12px;padding:14px 0;background:none;cursor:pointer;transition:all .2s;user-select:none}
.acc-header:hover{background:none}
.acc-num{width:24px;height:24px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.acc-title{font-weight:600;font-size:.95rem;flex:1;color:var(--text);display:flex;justify-content:space-between;align-items:center;gap:12px}
.acc-arrow{width:16px;height:16px;color:var(--text-dim);transition:transform .3s;flex-shrink:0}
.acc-item.open .acc-arrow{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease;background:none}
.acc-item.open .acc-body{max-height:8000px}
.acc-inner{padding:8px 0 16px 36px;border-top:none}

/* ── TABLES ── */
.ct{width:100%;border-collapse:collapse;margin:14px 0;font-size:.9rem}
.ct th{text-align:left;padding:11px 14px;font-weight:600;color:var(--accent);border-bottom:1px solid var(--border-light);font-size:.78rem;letter-spacing:.5px;text-transform:uppercase;font-family:'Fira Code',monospace}
.ct td{padding:10px 14px;border-bottom:1px solid var(--border-light);vertical-align:top}
.ct tr:last-child td{border-bottom:none}

/* ── MATHJAX FORMATTING ── */
mjx-container[jax="SVG"] { text-align: center; }
mjx-munder { display: inline-block; }
mjx-munderover { display: inline-block; }

/* ── SVG ── */
.graph-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin:18px 0;box-shadow:var(--shadow);overflow-x:auto;text-align:center}
.graph-box svg text{font-family:'Georgia',serif}

/* ── FORM INDET GRID ── */
.fi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:18px 0}
.fi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:center}
.fi-card .fi-form{font-family:'Fira Code',monospace;font-size:1.1rem;font-weight:700;color:var(--danger);margin-bottom:8px}
.fi-card p{font-size:.88rem;color:var(--text-mid)}

/* ── DISC CARDS ── */
.disc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
.disc-card{text-align:center;padding:20px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow)}
.disc-card h4{font-family:'Fira Code',monospace;font-size:.9rem;margin-bottom:10px}

/* ── BOTTOM NAV ── */
.bottom-nav{display:flex;justify-content:space-between;align-items:center;margin-top:52px;padding-top:26px;border-top:1px solid var(--border-light)}
.bb{font-family:'JetBrains Mono',monospace;font-size:.85rem;padding:0;border:none;background:none;color:var(--text);transition:all .2s;cursor:pointer;text-decoration:none}
.bb:hover{color:var(--accent);text-decoration:underline}
.bb:disabled{opacity:.35;cursor:not-allowed;text-decoration:none}
.bb:disabled:hover{color:var(--text);text-decoration:none}
.bb.primary{background:none;color:var(--text);border:none;font-weight:400}
.bb.primary:hover{color:var(--accent);text-decoration:underline;background:none}
.page-info{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--text-dim)}

p{margin:6px 0}
ul,ol{margin:8px 0 8px 20px}
li{margin:2px 0}
.dim{color:var(--text-dim)}
strong{font-weight:600}
h2{margin:24px 0 12px}
h3{margin:16px 0 8px}

/* ── CHECKLIST ── */
.checklist{list-style:none;margin:12px 0}
.checklist li{position:relative;padding:6px 0 6px 32px;font-size:.95rem;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:all .2s}
.checklist li::before{content:'☐';position:absolute;left:6px;top:6px;font-size:1rem;color:var(--accent);transition:all .2s}
.checklist li.checked{color:var(--text-dim);text-decoration:line-through}
.checklist li.checked::before{content:'☑'}

/* ── MathJax overrides ── */
mjx-container[jax="SVG"] { direction: ltr; }
mjx-container { overflow-x: auto; overflow-y: hidden; max-width: 100%; }

@media(max-width:640px){
  body{font-size:16px}
  .hero h1{font-size:1.7rem}
  .acc-header{padding:13px 14px}
  .acc-inner{padding:4px 14px 18px}
  .cb{padding:18px}
  .disc-row{grid-template-columns:1fr}
  .fi-grid{grid-template-columns:repeat(2,1fr)}
  .math-block{padding:14px 16px}
  .svg-pair{grid-template-columns:1fr !important}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">Limiti</div>
  <div class="topbar-nav" id="topNav"></div>
  <a href="/" class="topbar-home">← home</a>
</div>
<div class="container" id="app"></div>

<script>
// ══════════════════════════
// Accordion builder
// ══════════════════════════
function acc(items) {
  return '<div class="accordion">'+items.map((it,i)=>`
    <div class="acc-item">
      <div class="acc-header" onclick="toggleAcc(this)">
        <div class="acc-num">${i+1}</div>
        <div class="acc-title">${it.t}</div>
        <svg class="acc-arrow" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <div class="acc-body"><div class="acc-inner">${it.h}</div></div>
    </div>`).join('')+'</div>';
}

function toggleAcc(el) {
  const item = el.parentElement;
  const wasOpen = item.classList.contains('open');
  item.classList.toggle('open');
  if (!wasOpen && typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([item]);
  }
}

// ══════════════════════════
// SVG helpers
// ══════════════════════════

// Function with a hole at x=a, approaching L
function svgLimite() {
  const w=560, h=300, ox=70, oy=250, sx=88, sy=74;
  const c='#c2185b';
  const g = x => 0.5 + 0.55*x - 0.05*x*x;   // curva liscia, sempre positiva nel range
  const a = 2.6, L = g(a);                    // il buco cade ESATTAMENTE sulla curva
  const xmin = 0.45, xmax = 5.25, gap = 0.09;
  const X = x => (ox + x*sx).toFixed(1);
  const Y = y => (oy - y*sy).toFixed(1);
  const seg = (x0,x1,n=44) => { let p=[]; for(let i=0;i<=n;i++){ const x=x0+(x1-x0)*i/n; p.push(`${X(x)},${Y(g(x))}`);} return p.join(' '); };
  const full = seg(xmin,xmax);
  const hx=X(a), hy=Y(L);
  const area = `M ${X(xmin)},${oy} L ${full.split(' ').join(' L ')} L ${X(xmax)},${oy} Z`;
  return `<div class="graph-box"><svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:500px;height:auto;display:block;margin:0 auto" role="img" aria-label="Funzione con un buco nel punto (a, L): il limite per x che tende ad a vale L">
    <defs>
      <linearGradient id="limGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${c}" stop-opacity=".15"/>
        <stop offset="1" stop-color="${c}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${area}" fill="url(#limGrad)" stroke="none"/>
    <line x1="${ox}" y1="24" x2="${ox}" y2="${oy+18}" stroke="#cfc7bb" stroke-width="1.4"/>
    <line x1="${ox-16}" y1="${oy}" x2="${w-10}" y2="${oy}" stroke="#cfc7bb" stroke-width="1.4"/>
    <polygon points="${ox},13 ${ox-5},25 ${ox+5},25" fill="#cfc7bb"/>
    <polygon points="${w-5},${oy} ${w-18},${oy-5} ${w-18},${oy+5}" fill="#cfc7bb"/>
    <text x="${ox-11}" y="21" fill="#8a827a" font-size="17" font-style="italic">y</text>
    <text x="${w-8}" y="${oy+22}" fill="#8a827a" font-size="17" font-style="italic">x</text>
    <line x1="${ox}" y1="${hy}" x2="${hx}" y2="${hy}" stroke="${c}" stroke-width="1.3" stroke-dasharray="4,4" opacity=".5"/>
    <line x1="${hx}" y1="${oy}" x2="${hx}" y2="${hy}" stroke="${c}" stroke-width="1.3" stroke-dasharray="4,4" opacity=".5"/>
    <line x1="${hx}" y1="${oy-4.5}" x2="${hx}" y2="${oy+4.5}" stroke="#8a827a" stroke-width="1.4"/>
    <text x="${hx}" y="${oy+26}" fill="#8a827a" font-size="17" text-anchor="middle" font-style="italic">a</text>
    <line x1="${ox-4.5}" y1="${hy}" x2="${ox+4.5}" y2="${hy}" stroke="#8a827a" stroke-width="1.4"/>
    <text x="${ox-13}" y="${(+hy)+6}" fill="#8a827a" font-size="17" text-anchor="end" font-style="italic">L</text>
    <polyline points="${seg(xmin, a-gap)}" fill="none" stroke="${c}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="${seg(a+gap, xmax)}" fill="none" stroke="${c}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${hx}" cy="${hy}" r="6" fill="var(--surface)" stroke="${c}" stroke-width="2.6"/>
    <text x="${(+hx)+42}" y="42" fill="var(--text)" font-size="16" text-anchor="end" font-style="italic">f(x) → L per x → a</text>
  </svg></div>`;
}

// Jump discontinuity
function svgSalto() {
  return `<div class="graph-box"><svg viewBox="0 0 700 560" style="width:100%;max-width:500px;height:auto;display:block;margin:0 auto" shape-rendering="geometricPrecision" role="img" aria-label="Funzione con un salto nel punto a: il limite sinistro e il limite destro sono diversi">
    <path d="M 90 500 L 90 60 M 84 74 L 90 58 L 96 74" fill="none" stroke="#cfc7bb" stroke-width="2.2" stroke-linecap="butt" stroke-linejoin="miter"></path>
    <path d="M 50 470 L 660 470 M 646 464 L 662 470 L 646 476" fill="none" stroke="#cfc7bb" stroke-width="2.2" stroke-linecap="butt" stroke-linejoin="miter"></path>
    <path d="M 380 470 L 380 480" stroke="#cfc7bb" stroke-width="2.2"></path>
    <path d="M 380 316 L 380 232" stroke="#a89f92" stroke-width="1.6" stroke-dasharray="7 6"></path>
    <path d="M 140 420 L 372 327" fill="none" stroke="#4a7c59" stroke-width="4" stroke-linecap="round"></path>
    <path d="M 388 220 L 620 128" fill="none" stroke="#ed6f5c" stroke-width="4" stroke-linecap="round"></path>
    <circle cx="380" cy="324" r="8.5" fill="#f7f1e6" stroke="#4a7c59" stroke-width="3.4"></circle>
    <circle cx="380" cy="224" r="8.5" fill="#f7f1e6" stroke="#ed6f5c" stroke-width="3.4"></circle>
    <text x="108" y="52" text-anchor="middle" dominant-baseline="hanging" style="font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:30px;fill:#5d5040">y</text>
    <text x="678" y="452" text-anchor="middle" dominant-baseline="middle" style="font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:30px;fill:#5d5040">x</text>
    <text x="380" y="508" text-anchor="middle" dominant-baseline="hanging" style="font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:30px;fill:#5d5040">a</text>
    <text x="336" y="396" text-anchor="end" dominant-baseline="middle" style="font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:27px;fill:#4a7c59">lim⁻</text>
    <text x="432" y="150" text-anchor="start" dominant-baseline="middle" style="font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:27px;fill:#ed6f5c">lim⁺</text>
  </svg></div>`;
}

// Vertical asymptote
function svgAsintotoV() {
  const w=260, h=160, ox=100, oy=80, sx=55, sy=20;
  const c='#6a1b9a';
  let ptsL=[], ptsR=[];
  for(let i=1;i<=25;i++){
    const x=-1.5+i*1.3/25;
    const y=1/(x);
    if(Math.abs(y)<6) ptsL.push(`${ox+x*sx},${oy-y*sy}`);
  }
  for(let i=0;i<=25;i++){
    const x=0.1+i*1.8/25;
    const y=1/(x);
    if(Math.abs(y)<6) ptsR.push(`${ox+x*sx},${oy-y*sy}`);
  }
  return `<div class="graph-box"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
    <line x1="${ox}" y1="5" x2="${ox}" y2="${h-5}" stroke="#e2dcd2" stroke-width="1"/>
    <line x1="10" y1="${oy}" x2="${w-10}" y2="${oy}" stroke="#e2dcd2" stroke-width="1"/>
    <line x1="${ox}" y1="5" x2="${ox}" y2="${h-5}" stroke="${c}" stroke-width="1.5" stroke-dasharray="5,4" opacity=".6"/>
    <text x="${ox+4}" y="16" fill="${c}" font-size="10" font-weight="600">x=a</text>
    <polyline points="${ptsL.join(' ')}" fill="none" stroke="${c}" stroke-width="2.5"/>
    <polyline points="${ptsR.join(' ')}" fill="none" stroke="${c}" stroke-width="2.5"/>
    <text x="14" y="${h-8}" fill="${c}" font-size="10" font-weight="600">asintoto verticale</text>
  </svg></div>`;
}

// Mini icons for the 3 discontinuity types (used inside the disc-cards)
function svgDiscMini(type) {
  const w=160, h=100, ox=20, oy=78, sx=17, sy=13;
  if (type === 'eliminabile') {
    const c = '#4a7c59';
    const g = x => 1.2 + 0.55*x - 0.06*x*x;
    const a = 4.2, gap = 0.35;
    const seg = (x0,x1,n=20) => { let p=[]; for(let i=0;i<=n;i++){ const x=x0+(x1-x0)*i/n; p.push(`${(ox+x*sx).toFixed(1)},${(oy-g(x)*sy).toFixed(1)}`);} return p.join(' '); };
    const hx=(ox+a*sx).toFixed(1), hy=(oy-g(a)*sy).toFixed(1);
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:150px;display:block;margin:0 auto">
      <line x1="${ox}" y1="10" x2="${ox}" y2="${oy}" stroke="#e2dcd2" stroke-width="1.4"/>
      <line x1="${ox}" y1="${oy}" x2="${w-8}" y2="${oy}" stroke="#e2dcd2" stroke-width="1.4"/>
      <polyline points="${seg(0.3,a-gap)}" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/>
      <polyline points="${seg(a+gap,7.3)}" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="${hx}" cy="${hy}" r="4" fill="var(--surface)" stroke="${c}" stroke-width="2"/>
    </svg>`;
  }
  if (type === 'salto') {
    const c1='#4a7c59', c2='#b8860b';
    const a=4, m=0.32, q=0.6, drop=1.6;
    const fL = x => m*x+q, fR = x => m*x+q+drop, gap=0.35;
    const seg = (f,x0,x1,n=14) => { let p=[]; for(let i=0;i<=n;i++){ const x=x0+(x1-x0)*i/n; p.push(`${(ox+x*sx).toFixed(1)},${(oy-f(x)*sy).toFixed(1)}`);} return p.join(' '); };
    const ax=(ox+a*sx).toFixed(1), yL=(oy-fL(a)*sy).toFixed(1), yR=(oy-fR(a)*sy).toFixed(1);
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:150px;display:block;margin:0 auto">

// Horizontal asymptote
function svgAsintotoO() {
  const w=280, h=150, ox=20, oy=75, sx=30, sy=30;
  const c='#4f6d7a', L=1;
  let pts=[];
  for(let i=0;i<=50;i++){
    const x=0.3+i*8/50;
    const y=L+2/x;
    if(y<5) pts.push(`${ox+x*sx},${oy-y*sy}`);
  }
  const ly=oy-L*sy;
  return `<div class="graph-box"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
    <line x1="${ox}" y1="8" x2="${ox}" y2="${oy+20}" stroke="#e2dcd2" stroke-width="1"/>
    <line x1="${ox-8}" y1="${oy}" x2="${w-8}" y2="${oy}" stroke="#e2dcd2" stroke-width="1"/>
    <line x1="${ox}" y1="${ly}" x2="${w-8}" y2="${ly}" stroke="${c}" stroke-width="1.5" stroke-dasharray="5,4" opacity=".7"/>
    <text x="${w-50}" y="${ly-5}" fill="${c}" font-size="10" font-weight="600">y=k</text>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="2.5"/>
    <text x="${ox+10}" y="22" fill="${c}" font-size="10" font-weight="600">f(x)→k per x→+∞</text>
  </svg></div>`;
}

              &= \\lim_{x \\to 0} \\frac{(\\sqrt{1+x}-1)(\\sqrt{1+x}+1)}{x(\\sqrt{1+x}+1)} \\\\[8pt]
              &= \\lim_{x \\to 0} \\frac{(1+x)-1}{x(\\sqrt{1+x}+1)}
              = \\lim_{x \\to 0} \\frac{x}{x(\\sqrt{1+x}+1)} \\\\[8pt]
              &= \\lim_{x \\to 0} \\frac{1}{\\sqrt{1+x}+1} = \\frac{1}{2}
            \\end{aligned}\\]
          </div>
        `
      },
      {
        t:"Strategia 3 — Potenza dominante (forma ∞/∞)",
        h:`
          <p>Per razionali fratte: dividi sopra e sotto per la <strong>potenza massima di \\(x\\)</strong> che compare.</p>
          <div class="math-block">
            \\[\\begin{aligned}
              \\lim_{x \\to +\\infty} \\frac{3x^2 - x + 2}{2x^2 + 5}
              &= \\lim_{x \\to +\\infty} \\frac{x^2(3 - 1/x + 2/x^2)}{x^2(2 + 5/x^2)} \\\\[8pt]
              &= \\lim_{x \\to +\\infty} \\frac{3 - 1/x + 2/x^2}{2 + 5/x^2} = \\frac{3}{2}
            \\end{aligned}\\]
          </div>
        `
      },
      {
        t:"Strategia 4 — Comune denominatore (forma ∞−∞)",
        h:`
          <p>Trasforma la differenza in un'unica frazione e poi studia il limite.</p>
          <div class="math-block">
            \\[\\begin{aligned}
              \\lim_{x \\to 0} \\left(\\frac{1}{x} - \\frac{1}{x^2}\\right)
              &= \\lim_{x \\to 0} \\frac{x - 1}{x^2}
            \\end{aligned}\\]
          </div>
          <p>Ora numeratore \\(\\to -1\\), denominatore \\(\\to 0^+\\):</p>
          <div class="math-block result">
            \\[ \\lim_{x \\to 0^+} \\frac{x-1}{x^2} = -\\infty \\]
          </div>
        `
      }
    ])}
  `
},

// ═══ 6: DISCONTINUITÀ ═══
{
  tag:"TEORIA",
  title:"Limiti e <em>discontinuità</em>",
  sub:"Tre tipi di interruzione: eliminabile, di salto, infinita.",
  nav:"Discontinuità",
  body:`
    <div class="cb method">
      <div class="cb-label">Schema classificazione</div>
    </div>

    <div class="disc-row">
      <div class="disc-card" style="border-color:var(--green)">
        <h4 style="color:var(--green)">Eliminabile</h4>
        <div style="margin:10px 0;font-size:.85rem">
          \\[ \\lim_{x\\to a} f = L \\]
          ma \\(f(a) \\neq L\\) o non esiste
        </div>
        ${svgDiscMini('eliminabile')}
        <p style="font-size:.82rem">"Buco" — si potrebbe tappare ponendo \\(f(a)=L\\)</p>
      </div>
      <div class="disc-card" style="border-color:var(--gold)">
        <h4 style="color:var(--gold)">Salto</h4>
        <div style="margin:10px 0;font-size:.85rem">
          \\[ \\lim_{x\\to a^-} f \\neq \\lim_{x\\to a^+} f \\]
          entrambi finiti
        </div>
        ${svgDiscMini('salto')}
        <p style="font-size:.82rem">Il grafico "salta" da una quota all'altra</p>
      </div>
      <div class="disc-card" style="border-color:var(--danger)">
        <h4 style="color:var(--danger)">Infinita</h4>
        <div style="margin:10px 0;font-size:.85rem">
          \\[ \\lim_{x\\to a^\\pm} f = \\pm\\infty \\]
        </div>
        ${svgDiscMini('infinita')}
        <p style="font-size:.82rem">Almeno un limite laterale è \\(\\pm\\infty\\) → asintoto verticale</p>
      </div>
    </div>

    ${acc([
      {
        t:"Discontinuità eliminabile \\(f(x) = \\dfrac{x^2-1}{x-1}\\)",
        h:`
          <p>Dominio: \\(x \\neq 1\\).</p>
          <div class="math-block">
            \\[ \\lim_{x \\to 1} \\frac{x^2-1}{x-1} = \\lim_{x \\to 1}(x+1) = 2 \\]
          </div>
          <p>Il limite esiste ed è finito, ma \\(f(1)\\) non è definita. Graficamente compare un <em>buco</em> nel punto \\((1,\\,2)\\). La discontinuità è <strong>eliminabile</strong>: basterebbe definire \\(f(1) = 2\\).</p>
        `
      },
      {
        t:"Discontinuità di salto — funzione segno",
        h:`
          <p>\\( f(x) = \\text{sgn}(x) = \\begin{cases} -1 & x < 0 \\\\ 0 & x=0 \\\\ 1 & x > 0 \\end{cases}\\)</p>
          <div class="math-block">
            \\[ \\lim_{x\\to 0^-} f(x) = -1 \\qquad \\lim_{x\\to 0^+} f(x) = +1 \\]
          </div>
          <div class="math-block warning">
            <p>I limiti laterali sono finiti ma diversi → limite non esiste → <strong>discontinuità di salto</strong>.</p>
          </div>
        `
      },
      {
        t:"Discontinuità infinita \\(f(x) = 1/x\\) in \\(x = 0\\)",
        h:`
          <div class="math-block">
            \\[ \\lim_{x \\to 0^-} \\frac{1}{x} = -\\infty \\qquad \\lim_{x \\to 0^+} \\frac{1}{x} = +\\infty \\]
          </div>
          <p>Almeno un limite laterale è infinito → <strong>discontinuità infinita</strong> → asintoto verticale \\(x = 0\\).</p>
        `
      }
    ])}
  `
},

// ═══ 7: ASINTOTI ═══
{
  tag:"TEORIA",
  title:"Gli <em>asintoti</em> come conseguenza dei limiti",
  sub:"Verticale, orizzontale, obliquo: tre modi in cui f(x) «scappa».",
  nav:"Asintoti",
  body:`
    <div class="cb method">
      <div class="cb-label">Asintoto verticale</div>
      <p>Se almeno uno dei limiti laterali è infinito:</p>
      <div class="math-block hero-formula">
        \\[ \\lim_{x \\to a^\\pm} f(x) = \\pm\\infty \\quad \\Rightarrow \\quad x = a \\text{ è asintoto verticale} \\]
      </div>
    </div>

    ${svgAsintotoV()}

    <div class="cb tip">
      <div class="cb-label">Asintoto orizzontale</div>
      <p>Se il limite all'infinito è finito:</p>
      <div class="math-block hero-formula">
        \\[ \\lim_{x \\to \\pm\\infty} f(x) = k \\quad \\Rightarrow \\quad y = k \\text{ è asintoto orizzontale} \\]
      </div>
      <p class="dim">Una funzione può avere asintoti orizzontali diversi a \\(+\\infty\\) e a \\(-\\infty\\).</p>
    </div>

    ${svgAsintotoO()}

    <div class="cb purple">
      <div class="cb-label">Asintoto obliquo</div>
      <p>Si cerca nella forma \\(y = mx + q\\) con \\(m \\neq 0\\). Si calcola:</p>
      <div class="math-block">
        \\[ m = \\lim_{x \\to \\pm\\infty} \\frac{f(x)}{x} \\]
      </div>
      <div class="math-block">
        \\[ q = \\lim_{x \\to \\pm\\infty} \\bigl(f(x) - mx\\bigr) \\]
      </div>
      <p>Se entrambi i limiti esistono finiti (con \\(m \\neq 0\\)), allora \\(y = mx + q\\) è asintoto obliquo.</p>
    </div>

    ${acc([
      {
        t:"Esempio asintoto obliquo \\(f(x) = \\dfrac{x^2+1}{x}\\)",
        h:`
          <div class="math-block">
            \\[ m = \\lim_{x\\to+\\infty} \\frac{x^2+1}{x^2} = 1 \\]
          </div>
          <div class="math-block">
            \\[ q = \\lim_{x\\to+\\infty} \\left(\\frac{x^2+1}{x} - x\\right) = \\lim_{x\\to+\\infty} \\frac{x^2+1-x^2}{x} = \\lim_{x\\to+\\infty} \\frac{1}{x} = 0 \\]
          </div>
          <div class="math-block result">
            \\[ y = x \\text{ è asintoto obliquo per } x\\to\\pm\\infty \\]
          </div>
          <p class="dim">Verifica: \\(\\dfrac{x^2+1}{x} = x + \\dfrac{1}{x}\\). La differenza \\(1/x \\to 0\\). Corretto.</p>
        `
      }
    ])}
  `
},

// ═══ 8: RAZIONALI FRATTE ═══
{
  tag:"CONCETTI CHIAVE",
  title:"Razionali fratte: limiti <em>all'infinito</em>",
  sub:"Il confronto dei gradi decide tutto.",
  nav:"Razionali fratte",
  body:`
    <div class="cb method">
      <div class="cb-label">Regola dei gradi</div>
      <p>Data \\(f(x) = \\dfrac{P(x)}{Q(x)}\\) con \\(n = \\deg P\\), \\(m = \\deg Q\\):</p>
    </div>

    <table class="ct">
      <tr><th>Condizione</th><th>\\[\lim_{x\to\pm\infty} f(x)\\]</th><th>Asintoto</th></tr>
      <tr>
        <td>\\(n < m\\)</td>
        <td style="color:var(--green)">\\(= 0\\)</td>
        <td>orizzontale \\(y = 0\\)</td>
      </tr>
      <tr>
        <td>\\(n = m\\)</td>
        <td style="color:var(--blue)">\\(= \\dfrac{a_n}{b_m}\\) (rapporto dei coefficienti direttori)</td>
        <td>orizzontale \\(y = \\dfrac{a_n}{b_m}\\)</td>
      </tr>
      <tr>
        <td>\\(n = m + 1\\)</td>
        <td style="color:var(--purple)">\\(\\pm\\infty\\) con legge lineare</td>
        <td>obliquo (fare la divisione)</td>
      </tr>
      <tr>
        <td>\\(n > m + 1\\)</td>
        <td style="color:var(--danger)">\\(\\pm\\infty\\) come potenza</td>
        <td>nessun asintoto oriz./obliquo</td>
      </tr>
    </table>

    ${acc([
      {
        t:"Caso n < m   \\(\\displaystyle\\lim_{x\\to\\infty} \\dfrac{3x+1}{x^2-2}\\)",
        h:`
          <p>\\(n = 1 < m = 2\\) → il denominatore "vince":</p>
          <div class="math-block result">
            \\[ \\lim_{x\\to+\\infty} \\frac{3x+1}{x^2-2} = 0 \\qquad \\text{asintoto orizzontale } y = 0 \\]
          </div>
        `
      },
      {
        t:"Caso n = m   \\(\\displaystyle\\lim_{x\\to\\infty} \\dfrac{5x^2-3}{2x^2+x+1}\\)",
        h:`
          <div class="math-block">
            \\[ \\lim_{x\\to+\\infty} \\frac{5x^2-3}{2x^2+x+1} = \\lim_{x\\to+\\infty} \\frac{x^2(5-3/x^2)}{x^2(2+1/x+1/x^2)} = \\frac{5}{2} \\]
          </div>
          <div class="math-block result">
            \\[ \\text{asintoto orizzontale } y = \\frac{5}{2} \\]
          </div>
        `
      },
      {
        t:"Caso n = m+1 <span style='font-family:\"Georgia\",serif;font-style:italic;font-size:0.85rem;color:var(--text-dim);'>(obliquo)</span>   \\(\\displaystyle\\lim_{x\\to\\infty} \\dfrac{x^2-1}{x+2}\\)",
        h:`
          <p>Divisione polinomiale: \\(x^2 - 1 = (x+2)(x-2) + 3\\), quindi \\(f(x) = x - 2 + \\dfrac{3}{x+2}\\).</p>
          <div class="math-block">
            \\[ m = \\lim_{x\\to\\infty} \\frac{f(x)}{x} = 1, \\quad q = \\lim_{x\\to\\infty}(f(x)-x) = -2 \\]
          </div>
          <div class="math-block result">
            \\[ \\text{asintoto obliquo: } y = x - 2 \\]
          </div>
        `
      }
    ])}
  `
},

// ═══ 9: CHECKLIST ═══
{
  tag:"RIEPILOGO",
  title:"Checklist: procedura di calcolo",
  sub:"Da usare come promemoria ogni volta che calcoli un limite.",
  nav:"Checklist",
  body:`
    <div class="cb method">
      <div class="cb-label">Procedura rapida</div>
      <ul class="checklist">
        <li><strong>Sostituisci</strong> direttamente (se \\(f\\) è continua in \\(a\\) → fatto)</li>
        <li>Se ottieni una forma indeterminata, <strong>riconoscila</strong>: \\(0/0\\), \\(\\infty/\\infty\\), \\(\\infty-\\infty\\), \\(0\\cdot\\infty\\)</li>
        <li><strong>Trasforma</strong>: scomponi, razionalizza, metti a comune denominatore, porta fuori la potenza dominante</li>
        <li>Se c'è un punto critico \\(a\\): calcola \\[ \\lim_{x\\to a^-} \\qquad \\lim_{x\\to a^+} \\] separatamente</li>
        <li>Verifica il <strong>criterio</strong>: limite esiste ↔ i due laterali sono uguali</li>
        <li>Se \\(x\\to\\pm\\infty\\): confronta i gradi (razionali) e verifica la presenza di asintoti</li>
      </ul>
    </div>

    <div class="cb tip">
      <div class="cb-label">Trovare gli asintoti</div>
      <ul class="checklist">
        <li><strong>Verticale</strong> \\(x = a\\): dove il denominatore si annulla → calcola i limiti laterali</li>
        <li><strong>Orizzontale</strong> \\(y = k\\): calcola \\[\\lim_{x\\to\\pm\\infty} f(x)\\]</li>
        <li><strong>Obliquo</strong> \\(y = mx+q\\): calcola \\(m = \\lim f(x)/x\\), poi \\(q = \\lim (f(x)-mx)\\)</li>
      </ul>
    </div>

    <div class="cb warn">
      <div class="cb-label">Limite vs. valore della funzione — non confondere</div>
      <table class="ct" style="margin-top:8px">
        <tr><th>Situazione</th><th>Limite</th><th>\\(f(a)\\)</th><th>Tipo</th></tr>
        <tr>
          <td>Funzione continua in \\(a\\)</td>
          <td>\\(= L\\)</td>
          <td>\\(= L\\)</td>
          <td style="color:var(--green)">Continua</td>
        </tr>
        <tr>
          <td>Buco nel grafico</td>
          <td>\\(= L\\) esiste</td>
          <td>non definita</td>
          <td style="color:var(--gold)">Disc. eliminabile</td>
        </tr>
        <tr>
          <td>Buco con valore sbagliato</td>
          <td>\\(= L\\) esiste</td>
          <td>\\(\\neq L\\)</td>
          <td style="color:var(--gold)">Disc. eliminabile</td>
        </tr>
        <tr>
          <td>Salto</td>
          <td>non esiste</td>
          <td>qualsiasi</td>
          <td style="color:var(--danger)">Disc. di salto</td>
        </tr>
        <tr>
          <td>Asintoto verticale</td>
          <td>\\(\\pm\\infty\\)</td>
          <td>non definita</td>
          <td style="color:var(--danger)">Disc. infinita</td>
        </tr>
      </table>
    </div>

    <div class="cb danger">
      <div class="cb-label">Errori da evitare</div>
      <ul class="checklist">
        <li><strong>Non scrivere</strong> \\(0/0 = 0\\) o \\(0/0 = 1\\) — è una forma indeterminata, non un numero</li>
        <li><strong>Non confondere</strong> il limite con il valore della funzione nel punto</li>
        <li><strong>Non dimenticare</strong> di verificare i limiti laterali quando la funzione è definita a tratti o ha punti critici</li>
        <li>\\(\\infty - \\infty\\) <strong>non è zero</strong> — è un'altra forma indeterminata</li>
      </ul>
    </div>
  `
}

];

// ══════════════════════════
// APP LOGIC
// ══════════════════════════
let cur = 0;
const tot = S.length;

function render() {
  document.getElementById('topNav').innerHTML = S.map((s,i) =>
    `<button class="nav-pill ${i===cur?'active':''}" onclick="goTo(${i})">${s.nav}</button>`
  ).join('');

  document.getElementById('app').innerHTML = S.map((s,i) => `
    <div class="section ${i===cur?'active':''}">
      <div class="hero">
        <div class="hero-tag">${s.tag}</div>
        <h1>${s.title}</h1>
        <p class="hero-sub">${s.sub}</p>
      </div>
      ${s.body}
      <div class="bottom-nav">
        <button class="bb" onclick="goTo(${i-1})" ${i===0?'disabled':''}>← Precedente</button>
        <span class="page-info">${i+1} / ${tot}</span>
        <button class="bb primary" onclick="goTo(${i+1})" ${i===tot-1?'disabled':''}>Successivo →</button>
      </div>
    </div>
  `).join('');

  if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
    const active = document.querySelector('.section.active');
    if (active) MathJax.typesetPromise([active]);
  }

  // Checklist interattiva
  document.querySelectorAll('.checklist li').forEach(li => {
    li.onclick = function(e) {
      e.stopPropagation();
      this.classList.toggle('checked');
    };
  });
}

function goTo(idx) {
  if (idx < 0 || idx >= tot) return;
  cur = idx;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goTo(cur + 1);
  if (e.key === 'ArrowLeft') goTo(cur - 1);
});

if (typeof MathJax !== 'undefined' && MathJax.startup) {
  MathJax.startup.promise.then(() => render());
} else {
  render();
  document.body.style.opacity = '1';
}
</script>
</body>
</html>
