<script>
function acc(items) {
  return '<div class="accordion">' + items.map((it, i) =>
    '<div class="acc-item">' +
      '<div class="acc-header" onclick="toggleAcc(this)">' +
        '<div class="acc-num">' + (i + 1) + '</div>' +
        '<div class="acc-title">' + it.t + '</div>' +
        '<svg class="acc-arrow" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
      '</div>' +
      '<div class="acc-body"><div class="acc-inner">' + it.h + '</div></div>' +
    '</div>'
  ).join('') + '</div>';
}

function toggleAcc(el) {
  const item = el.parentElement;
  item.classList.toggle('open');
  if (item.classList.contains('open') && typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([item]);
  }
}

function sysChart(rows, points, xMin, xMax) {
  const w = 560, leftPad = 84, rightPad = 22, rowH = 34;
  const x0 = leftPad, x1 = w - rightPad;
  const topPad = 16;
  const axisY = topPad + rows.length * rowH + 14;
  const h = axisY + 30;
  const sx = x => x0 + (x - xMin) / (xMax - xMin) * (x1 - x0);
  const bandTop = topPad - 8, bandBottom = axisY + 2;
  const highlight = rows.filter(r => r.system).flatMap(r => r.trueIntervals).map(seg => {
    const xa = seg.toInfinityLeft ? x0 - 14 : sx(seg.from);
    const xb = seg.toInfinityRight ? x1 + 14 : sx(seg.to);
    return `<rect x="${xa}" y="${bandTop}" width="${xb-xa}" height="${bandBottom-bandTop}" fill="var(--accent)" opacity=".07"/>`;
  }).join('');
  const rowsSvg = rows.map((row, i) => {
    const y = topPad + i * rowH + rowH / 2;
    const color = row.system ? 'var(--accent)' : 'var(--green)';
    const base = `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="var(--border)" stroke-width="2" stroke-dasharray="1,4" stroke-linecap="round"/>`;
    const segs = row.trueIntervals.map(seg => {
      const xa = seg.toInfinityLeft ? x0 - 10 : sx(seg.from);
      const xb = seg.toInfinityRight ? x1 + 10 : sx(seg.to);
      let extra = '';
      if (seg.toInfinityLeft) {
        extra += `<path d="M${x0-4},${y-4} L${x0-10},${y} L${x0-4},${y+4}" fill="${color}"/>`;
      } else {
        extra += `<circle cx="${sx(seg.from)}" cy="${y}" r="4.5" fill="${seg.openFrom ? 'var(--surface)' : color}" stroke="${color}" stroke-width="1.6"/>`;
      }
      if (seg.toInfinityRight) {
        extra += `<path d="M${x1+4},${y-4} L${x1+10},${y} L${x1+4},${y+4}" fill="${color}"/>`;
      } else {
        extra += `<circle cx="${sx(seg.to)}" cy="${y}" r="4.5" fill="${seg.openTo ? 'var(--surface)' : color}" stroke="${color}" stroke-width="1.6"/>`;
      }
      return `<line x1="${xa}" y1="${y}" x2="${xb}" y2="${y}" stroke="${color}" stroke-width="4.5" stroke-linecap="round"/>${extra}`;
    }).join('');
    const label = `<text x="6" y="${y+4}" font-size="11.5" font-family="'JetBrains Mono',monospace" fill="${row.system?'var(--accent)':'var(--text-mid)'}" font-weight="${row.system?700:400}">${row.name}</text>`;
    return `${label}${base}${segs}`;
  }).join('');
  const axis = `<line x1="${x0-14}" y1="${axisY}" x2="${x1+14}" y2="${axisY}" stroke="var(--text-dim)" stroke-width="1.3"/>
    <path d="M${x1+8},${axisY-4} L${x1+14},${axisY} L${x1+8},${axisY+4}" fill="none" stroke="var(--text-dim)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>`;
  const ticks = points.map(p => `
    <line x1="${sx(p.x)}" y1="${axisY-4}" x2="${sx(p.x)}" y2="${axisY+4}" stroke="var(--text-dim)" stroke-width="1.3"/>
    <text x="${sx(p.x)}" y="${axisY+19}" font-size="12" font-family="'JetBrains Mono',monospace" fill="var(--text)" text-anchor="middle">${p.label}</text>`).join('');
  return `<div class="graph-box"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="max-width:100%;height:auto">${highlight}${rowsSvg}${axis}${ticks}</svg></div>`;
}

const S = [
{
  tag:"FONDAMENTI",
  title:"Che cos'è una <em>frazione algebrica</em>",
  nav:"Frazioni",
  body:
    '<p>Una <strong>frazione algebrica</strong> non è altro che una <strong>divisione tra due polinomi</strong>, scritta in forma di frazione.</p>' +
    '<div class="cb"><div class="cb-label">Definizione</div><div class="math-block hero-formula">\\[ \\frac{N(x)}{D(x)} \\qquad \\text{con } D(x) \\neq 0 \\]</div><p>Il polinomio in alto, \\(N(x)\\), è il <strong>numeratore</strong> (il dividendo); quello in basso, \\(D(x)\\), è il <strong>denominatore</strong> (il divisore).</p></div>' +
    '<p>Ad esempio, la divisione \\((x+1) : (x^2-1)\\) diventa:</p>' +
    '<div class="math-block hero-formula">\\[ \\frac{x+1}{x^2-1} \\]</div>' +
    '<p>La differenza rispetto a una frazione numerica come \\(\\tfrac{3}{5}\\) è che qui compaiono delle <strong>lettere</strong>: il valore della frazione, e persino la sua stessa esistenza, dipendono dal valore di \\(x\\).</p>' +
    '<div class="cb tip"><div class="cb-label">Prerequisiti</div><p>Per lavorare con le frazioni algebriche servono due strumenti già visti: la <a href="/lezioni/fattorizzazione/lezione.html"><strong>fattorizzazione dei polinomi</strong></a> (per semplificare) e il <strong>minimo comune multiplo</strong> tra polinomi (per il denominatore comune).</p></div>'
},
{
  tag:"VINCOLI",
  title:"Le condizioni di <em>esistenza</em>",
  nav:"C.E.",
  body:
    '<p>C\'è una regola d\'oro, valida per ogni frazione: <strong>non si può dividere per zero</strong>. Per una frazione algebrica questo diventa un vincolo sui valori di \\(x\\).</p>' +
    '<div class="cb danger"><div class="cb-label">Condizione di esistenza</div><div class="math-block hero-formula">\\[ \\frac{N(x)}{D(x)} \\quad\\text{esiste}\\quad \\Longleftrightarrow \\quad D(x) \\neq 0 \\]</div></div>' +
    '<p>Per trovare le <strong>condizioni di esistenza</strong> (C.E.) si pone il denominatore <strong>uguale a zero</strong> e si escludono i valori trovati.</p>' +
    '<h3>Esempio guidato</h3>' +
    '<p>Data \\(\\dfrac{3x+15}{x^2-25}\\), poniamo il denominatore uguale a zero:</p>' +
    '<div class="math-block">\\[ x^2 - 25 = 0 \\;\\Rightarrow\\; x = 5 \\ \\text{oppure}\\ x = -5 \\]</div>' +
    '<div class="math-block result">\\[ \\text{C.E.:}\\quad x \\neq 5 \\ \\text{e}\\ x \\neq -5 \\]</div>' +
    '<div class="cb tip"><div class="cb-label">Insieme di definizione</div><p>I valori ammessi formano l\'<strong>insieme di definizione</strong> (o <em>dominio</em>): \\(\\{\\,x \\in \\mathbb{R} : x \\neq 5,\\ x \\neq -5\\,\\}\\). Le C.E. sono la condizione; il dominio è l\'insieme che ne risulta.</p></div>' +
    acc([
      { t:"Esercizio svolto — C.E. con denominatore di primo grado", h:'<p>Trova le C.E. di \\(\\dfrac{x}{x+2}\\).</p><p>Pongo \\(x + 2 = 0 \\Rightarrow x = -2\\).</p><div class="math-block result">\\[ \\text{C.E.:}\\quad x \\neq -2 \\]</div>' },
      { t:"Esercizio svolto — C.E. con prodotto al denominatore", h:'<p>Trova le C.E. di \\(\\dfrac{5}{(x-1)(2x-3)}\\).</p><p>Il prodotto si annulla se si annulla un fattore: \\(x-1=0\\) oppure \\(2x-3=0\\).</p><div class="math-block result">\\[ \\text{C.E.:}\\quad x \\neq 1 \\ \\text{e}\\ x \\neq \\tfrac{3}{2} \\]</div>' }
    ])
},
{
  tag:"SEMPLIFICARE",
  title:"Semplificare senza <em>errori</em>",
  nav:"Semplificare",
  body:
    '<p>Semplificare una frazione algebrica significa dividere numeratore e denominatore per un loro <strong>fattore comune</strong>. Il passo chiave è quindi <strong>fattorizzare</strong> entrambi.</p>' +
    '<div class="cb"><div class="cb-label">Procedura</div><ol><li>Determina le C.E. (sul denominatore <em>originale</em>);</li><li>fattorizza numeratore e denominatore;</li><li>semplifica i fattori comuni.</li></ol></div>' +
    '<h3>Esempio guidato</h3>' +
    '<p>Semplifichiamo \\(\\dfrac{x+1}{x^2-1}\\). Prima le C.E.: \\(x^2-1=0 \\Rightarrow x \\neq 1,\\ x \\neq -1\\). Poi fattorizziamo:</p>' +
    '<div class="math-block">\\[ \\frac{x+1}{x^2-1} = \\frac{x+1}{(x+1)(x-1)} = \\frac{1}{x-1} \\]</div>' +
    '<div class="math-block result">\\[ \\frac{1}{x-1} \\quad\\text{con}\\quad x \\neq 1,\\ x \\neq -1 \\]</div>' +
    '<div class="cb warn"><div class="cb-label">Le C.E. si scrivono prima</div><p>Nota: le condizioni si determinano sul denominatore <strong>di partenza</strong>. Anche se dopo la semplificazione \\(x=-1\\) sembra sparire, resta escluso: la frazione originale lì non esisteva.</p></div>' +
    '<div class="cb danger"><div class="cb-label">Errore gravissimo</div><p>Si semplificano solo <strong>fattori</strong> (cose moltiplicate), <strong>mai addendi</strong> (cose sommate).</p><div class="math-block warning">\\[ \\frac{a+b}{b} \\neq a \\qquad \\frac{3+5}{3} \\neq \\frac{5}{1} \\]</div><p>Nella frazione \\(\\dfrac{a+b}{b}\\) la \\(b\\) al numeratore è un <em>addendo</em>: non si può cancellare.</p></div>' +
    acc([
      { t:"Esercizio svolto — Semplificazione con raccoglimento", h:'<p>Semplifica \\(\\dfrac{3x+15}{x^2-25}\\).</p><p>C.E.: \\(x \\neq \\pm 5\\). Fattorizzo: al numeratore raccolgo 3, al denominatore uso la differenza di quadrati.</p><div class="math-block">\\[ \\frac{3(x+5)}{(x+5)(x-5)} = \\frac{3}{x-5} \\]</div>' },
      { t:"Errore da riconoscere", h:'<p>Perché \\(\\dfrac{2x^2 - 3y}{4x^4} \\neq \\dfrac{1 - 3y}{2x^2}\\)?</p><p>Perché al numeratore \\(2x^2\\) e \\(-3y\\) sono <strong>addendi</strong>: non c\'è un fattore comune da semplificare con \\(4x^4\\). Prima bisognerebbe raccogliere, se possibile.</p>' }
    ])
},
{
  tag:"OPERAZIONI",
  title:"Operazioni tra <em>frazioni</em>",
  nav:"Operazioni",
  body:
    '<p>Le regole sono le stesse delle frazioni numeriche — solo con i polinomi al posto dei numeri.</p>' +
    '<h3>Somma e differenza</h3>' +
    '<p>Servono lo <strong>stesso denominatore</strong>: si prende il <strong>minimo comune denominatore</strong> (il mcm dei denominatori fattorizzati), poi si sommano i numeratori.</p>' +
    '<div class="math-block hero-formula">\\[ \\frac{A}{D} \\pm \\frac{B}{D} = \\frac{A \\pm B}{D} \\]</div>' +
    '<h3>Prodotto e quoziente</h3>' +
    '<p>Il prodotto si fa "in linea"; il quoziente si trasforma in prodotto per il <strong>reciproco</strong>:</p>' +
    '<div class="math-block hero-formula">\\[ \\frac{A}{B} \\cdot \\frac{C}{D} = \\frac{A\\,C}{B\\,D} \\qquad \\frac{A}{B} : \\frac{C}{D} = \\frac{A}{B} \\cdot \\frac{D}{C} \\]</div>' +
    '<div class="cb success"><div class="cb-label">Due regole d\'oro</div><p><strong>1. Fattorizza i denominatori</strong> — serve a trovare il minimo comune denominatore.<br><strong>2. Sviluppa i numeratori</strong> — serve a sommare i termini simili prima di semplificare.</p></div>' +
    acc([
      { t:"Esercizio svolto — Somma con denominatore comune", h:'<p>Calcola \\(\\dfrac{x}{x+2} - \\dfrac{8}{x^2-4} + \\dfrac{2}{x-2}\\).</p><p>Fattorizzo: \\(x^2-4 = (x+2)(x-2)\\). Il denominatore comune è \\((x+2)(x-2)\\). C.E.: \\(x \\neq \\pm 2\\).</p><div class="math-block">\\[ \\frac{x(x-2) - 8 + 2(x+2)}{(x+2)(x-2)} \\]</div><p>Sviluppo il numeratore: \\(x^2 - 2x - 8 + 2x + 4 = x^2 - 4\\).</p><div class="math-block result">\\[ \\frac{x^2-4}{(x+2)(x-2)} = 1 \\quad (x \\neq \\pm 2) \\]</div>' },
      { t:"Esercizio svolto — Prodotto e semplificazione", h:'<p>Calcola \\(\\dfrac{x^2-1}{x} \\cdot \\dfrac{3x}{x+1}\\).</p><p>C.E.: \\(x \\neq 0,\\ x \\neq -1\\). Fattorizzo e semplifico:</p><div class="math-block">\\[ \\frac{(x+1)(x-1)}{x} \\cdot \\frac{3x}{x+1} = 3(x-1) \\]</div>' }
    ])
},
{
  tag:"EQUAZIONI",
  title:"Equazioni <em>fratte</em>",
  nav:"Equazioni",
  body:
    '<p>Un\'<strong>equazione fratta</strong> è un\'equazione in cui l\'incognita compare <strong>al denominatore</strong>. La novità rispetto alle equazioni intere è una sola, ma decisiva: bisogna sempre controllare le condizioni di esistenza.</p>' +
    '<div class="cb"><div class="cb-label">Metodo in quattro passi</div><ol><li><strong>C.E.</strong>: poni i denominatori diversi da zero;</li><li>riduci allo <strong>stesso denominatore</strong> e passa all\'equazione tra i numeratori;</li><li><strong>risolvi</strong> l\'equazione intera ottenuta;</li><li><strong>confronta</strong> le soluzioni con le C.E.: scarta quelle non accettabili.</li></ol></div>' +
    '<h3>Esempio guidato</h3>' +
    '<p>Risolviamo \\(\\dfrac{x}{x-2} = \\dfrac{2}{x-2} + 3\\).</p>' +
    '<p><strong>C.E.:</strong> \\(x - 2 \\neq 0 \\Rightarrow x \\neq 2\\).</p>' +
    '<p>Denominatore comune \\(x-2\\); uguaglio i numeratori:</p>' +
    '<div class="math-block">\\[ x = 2 + 3(x-2) \\;\\Rightarrow\\; x = 3x - 4 \\;\\Rightarrow\\; x = 2 \\]</div>' +
    '<div class="cb danger"><div class="cb-label">Soluzione da scartare</div><p>La soluzione trovata è \\(x = 2\\), ma le C.E. impongono \\(x \\neq 2\\): va <strong>scartata</strong>. L\'equazione è <strong>impossibile</strong> (nessuna soluzione).</p></div>' +
    '<div class="cb tip"><div class="cb-label">Legge di annullamento del prodotto</div><p>Quando l\'equazione si riduce a un prodotto uguale a zero, si usa la LAP: \\(P_1(x)\\cdot P_2(x) = 0\\) se e solo se \\(P_1(x)=0\\) oppure \\(P_2(x)=0\\).</p></div>' +
    acc([
      { t:"Esercizio svolto — Soluzione accettabile", h:'<p>Risolvi \\(\\dfrac{1}{x} + \\dfrac{1}{2} = \\dfrac{3}{x}\\).</p><p>C.E.: \\(x \\neq 0\\). Denominatore comune \\(2x\\):</p><div class="math-block">\\[ \\frac{2 + x}{2x} = \\frac{6}{2x} \\;\\Rightarrow\\; 2 + x = 6 \\;\\Rightarrow\\; x = 4 \\]</div><p>\\(x = 4\\) rispetta le C.E.:</p><div class="math-block result">\\[ x = 4 \\quad \\text{accettabile} \\]</div>' },
      { t:"Esercizio svolto — Uso della LAP", h:'<p>Risolvi \\(\\dfrac{x^2 - 5x + 6}{x-1} = 0\\).</p><p>C.E.: \\(x \\neq 1\\). Una frazione è nulla quando il <strong>numeratore</strong> è nullo:</p><div class="math-block">\\[ x^2 - 5x + 6 = 0 \\;\\Rightarrow\\; (x-2)(x-3)=0 \\]</div><div class="math-block result">\\[ x = 2 \\ \\text{oppure}\\ x = 3 \\quad (\\text{entrambe} \\neq 1) \\]</div>' }
    ])
},
{
  tag:"DISEQUAZIONI",
  title:"Disequazioni <em>fratte</em>",
  nav:"Disequazioni",
  body:
    '<p>In una <strong>disequazione fratta</strong> ci chiediamo <em>quando</em> una frazione algebrica è positiva o negativa. La chiave è che il segno di \\(\\dfrac{N}{D}\\) dipende dai segni di \\(N\\) e \\(D\\), con la regola dei segni della divisione.</p>' +
    '<div class="cb"><div class="cb-label">Metodo</div><ol><li>Porta tutto a un solo membro: \\(\\dfrac{N(x)}{D(x)} \\gtrless 0\\);</li><li>poni le <strong>C.E.</strong> (\\(D(x) \\neq 0\\));</li><li>studia separatamente il <strong>segno di \\(N(x)\\)</strong> e il <strong>segno di \\(D(x)\\)</strong>;</li><li>costruisci la <strong>tabella dei segni</strong> e ricava il segno del quoziente;</li><li>leggi la soluzione (il denominatore è <strong>sempre escluso</strong>).</li></ol></div>' +
    '<h3>Esempio guidato</h3>' +
    '<p>Risolviamo \\(\\dfrac{x-1}{x+2} \\geq 0\\). C.E.: \\(x \\neq -2\\).</p>' +
    '<p>Studio i segni: \\(N = x-1 \\geq 0 \\Rightarrow x \\geq 1\\); \\(D = x+2 > 0 \\Rightarrow x > -2\\).</p>' +
    sysChart([
      { name:'N ≥ 0', trueIntervals:[{from:1,toInfinityRight:true,openFrom:false}] },
      { name:'D > 0', trueIntervals:[{from:-2,toInfinityRight:true,openFrom:true}] },
      { name:'N/D ≥ 0', system:true, trueIntervals:[{toInfinityLeft:true,to:-2,openTo:true},{from:1,toInfinityRight:true,openFrom:false}] }
    ], [{x:-2,label:'-2'},{x:1,label:'1'}], -4, 4) +
    '<p>Vogliamo \\(\\dfrac{N}{D} \\geq 0\\): il quoziente è positivo dove \\(N\\) e \\(D\\) hanno lo <strong>stesso segno</strong> (entrambe le linee verdi presenti, oppure entrambe assenti), nullo dove \\(N = 0\\):</p>' +
    '<div class="math-block result">\\[ x < -2 \\quad \\text{oppure} \\quad x \\geq 1 \\]</div>' +
    '<div class="cb warn"><div class="cb-label">Estremi: aperto o chiuso?</div><p>In \\(x = 1\\) il numeratore si annulla e la frazione vale \\(0\\): con \\(\\geq\\) è <strong>incluso</strong>. In \\(x = -2\\) il denominatore si annulla: è <strong>sempre escluso</strong>, qualunque sia il verso.</p></div>' +
    acc([
      { t:"Esercizio svolto — Disequazione con < 0", h:'<p>Risolvi \\(\\dfrac{x+3}{x-1} < 0\\). C.E.: \\(x \\neq 1\\).</p><p>Segni: \\(N = x+3 > 0 \\Rightarrow x > -3\\); \\(D = x-1 > 0 \\Rightarrow x > 1\\). Il quoziente è negativo dove \\(N\\) e \\(D\\) hanno <strong>segno opposto</strong>:</p><div class="math-block result">\\[ -3 < x < 1 \\]</div><p class="dim">Estremi esclusi: in \\(-3\\) la disuguaglianza è stretta, in \\(1\\) il denominatore si annulla.</p>' }
    ])
},
{
  tag:"ESERCIZI",
  title:"Due esercizi <em>completi</em>",
  nav:"Esercizi",
  body:
    '<p>Due esercizi di difficoltà media, svolti passo per passo: un\'equazione fratta e una disequazione fratta.</p>' +
    '<h3>Esercizio 1 — Equazione fratta</h3>' +
    '<p>Risolvi \\(\\dfrac{x}{x-3} - \\dfrac{2}{x+1} = \\dfrac{12}{x^2-2x-3}\\).</p>' +
    '<p><strong>Passo 1: fattorizzo i denominatori.</strong> Il trinomio \\(x^2-2x-3\\) ha radici \\(3\\) e \\(-1\\), quindi \\(x^2-2x-3 = (x-3)(x+1)\\).</p>' +
    '<p><strong>Passo 2: condizioni di esistenza.</strong></p>' +
    '<div class="math-block">\\[ x-3 \\neq 0 \\ \\text{e}\\ x+1 \\neq 0 \;\\Rightarrow\; \\text{C.E.:}\\quad x \\neq 3 \\ \\text{e}\\ x \\neq -1 \\]</div>' +
    '<p><strong>Passo 3: denominatore comune</strong> \\((x-3)(x+1)\\), poi uguaglio i numeratori.</p>' +
    '<div class="math-block">\\[ x(x+1) - 2(x-3) = 12 \\]</div>' +
    '<p><strong>Passo 4: risolvo l\'equazione intera.</strong></p>' +
    '<div class="math-block">\\[ x^2 + x - 2x + 6 = 12 \;\\Rightarrow\; x^2 - x - 6 = 0 \;\\Rightarrow\; (x-3)(x+2) = 0 \\]</div>' +
    '<div class="math-block">\\[ x = 3 \\quad \\text{oppure} \\quad x = -2 \\]</div>' +
    '<p><strong>Passo 5: confronto con le C.E.</strong> \\(x = 3\\) è escluso dalle C.E.: va <strong>scartato</strong>. \\(x = -2\\) è ammesso.</p>' +
    '<div class="math-block result">\\[ x = -2 \\]</div>' +
    '<div class="cb tip"><div class="cb-label">Verifica</div><p>Per \\(x=-2\\): primo membro \\(\\dfrac{-2}{-5} - \\dfrac{2}{-1} = \\dfrac{2}{5} + 2 = \\dfrac{12}{5}\\); secondo membro \\(\\dfrac{12}{4+4-3} = \\dfrac{12}{5}\\). I due membri coincidono.</p></div>' +
    '<h3>Esercizio 2 — Disequazione fratta</h3>' +
    '<p>Risolvi \\(\\dfrac{2}{x-1} \\geq \\dfrac{x}{x+2}\\).</p>' +
    '<p><strong>Passo 1: C.E.</strong> \\(x \\neq 1\\) e \\(x \\neq -2\\).</p>' +
    '<p><strong>Passo 2: porto tutto a primo membro</strong> con denominatore comune \\((x-1)(x+2)\\).</p>' +
    '<div class="math-block">\\[ \\frac{2(x+2) - x(x-1)}{(x-1)(x+2)} \\geq 0 \;\\Rightarrow\; \\frac{-x^2+3x+4}{(x-1)(x+2)} \\geq 0 \\]</div>' +
    '<p>Al numeratore \\(-x^2+3x+4 = -(x^2-3x-4) = -(x-4)(x+1)\\). Moltiplico per \\(-1\\) <strong>invertendo il verso</strong>:</p>' +
    '<div class="math-block">\\[ \\frac{(x-4)(x+1)}{(x-1)(x+2)} \\leq 0 \\]</div>' +
    '<p><strong>Passo 3: studio del segno di \\(N\\) e di \\(D\\).</strong></p>' +
    '<ul><li>\\(N = (x-4)(x+1) \\geq 0\\): parabola rivolta verso l\'alto, radici \\(-1\\) e \\(4\\) \\(\\Rightarrow\\) \\(x \\leq -1\\) oppure \\(x \\geq 4\\).</li>' +
    '<li>\\(D = (x-1)(x+2) > 0\\): radici \\(-2\\) e \\(1\\) \\(\\Rightarrow\\) \\(x < -2\\) oppure \\(x > 1\\).</li></ul>' +
    sysChart([
      { name:'N ≥ 0', trueIntervals:[{toInfinityLeft:true,to:-1,openTo:false},{from:4,toInfinityRight:true,openFrom:false}] },
      { name:'D > 0', trueIntervals:[{toInfinityLeft:true,to:-2,openTo:true},{from:1,toInfinityRight:true,openFrom:true}] },
      { name:'N/D ≤ 0', system:true, trueIntervals:[{from:-2,to:-1,openFrom:true,openTo:false},{from:1,to:4,openFrom:true,openTo:false}] }
    ], [{x:-2,label:'-2'},{x:-1,label:'-1'},{x:1,label:'1'},{x:4,label:'4'}], -3.5, 5.5) +
    '<p><strong>Passo 4: lettura.</strong> Cerco dove \\(\\dfrac{N}{D} \\leq 0\\): dove \\(N\\) e \\(D\\) hanno segno <strong>opposto</strong>, oppure dove \\(N=0\\). Gli zeri di \\(D\\) (\\(-2\\) e \\(1\\)) sono esclusi, gli zeri di \\(N\\) (\\(-1\\) e \\(4\\)) sono inclusi.</p>' +
    '<div class="math-block result">\\[ -2 < x \\leq -1 \\quad \\text{oppure} \\quad 1 < x \\leq 4 \\]</div>' +
    '<div class="cb tip"><div class="cb-label">Verifica con un valore</div><p>Per \\(x = 2\\) (nell\'intervallo \\(1 \\lt x\\leq4\\)): \\(\\dfrac{2}{1} = 2 \\geq \\dfrac{2}{4} = \\dfrac{1}{2}\\), vero. Per \\(x=0\\) (fuori): \\(\\dfrac{2}{-1} = -2 \\geq 0\\), falso.</p></div>'
},
{
  tag:"PRATICA",
  title:"Sintesi e <em>metodo</em>",
  nav:"Sintesi",
  body:
    '<p>Ricapitoliamo il filo che tiene insieme tutta la lezione: qualunque cosa tu faccia con una frazione algebrica, parti sempre dalle condizioni di esistenza.</p>' +
    acc([
      { t:"Problema 1 — Espressione da semplificare", h:'<p>Semplifica \\(\\dfrac{x^2-9}{x^2+6x+9}\\).</p><p>C.E.: \\(x^2+6x+9 = (x+3)^2 = 0 \\Rightarrow x \\neq -3\\). Fattorizzo:</p><div class="math-block">\\[ \\frac{(x-3)(x+3)}{(x+3)^2} = \\frac{x-3}{x+3} \\quad (x \\neq -3) \\]</div>' },
      { t:"Problema 2 — Equazione fratta", h:'<p>Risolvi \\(\\dfrac{2}{x-1} = \\dfrac{x}{x-1} - 1\\).</p><p>C.E.: \\(x \\neq 1\\). Denominatore comune \\(x-1\\):</p><div class="math-block">\\[ 2 = x - (x-1) \\;\\Rightarrow\\; 2 = 1 \\]</div><div class="math-block warning">\\[ \\text{uguaglianza falsa} \\Rightarrow \\text{equazione impossibile} \\]</div>' },
      { t:"Problema 3 — Disequazione fratta", h:'<p>Risolvi \\(\\dfrac{2x-6}{x} \\leq 0\\). C.E.: \\(x \\neq 0\\).</p><p>Segni: \\(N = 2x-6 \\geq 0 \\Rightarrow x \\geq 3\\); \\(D = x > 0\\). Il quoziente è \\(\\leq 0\\) dove i segni sono opposti (numeratore incluso, denominatore escluso):</p><div class="math-block result">\\[ 0 < x \\leq 3 \\]</div>' }
    ]) +
    '<h3>La mappa del metodo</h3>' +
    '<table class="ct"><tr><th>Se devi…</th><th>Fai così</th></tr>' +
    '<tr><td>Semplificare</td><td>C.E. → fattorizza N e D → cancella i fattori comuni</td></tr>' +
    '<tr><td>Sommare / sottrarre</td><td>fattorizza i denominatori → mcm → somma i numeratori</td></tr>' +
    '<tr><td>Risolvere un\'equazione fratta</td><td>C.E. → denom. comune → risolvi → scarta le non accettabili</td></tr>' +
    '<tr><td>Risolvere una disequazione fratta</td><td>C.E. → segno di N e D → tabella dei segni → leggi la soluzione</td></tr></table>' +
    '<div class="cb danger"><div class="cb-label">La regola che non si dimentica</div><p>Il <strong>denominatore non è mai zero</strong>. Da qui nascono le condizioni di esistenza, ed è sempre da lì che devi partire — sia per semplificare, sia per risolvere.</p></div>' +
    '<div class="cb tip"><div class="cb-label">Vai oltre</div><p>Vuoi allenarti? Prova il <a href="/lezioni/quiz-fratte/">quiz su equazioni e disequazioni fratte</a> e ripassa la <a href="/lezioni/fattorizzazione/lezione.html">fattorizzazione</a>, che qui è lo strumento di lavoro di ogni passaggio.</p></div>'
}
];

let currentIdx = 0;

function render() {
  const s = S[currentIdx];
  const html = '<div class="hero">' +
    '<div class="hero-tag">' + s.tag + '</div>' +
    '<h1>' + s.title + '</h1></div>' +
    '<div class="section-body">' + s.body + '</div>' +
    '<div class="bottom-nav">' +
    '<button class="bb" onclick="prev()" ' + (currentIdx === 0 ? 'disabled' : '') + '>← Indietro</button>' +
    '<div class="page-info">' + (currentIdx + 1) + ' / ' + S.length + '</div>' +
    '<button class="bb" onclick="next()" ' + (currentIdx === S.length - 1 ? 'disabled' : '') + '>Avanti →</button>' +
    '</div>';

  document.getElementById('app').innerHTML = html;

  const pills = S.map((s, i) =>
    '<button class="nav-pill ' + (i === currentIdx ? 'active' : '') + '" onclick="go(' + i + ')">' + s.nav + '</button>'
  ).join('');
  document.getElementById('topNav').innerHTML = pills;

  if (typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([document.getElementById('app')]);
  }
  document.body.style.opacity = '1';
}

function prev() { if (currentIdx > 0) { currentIdx--; render(); window.scrollTo(0, 0); } }
function next() { if (currentIdx < S.length - 1) { currentIdx++; render(); window.scrollTo(0, 0); } }
function go(i) { currentIdx = i; render(); window.scrollTo(0, 0); }

render();
</script>

<button class="mot-theme-toggle" id="motThemeToggle" title="Cambia tema" aria-label="Cambia tema chiaro/scuro">
  <svg id="motSunIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 1v1.5"/><path d="M4.5 4.5l1 1"/><path d="M19.5 4.5l-1 1"/></svg>
  <svg id="motMoonIcon" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
</button>

<script>
(function(){
  var STORAGE_KEY = 'mot-lezioni-theme';
  function applyTheme(dark){
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var sun = document.getElementById('motSunIcon');
    var moon = document.getElementById('motMoonIcon');
    if (sun) sun.style.display = dark ? 'none' : 'block';
    if (moon) moon.style.display = dark ? 'block' : 'none';
  }
  var saved = null;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch(e){}
  var wantsDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(wantsDark);
  document.addEventListener('DOMContentLoaded', function(){
    var btn = document.getElementById('motThemeToggle');
    if (!btn) return;
    applyTheme(wantsDark);
    btn.addEventListener('click', function(){
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      var next = !isDark;
      applyTheme(next);
      try { localStorage.setItem(STORAGE_KEY, next ? 'dark' : 'light'); } catch(e){}
    });
  });
})();
</script>
