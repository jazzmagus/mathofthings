<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lezione — Fattorizzazione Polinomiale</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<script>
MathJax = {
  tex: {
    inlineMath: [['\\(','\\)']],
    displayMath: [['\\[','\\]']],
  },
  svg: { fontCache: 'global', scale: 1.05 },
  startup: {
    ready: () => {
      MathJax.startup.defaultReady();
      MathJax.startup.promise.then(() => { document.body.style.opacity = '1'; });
    }
  }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"></script>
<style>
:root {
  --bg:#faf7f2; --surface:#fff; --surface-alt:#f5f0e8;
  --border:#e4ddd4; --border-light:#ece7de;
  --text:#2c2520; --text-mid:#5a524a; --text-dim:#6e6760;
  --accent:#c2185b; --accent-light:#fce4ec;
  --blue:#3a6b8c; --blue-light:#e8f0f5;
  --green:#4a7c59; --green-light:#eaf5ed;
  --purple:#6a1b9a; --purple-light:#f3e5f5;
  --gold:#b8860b; --gold-light:#fdf8ed;
  --teal:#4f6d7a; --teal-light:#e8eff2;
  --danger:#b33a3a;
  --radius:8px; --shadow:0 1px 3px rgba(44,37,32,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Crimson Text','Georgia',serif;background:var(--bg);color:var(--text);line-height:1.75;font-size:17px;opacity:0;transition:opacity .3s}

.topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,247,242,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border-light);height:52px;display:flex;align-items:center;padding:0 clamp(16px,4vw,40px);gap:16px}
.topbar-brand{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;color:var(--text);white-space:nowrap}
.topbar-nav{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;flex:1}
.topbar-nav::-webkit-scrollbar{display:none}
.nav-pill{background:none;border:none;font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--text-dim);padding:6px 14px;border-radius:0;cursor:pointer;white-space:nowrap;transition:all .2s;border-bottom:2px solid transparent}
.nav-pill:hover{background:none;color:var(--text)}
.nav-pill.active{background:none;color:var(--accent);font-weight:600;border-bottom:2px solid var(--accent)}
.topbar-home{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--text-dim);text-decoration:none;cursor:pointer;white-space:nowrap}
.topbar-home:hover{color:var(--accent)}

.container{max-width:780px;margin:0 auto;padding:84px clamp(20px,5vw,48px) 60px}
.section{display:none;animation:appear .4s ease}
.section.active{display:block}
@keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.hero{margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border-light)}
.hero-tag{font-family:'Fira Code',monospace;font-size:.73rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(1.9rem,5vw,2.7rem);font-weight:800;line-height:1.15;margin-bottom:12px}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero-sub{font-size:1.02rem;color:var(--text-mid);max-width:580px;line-height:1.7;text-align:justify}

.cb{background:var(--surface-alt);border:none;border-radius:0;padding:16px 0 16px 18px;margin:18px 0;box-shadow:none;position:relative;border-left:2px solid var(--accent)}
.cb::before{content:'';position:absolute;left:0;top:0;bottom:0;width:0;display:none}
.cb.tip::before{background:transparent}
.cb.warn::before{background:transparent}
.cb.danger::before{background:transparent}
.cb.success::before{background:transparent}
.cb.method::before{background:transparent}
.cb.purple::before{background:transparent}
.cb.teal::before{background:transparent}
.cb-label{font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-weight:600;color:var(--accent)}
.cb.tip .cb-label{color:var(--blue)}
.cb.warn .cb-label{color:var(--gold)}
.cb.danger .cb-label{color:var(--danger)}
.cb.success .cb-label{color:var(--green)}
.cb.method .cb-label{color:var(--accent)}
.cb.purple .cb-label{color:var(--purple)}
.cb.teal .cb-label{color:var(--teal)}

.math-block{background:rgba(0,0,0,.02);border:none;border-radius:0;padding:12px 16px;margin:10px 0;overflow-x:auto}
.math-block.hero-formula{background:var(--surface-alt);border:none;padding:16px 20px;text-align:center}
.math-block.result{border-left:2px solid var(--green);background:rgba(74,124,89,.04);padding:12px 16px;margin:10px 0}
.math-block.warning{border-left:2px solid var(--danger);background:rgba(179,58,58,.04);padding:12px 16px;margin:10px 0}
.math-block.dark{background:rgba(0,0,0,.04)}

.step-math{margin:4px 0;padding:2px 0}
.step-math .label{font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);margin-bottom:2px}
.step-math .label.green{color:var(--green)}

.accordion{border:none;border-radius:0;overflow:visible;margin:16px 0;box-shadow:none}
.acc-item{border-bottom:1px solid rgba(0,0,0,.08);border-top:none}
.acc-item:last-child{border-bottom:none}
.acc-header{display:flex;align-items:center;gap:12px;padding:14px 0;background:none;cursor:pointer;transition:all .2s;user-select:none}
.acc-header:hover{background:none}
.acc-num{width:24px;height:24px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.acc-title{font-weight:600;font-size:.95rem;flex:1;color:var(--text)}
.acc-arrow{width:16px;height:16px;color:var(--text-dim);transition:transform .3s;flex-shrink:0}
.acc-item.open .acc-arrow{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease;background:none}
.acc-item.open .acc-body{max-height:8000px}
.acc-inner{padding:8px 0 16px 36px;border-top:none}

.ct{width:100%;border-collapse:collapse;margin:14px 0;font-size:.9rem}
.ct th{text-align:left;padding:11px 14px;font-weight:600;color:var(--accent);border-bottom:1px solid var(--border-light);font-size:.78rem;letter-spacing:.5px;text-transform:uppercase;font-family:'Fira Code',monospace}
.ct td{padding:10px 14px;border-bottom:1px solid var(--border-light);vertical-align:top}
.ct tr:last-child td{border-bottom:none}

.step-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:start;margin:10px 0}
.step-circle{width:24px;height:24px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.7rem;flex-shrink:0;margin-top:1px}
.step-text{font-size:.9rem;padding-top:2px;line-height:1.6}

.compare-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.compare-card{border-radius:0;padding:12px 14px;font-size:.85rem;line-height:1.6;border:none}
.compare-card.wrong{background:rgba(179,58,58,.05)}
.compare-card.right{background:rgba(74,124,89,.05)}
.compare-label{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:1px;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.compare-card.wrong .compare-label{color:var(--danger)}
.compare-card.right .compare-label{color:var(--green)}

.bottom-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:20px;border-top:1px solid var(--border-light)}
.bb{font-family:'JetBrains Mono',monospace;font-size:.85rem;padding:0;border:none;background:none;color:var(--text);transition:all .2s;cursor:pointer;text-decoration:none}
.bb:hover{color:var(--accent);text-decoration:underline}
.bb:disabled{opacity:.35;cursor:not-allowed;text-decoration:none}
.bb:disabled:hover{color:var(--text);text-decoration:none}
.bb.primary{background:none;color:var(--text);border:none;font-weight:400}
.bb.primary:hover{color:var(--accent);text-decoration:underline;background:none}
.page-info{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--text-dim)}

p{margin:6px 0}
ul,ol{margin:8px 0 8px 20px}
li{margin:2px 0}
.dim{color:var(--text-dim)}
strong{font-weight:600}
h2{margin:24px 0 12px}
h3{margin:16px 0 8px}
mjx-container[jax="SVG"]{direction:ltr}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}

@media(max-width:640px){
  body{font-size:16px}
  .hero h1{font-size:1.7rem}
  .acc-header{padding:13px 14px}
  .acc-inner{padding:4px 14px 18px}
  .cb{padding:18px}
  .compare-row{grid-template-columns:1fr}
  .math-block{padding:14px 16px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">Fattorizzazione</div>
  <div class="topbar-nav" id="topNav"></div>
  <a href="/" class="topbar-home">← home</a>
</div>
<div class="container" id="app"></div>

<script>
function acc(items) {
  return '<div class="accordion">'+items.map((it,i)=>`
    <div class="acc-item">
      <div class="acc-header" onclick="toggleAcc(this)">
        <div class="acc-num">${i+1}</div>
        <div class="acc-title">${it.t}</div>
        <svg class="acc-arrow" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <div class="acc-body"><div class="acc-inner">${it.h}</div></div>
    </div>`).join('')+'</div>';
}

function toggleAcc(el) {
  const item = el.parentElement;
  item.classList.toggle('open');
  if (item.classList.contains('open') && typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([item]);
  }
}

const S = [

// ═══ 0: INTRODUZIONE ═══
{
  tag:"TEORIA",
  title:"Che cos'è la <em>fattorizzazione</em>",
  sub:"Leggere la vera natura di un'espressione — dai numeri ai polinomi.",
  nav:"Introduzione",
  body:`
    <p>Considerando il polinomio \\(x^2 - 4\\), cosa puoi dirmi? Che ha grado 2? Sì. Che contiene \\(x^2\\) e una costante? Sì. Ma stai <strong>veramente</strong> leggendo quello che dice questo polinomio?</p>

    <p>Se lo scrivo come \\((x-2)(x+2)\\), improvvisamente vedi qualcosa di diverso: <strong>i valori che lo annullano</strong>. Quando \\(x = 2\\) o \\(x = -2\\), il polinomio è zero. La forma fattorizzata ti rivela la <strong>struttura nascosta</strong> dell'espressione.</p>

    <div class="cb method">
      <div class="cb-label">Definizione</div>
      <p><strong>Fattorizzare</strong> (o <strong>scomporre</strong>) un polinomio significa scriverlo come <strong>prodotto di polinomi di grado inferiore</strong>, chiamati <strong>fattori</strong>.</p>
    </div>

    <div class="math-block">
      \\[x^2 - 4 = (x-2)(x+2)\\]
      \\[x^2 + 5x + 6 = (x+2)(x+3)\\]
      \\[x^3 - 8 = (x-2)(x^2 + 2x + 4)\\]
    </div>

    <h3>Perché fattorizzare?</h3>
    <ul>
      <li><strong>Trovare gli zeri:</strong> se \\(P(x) = (x-2)(x+1)\\), sai immediatamente che \\(P(2) = 0\\) e \\(P(-1) = 0\\)</li>
      <li><strong>Semplificare frazioni:</strong> \\(\\frac{x^2-4}{x+2} = \\frac{(x-2)(x+2)}{x+2} = x-2\\) (per \\(x \\neq -2\\))</li>
      <li><strong>Risolvere equazioni:</strong> \\(x^2 - 5x + 6 = 0\\) diventa \\((x-2)(x-3) = 0\\), facilissimo</li>
      <li><strong>Studiare il segno:</strong> capire dove un'espressione è positiva o negativa</li>
    </ul>

    <div class="cb tip">
      <div class="cb-label">Polinomi irriducibili</div>
      <p>Un polinomio è <strong>irriducibile</strong> quando <strong>non può essere ulteriormente scomposto</strong> in fattori di grado inferiore. Ad esempio, \\(x^2 + 1\\) è irriducibile nei reali (ha radici complesse).</p>
    </div>
  `
},

// ═══ 1: RACCOGLIMENTO TOTALE ═══
{
  tag:"METODO",
  title:"Raccoglimento <em>totale</em>",
  sub:"Il primo passo: cercare un fattore comune in tutti i termini.",
  nav:"Raccoglimento totale",
  body:`
    <div class="cb method">
      <div class="cb-label">Strategia</div>
      <p>Identifica il <strong>massimo comune divisore (MCD)</strong> dei coefficienti e la <strong>potenza minima</strong> di ogni variabile presente in <em>tutti</em> i termini.</p>
    </div>

    <h3>Procedura</h3>
    <div class="step-grid">
      <div class="step-circle">1</div>
      <div class="step-text">Trova il <strong>MCD</strong> dei coefficienti numerici</div>
      <div class="step-circle">2</div>
      <div class="step-text">Trova la potenza minima di ogni variabile</div>
      <div class="step-circle">3</div>
      <div class="step-text">Metti in evidenza il fattore comune</div>
    </div>

    <div class="cb success">
      <div class="cb-label">Regola d'oro</div>
      <p><strong>Sempre raccogliere un fattore comune prima di qualsiasi altra cosa!</strong></p>
    </div>

    ${acc([
      {
        t:"Es. 1 — \\(3x^2 + 6x + 9\\)",
        h:`
          <div class="step-math"><div class="label">MCD di 3, 6, 9 è 3</div></div>
          <div class="math-block">\\[3x^2 + 6x + 9 = 3(x^2 + 2x + 3)\\]</div>
          <div class="step-math"><div class="label green">Verifica</div>
            <p>\\(3 \\cdot x^2 + 3 \\cdot 2x + 3 \\cdot 3 = 3x^2 + 6x + 9\\) ✓</p>
          </div>
        `
      },
      {
        t:"Es. 2 — \\(4x^3y^2 - 8x^2y^3 + 12xy\\)",
        h:`
          <div class="step-math"><div class="label">MCD è 4; min potenza di x è 1; min potenza di y è 1</div></div>
          <div class="math-block">\\[4x^3y^2 - 8x^2y^3 + 12xy = 4xy(x^2y - 2xy^2 + 3)\\]</div>
        `
      },
      {
        t:"Es. 3 — \\(5a^2b - 10ab^2 + 15abc\\)",
        h:`
          <div class="math-block">\\[5ab(a - 2b + 3c)\\]</div>
        `
      }
    ])}
  `
},

// ═══ 2: RACCOGLIMENTO PARZIALE ═══
{
  tag:"METODO",
  title:"Raccoglimento <em>parziale</em>",
  sub:"Quando non c'è un fattore comune a tutti i termini — raggruppa e raccogli.",
  nav:"Raccoglimento parziale",
  body:`
    <div class="cb method">
      <div class="cb-label">Strategia</div>
      <p>Usato quando il polinomio ha <strong>4 o più termini</strong> senza un fattore comune totale. Si raggruppa in coppie (o gruppi) che hanno fattori comuni, si raccogli da ogni gruppo, e poi si raccogli il fattore che emerge.</p>
    </div>

    <h3>Procedura</h3>
    <div class="step-grid">
      <div class="step-circle">1</div>
      <div class="step-text">Raggruppa i termini in coppie che condividono fattori</div>
      <div class="step-circle">2</div>
      <div class="step-text">Raccogli il fattore da ogni coppia</div>
      <div class="step-circle">3</div>
      <div class="step-text">Se emerge un fattore comune alle parentesi, raccoglilo ancora</div>
    </div>

    <div class="cb warn">
      <div class="cb-label">Attenzione</div>
      <p>Le parentesi che emergono devono essere <strong>identiche</strong>. Se non lo sono, riprova con un raggruppamento diverso.</p>
    </div>

    ${acc([
      {
        t:"Es. 1 — \\(ax + ay + bx + by\\)",
        h:`
          <div class="step-math"><div class="label">Raggruppa: (ax + ay) + (bx + by)</div></div>
          <div class="math-block">\\[a(x+y) + b(x+y)\\]</div>
          <div class="step-math"><div class="label">Emerge il fattore comune (x+y)</div></div>
          <div class="math-block result">\\[(a+b)(x+y)\\]</div>
        `
      },
      {
        t:"Es. 2 — \\(2x^3 - 3x^2 + 8x - 12\\)",
        h:`
          <div class="step-math"><div class="label">Raggruppa: (2x³ − 3x²) + (8x − 12)</div></div>
          <div class="math-block">\\[x^2(2x - 3) + 4(2x - 3)\\]</div>
          <div class="step-math"><div class="label">Emerge (2x−3)</div></div>
          <div class="math-block result">\\[(x^2 + 4)(2x - 3)\\]</div>
        `
      }
    ])}
  `
},

// ═══ 3: PRODOTTI NOTEVOLI ═══
{
  tag:"METODO",
  title:"Fattorizzazione tramite <em>prodotti notevoli</em>",
  sub:"Riconoscere forme speciali per fattorizzare istantaneamente.",
  nav:"Prodotti notevoli",
  body:`
    <p>Molti polinomi hanno forme speciali che corrispondono ai prodotti notevoli. Riconoscerli permette di fattorizzare <strong>istantaneamente</strong>.</p>

    <h3>1. Differenza di quadrati: \\(a^2 - b^2 = (a-b)(a+b)\\)</h3>
    <div class="cb tip">
      <div class="cb-label">Riconoscimento</div>
      <p>Due soli termini, entrambi quadrati perfetti, con un segno meno tra loro.</p>
    </div>
    <div class="math-block">
      \\[x^2 - 9 = x^2 - 3^2 = (x-3)(x+3)\\]
      \\[4x^2 - 25y^2 = (2x)^2 - (5y)^2 = (2x-5y)(2x+5y)\\]
    </div>

    <h3>2. Quadrato perfetto: \\(a^2 \\pm 2ab + b^2 = (a \\pm b)^2\\)</h3>
    <div class="cb tip">
      <div class="cb-label">Riconoscimento</div>
      <p>Tre termini. Il primo e il terzo sono quadrati perfetti. Il termine di mezzo è <strong>il doppio prodotto</strong> delle loro radici.</p>
    </div>
    <div class="math-block">
      \\[x^2 + 6x + 9 = (x + 3)^2\\]
      \\[4a^2 - 20ab + 25b^2 = (2a - 5b)^2\\]
    </div>

    <h3>3. Somma di cubi: \\(a^3 + b^3 = (a+b)(a^2 - ab + b^2)\\)</h3>
    <p>Il trinomio \\(a^2 - ab + b^2\\) si chiama "falso quadrato" perché il doppio prodotto ha il segno opposto.</p>
    <div class="math-block">
      \\[x^3 + 8 = x^3 + 2^3 = (x+2)(x^2 - 2x + 4)\\]
      \\[a^3 + 27 = a^3 + 3^3 = (a+3)(a^2 - 3a + 9)\\]
    </div>

    <h3>4. Differenza di cubi: \\(a^3 - b^3 = (a-b)(a^2 + ab + b^2)\\)</h3>
    <div class="math-block">
      \\[x^3 - 8 = x^3 - 2^3 = (x-2)(x^2 + 2x + 4)\\]
      \\[27a^3 - 64b^3 = (3a)^3 - (4b)^3 = (3a - 4b)(9a^2 + 12ab + 16b^2)\\]
    </div>
  `
},

// ═══ 4: TRINOMIO PARTICOLARE ═══
{
  tag:"METODO",
  title:"Trinomio <em>particolare</em>",
  sub:"Il caso più frequente — cercare due numeri magici.",
  nav:"Trinomio particolare",
  body:`
    <p>Il trinomio di secondo grado è uno dei <strong>casi più frequenti</strong> di fattorizzazione.</p>

    <h3>Trinomio particolare (metodo somma-prodotto)</h3>
    <div class="cb method">
      <div class="cb-label">Forma</div>
      <p>\\(x^2 + bx + c\\) (coefficiente di \\(x^2\\) è 1)</p>
    </div>

    <div class="cb method">
      <div class="cb-label">Strategia</div>
      <p>Cercare due numeri \\(m\\) e \\(n\\) tali che:</p>
      <ul>
        <li>\\(m + n = b\\) (somma = coefficiente di \\(x\\))</li>
        <li>\\(m \\cdot n = c\\) (prodotto = termine noto)</li>
      </ul>
      <p>Allora: \\(x^2 + bx + c = (x + m)(x + n)\\)</p>
    </div>

    <h3>Trinomio generale (quando il coefficiente di \\(x^2\\) non è 1)</h3>
    <div class="cb method">
      <div class="cb-label">Forma</div>
      <p>\\(ax^2 + bx + c\\) con \\(a \\neq 1\\)</p>
    </div>

    <p>Lo stesso metodo somma-prodotto, ma cerchiamo due numeri che:</p>
    <ul>
      <li>Sommano a \\(b\\)</li>
      <li>Moltiplicano a \\(a \\cdot c\\) (non solo a \\(c\\)!)</li>
    </ul>

    ${acc([
      {
        t:"Es. 1 — \\(x^2 + 5x + 6\\)",
        h:`
          <div class="step-math"><div class="label">Termine noto: 6. Coppie che moltiplicano a 6</div></div>
          <p>\\((1,6), (2,3), (-1,-6), (-2,-3)\\)</p>
          <div class="step-math"><div class="label">Quale coppia somma a 5?</div></div>
          <p>La coppia \\((2,3)\\) perché \\(2 + 3 = 5\\) ✓</p>
          <div class="math-block result">\\[(x+2)(x+3)\\]</div>
          <div class="step-math"><div class="label green">Verifica</div>
            <p>\\((x+2)(x+3) = x^2 + 5x + 6\\) ✓</p>
          </div>
        `
      },
      {
        t:"Es. 2 — \\(2x^2 + 7x + 3\\) (trinomio generale)",
        h:`
          <div class="step-math"><div class="label">Prodotto a·c = 2·3 = 6</div></div>
          <p>Cerchiamo due numeri che sommano a 7 e moltiplicano a 6: sono \\(1\\) e \\(6\\)</p>
          <div class="step-math"><div class="label">Ricombiniamo e raccogliamo</div></div>
          <div class="math-block">
            \\[2x^2 + 7x + 3 = 2x^2 + 1x + 6x + 3\\]
            \\[= x(2x+1) + 3(2x+1) = (2x+1)(x+3)\\]
          </div>
          <div class="math-block result">\\[(2x+1)(x+3)\\]</div>
        `
      },
      {
        t:"Es. 3 — Quando è impossibile: \\(x^2 + x + 1\\)",
        h:`
          <div class="step-math"><div class="label">Discriminante</div></div>
          <div class="math-block">\\[\\Delta = b^2 - 4ac = 1 - 4(1)(1) = -3 < 0\\]</div>
          <p>Negativo! Questo trinomio <strong>non si fattorizza nei reali</strong> (ha radici complesse).</p>
        `
      }
    ])}
  `
},

// ═══ 5: RUFFINI ═══
{
  tag:"TEOREMA",
  title:"Teorema del Resto e <em>Ruffini</em>",
  sub:"Per polinomi di grado superiore — trovare radici e fattorizzare.",
  nav:"Ruffini",
  body:`
    <p>Quando il polinomio ha grado \\(\\geq 3\\) e non riconosci una forma particolare, la <strong>Regola di Ruffini</strong> è lo strumento per trovare i fattori.</p>

    <div class="cb method">
      <div class="cb-label">Teorema di Ruffini</div>
      <p>Un polinomio \\(P(x)\\) è divisibile per il binomio \\((x - a)\\) <strong>se e soltanto se</strong> \\(P(a) = 0\\) (cioè se \\(a\\) è una radice del polinomio).</p>
    </div>

    <h3>Come applicare Ruffini per fattorizzare</h3>
    <div class="step-grid">
      <div class="step-circle">1</div>
      <div class="step-text">Scrivi il polinomio in forma standard (ordinato per gradi decrescenti)</div>
      <div class="step-circle">2</div>
      <div class="step-text"><strong>Cerca una radice razionale:</strong> testa i divisori del termine noto</div>
      <div class="step-circle">3</div>
      <div class="step-text">Per ogni divisore \\(a\\), calcola \\(P(a)\\) — se \\(P(a) = 0\\), hai trovato una radice!</div>
      <div class="step-circle">4</div>
      <div class="step-text">Dividi il polinomio per \\((x-a)\\) usando la divisione sintetica</div>
      <div class="step-circle">5</div>
      <div class="step-text">Ripeti il processo sul quoziente</div>
    </div>

    ${acc([
      {
        t:"Es. — Fattorizzare \\(P(x) = x^3 + x^2 - 5x + 3\\)",
        h:`
          <div class="step-math"><div class="label">Termine noto: 3. Divisori: ±1, ±3</div></div>
          <div class="step-math"><div class="label">Testa x = 1</div></div>
          <p>\\(P(1) = 1 + 1 - 5 + 3 = 0\\) ✓ (radice trovata!)</p>
          <div class="step-math"><div class="label">Dividi P(x) per (x−1)</div></div>
          <p>Quoziente: \\(x^2 + 2x - 3\\)</p>
          <div class="step-math"><div class="label">Fattorizza il quoziente</div></div>
          <p>\\(x^2 + 2x - 3 = (x+3)(x-1)\\)</p>
          <div class="math-block result">\\[P(x) = (x-1)^2(x+3)\\]</div>
        `
      }
    ])}

    <div class="cb tip">
      <div class="cb-label">Teorema del Resto</div>
      <p>Il resto della divisione di \\(P(x)\\) per \\((x-a)\\) è semplicemente \\(P(a)\\). Quindi, se \\(P(a) = 0\\), il resto è 0 — il che significa che \\((x-a)\\) divide \\(P(x)\\) perfettamente.</p>
    </div>
  `
},

// ═══ 6: SINTESI ═══
{
  tag:"RIEPILOGO",
  title:"Sintesi, strategie e <em>applicazioni</em>",
  sub:"Mettere tutto insieme e usare la fattorizzazione per risolvere problemi.",
  nav:"Sintesi",
  body:`
    <h3>Fattorizzazione completa</h3>
    <div class="cb method">
      <div class="cb-label">Definizione</div>
      <p>Scrivere un polinomio come prodotto di fattori <strong>irriducibili</strong> — cioè fattori che non possono essere ulteriormente scomposti (nei reali).</p>
    </div>

    <div class="step-grid">
      <div class="step-circle">1</div>
      <div class="step-text">Raccogli eventuali fattori comuni</div>
      <div class="step-circle">2</div>
      <div class="step-text">Applica i metodi appropriati (prodotti notevoli, trinomio, Ruffini)</div>
      <div class="step-circle">3</div>
      <div class="step-text">Per ogni fattore ottenuto, verifica se può essere ulteriormente scomposto</div>
      <div class="step-circle">4</div>
      <div class="step-text">Continua finché tutti i fattori sono irriducibili</div>
    </div>

    <h3>Applicazione 1: Semplificazione di frazioni algebriche</h3>
    <div class="math-block">
      \\[\\frac{x^2 - 4}{x^2 + 4x + 4} = \\frac{(x-2)(x+2)}{(x+2)^2} = \\frac{x-2}{x+2} \\quad (x \\neq -2)\\]
    </div>

    <div class="cb danger">
      <div class="cb-label">Attenzione</div>
      <p>Quando semplifichi, devi escludere i valori che annullano il denominatore!</p>
    </div>

    <h3>Applicazione 2: Risoluzione di equazioni polinomiali</h3>
    <div class="math-block">
      \\[x^3 - 6x^2 + 11x - 6 = 0\\]
    </div>
    <p>Se fattorizzi: \\((x-1)(x-2)(x-3) = 0\\)</p>
    <p>Per la <strong>Legge di Annullamento del Prodotto</strong>, il prodotto è zero se almeno un fattore è zero:</p>
    <div class="math-block result">
      \\[x = 1 \\quad \\text{oppure} \\quad x = 2 \\quad \\text{oppure} \\quad x = 3\\]
    </div>

    <h3>Tabella riepilogativa</h3>
    <table class="ct">
      <tr><th>Tipo di polinomio</th><th>Forma</th><th>Fattorizzazione</th></tr>
      <tr><td><strong>Fattore comune</strong></td><td>\\(ax + ay + az\\)</td><td>\\(a(x+y+z)\\)</td></tr>
      <tr><td><strong>Raccoglimento parziale</strong></td><td>\\(ax + ay + bx + by\\)</td><td>\\((a+b)(x+y)\\)</td></tr>
      <tr><td><strong>Differenza di quadrati</strong></td><td>\\(a^2 - b^2\\)</td><td>\\((a-b)(a+b)\\)</td></tr>
      <tr><td><strong>Quadrato perfetto</strong></td><td>\\(a^2 + 2ab + b^2\\)</td><td>\\((a+b)^2\\)</td></tr>
      <tr><td><strong>Somma di cubi</strong></td><td>\\(a^3 + b^3\\)</td><td>\\((a+b)(a^2 - ab + b^2)\\)</td></tr>
      <tr><td><strong>Differenza di cubi</strong></td><td>\\(a^3 - b^3\\)</td><td>\\((a-b)(a^2 + ab + b^2)\\)</td></tr>
      <tr><td><strong>Trinomio particolare</strong></td><td>\\(x^2 + bx + c\\)</td><td>\\((x+m)(x+n)\\) dove \\(m+n=b, mn=c\\)</td></tr>
      <tr><td><strong>Trinomio generale</strong></td><td>\\(ax^2 + bx + c\\)</td><td>Somma-prodotto con \\(a \\cdot c\\)</td></tr>
      <tr><td><strong>Polinomio di grado ≥ 3</strong></td><td>\\(P(x)\\)</td><td>Ruffini: cercare radici tra divisori del termine noto</td></tr>
    </table>

    <div class="cb success">
      <div class="cb-label">Ricorda</div>
      <p>La <strong>fattorizzazione</strong> è uno degli strumenti algebrici più potenti. Non è solo una tecnica di calcolo, ma un modo di <strong>capire la struttura profonda</strong> di un'espressione:</p>
      <ul>
        <li>Fattorizzare significa leggere gli <strong>zeri nascosti</strong> di un polinomio</li>
        <li>Significa trasformare un'espressione complessa in componenti semplici</li>
        <li>Significa avere il potere di <strong>risolvere equazioni</strong>, <strong>semplificare frazioni</strong>, e <strong>studiare il comportamento</strong> delle funzioni</li>
      </ul>
    </div>
  `
}

];

// ── APP LOGIC ──
let cur = 0;
const tot = S.length;

function render() {
  document.getElementById('topNav').innerHTML = S.map((s,i) =>
    `<button class="nav-pill ${i===cur?'active':''}" onclick="goTo(${i})">${s.nav}</button>`
  ).join('');

  document.getElementById('app').innerHTML = S.map((s,i) => `
    <div class="section ${i===cur?'active':''}">
      <div class="hero">
        <div class="hero-tag">${s.tag}</div>
        <h1>${s.title}</h1>
        <p class="hero-sub">${s.sub}</p>
      </div>
      ${s.body}
      <div class="bottom-nav">
        <button class="bb" onclick="goTo(${i-1})" ${i===0?'disabled':''}>← Precedente</button>
        <span class="page-info">${i+1} / ${tot}</span>
        <button class="bb primary" onclick="goTo(${i+1})" ${i===tot-1?'disabled':''}>Successivo →</button>
      </div>
    </div>
  `).join('');

  if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
    const active = document.querySelector('.section.active');
    if (active) MathJax.typesetPromise([active]);
  }
}

function goTo(idx) {
  if (idx < 0 || idx >= tot) return;
  cur = idx;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goTo(cur + 1);
  if (e.key === 'ArrowLeft')  goTo(cur - 1);
});

if (typeof MathJax !== 'undefined' && MathJax.startup) {
  MathJax.startup.promise.then(() => render());
} else {
  render();
  document.body.style.opacity = '1';
}
</script>
</body>
</html>
