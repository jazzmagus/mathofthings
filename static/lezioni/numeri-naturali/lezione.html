<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numeri Naturali ℕ — Lezione interattiva</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<script>
MathJax = {
  tex: {
    inlineMath: [['\\(','\\)']],
    displayMath: [['\\[','\\]']]
  },
  svg: { fontCache: 'global', scale: 1.05 },
  startup: {
    ready() {
      MathJax.startup.defaultReady();
      MathJax.startup.promise.then(() => { document.body.style.opacity = '1'; });
    }
  }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"></script>
<style>
:root {
  --bg:#faf7f2; --surface:#fff; --surface-alt:#f5f0e8;
  --border:#e4ddd4; --border-light:#ece7de;
  --text:#2c2520; --text-mid:#5a524a; --text-dim:#6e6760;
  --accent:#c2185b; --accent-light:#fce4ec;
  --blue:#3a6b8c; --blue-light:#e8f0f5;
  --green:#4a7c59; --green-light:#eaf5ed;
  --gold:#b8860b;
  --danger:#b33a3a;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--text);line-height:1.75;font-size:17px;opacity:0;transition:opacity .3s}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,247,242,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border-light);height:52px;display:flex;align-items:center;padding:0 clamp(16px,4vw,40px);gap:16px}
.topbar-brand{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;color:var(--text);white-space:nowrap;flex-shrink:0}
.topbar-nav{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;flex:1}
.topbar-nav::-webkit-scrollbar{display:none}
.nav-pill{background:none;border:none;font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--text-dim);padding:6px 14px;cursor:pointer;white-space:nowrap;transition:color .2s;border-bottom:2px solid transparent}
.nav-pill:hover{color:var(--text)}
.nav-pill.active{color:var(--accent);font-weight:600;border-bottom:2px solid var(--accent)}
.topbar-home{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--text-dim);text-decoration:none;cursor:pointer;white-space:nowrap;flex-shrink:0}
.topbar-home:hover{color:var(--accent)}

/* LAYOUT */
.container{max-width:780px;margin:0 auto;padding:84px clamp(20px,5vw,48px) 60px}
.section{display:none;animation:appear .4s ease}
.section.active{display:block}
@keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* HERO */
.hero{margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border-light)}
.hero-tag{font-family:'Fira Code',monospace;font-size:.73rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(1.9rem,5vw,2.65rem);font-weight:800;line-height:1.15;margin-bottom:12px}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero-sub{font-size:1.02rem;color:var(--text-mid);line-height:1.7;text-wrap:pretty}

/* CALLOUT */
.cb{background:var(--surface-alt);border-left:2px solid var(--accent);border-radius:0 8px 8px 0;padding:16px 18px;margin:18px 0}
.cb-label{font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-weight:600;color:var(--accent)}
.cb.tip .cb-label{color:var(--blue)}
.cb.warn .cb-label{color:var(--gold)}
.cb.danger .cb-label{color:var(--danger)}
.cb.success .cb-label{color:var(--green)}

/* MATH */
.math-block{background:rgba(0,0,0,.025);padding:12px 16px;margin:10px 0;overflow-x:auto;border-radius:2px}
.math-block.center{text-align:center}
.math-block.result{border-left:2px solid var(--green);background:rgba(74,124,89,.04)}
.math-block.warn{border-left:2px solid var(--danger);background:rgba(179,58,58,.04)}
mjx-container[jax="SVG"]{direction:ltr}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}

/* ACCORDION */
.accordion{margin:16px 0}
.acc-item{border-bottom:1px solid rgba(0,0,0,.08)}
.acc-item:last-child{border-bottom:none}
.acc-header{display:flex;align-items:center;gap:12px;padding:14px 0;cursor:pointer;user-select:none;background:none;border:none;width:100%;text-align:left}
.acc-num{width:24px;height:24px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.7rem;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.acc-title{font-weight:600;font-size:.93rem;flex:1;color:var(--text);font-family:Georgia,serif;text-align:left;line-height:1.4}
.acc-arrow{width:16px;height:16px;color:var(--text-dim);transition:transform .3s;flex-shrink:0}
.acc-item.open .acc-arrow{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.acc-item.open .acc-body{max-height:9000px}
.acc-inner{padding:8px 0 18px 36px}

/* TABLE */
.ct{width:100%;border-collapse:collapse;margin:14px 0;font-size:.88rem}
.ct th{text-align:left;padding:10px 14px;font-weight:600;color:var(--accent);border-bottom:1px solid var(--border-light);font-size:.74rem;letter-spacing:.5px;text-transform:uppercase;font-family:'Fira Code',monospace}
.ct td{padding:9px 14px;border-bottom:1px solid var(--border-light);vertical-align:top;line-height:1.65}
.ct tr:last-child td{border-bottom:none}

/* COMPARE */
.compare-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.compare-card{padding:12px 14px;font-size:.88rem;line-height:1.6;border-radius:4px}
.compare-card.wrong{background:rgba(179,58,58,.05)}
.compare-card.right{background:rgba(74,124,89,.05)}
.compare-label{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:1px;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.compare-card.wrong .compare-label{color:var(--danger)}
.compare-card.right .compare-label{color:var(--green)}

/* QUIZ */
.quiz-block{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 24px;margin:28px 0}
.quiz-eyebrow{font-family:'Fira Code',monospace;font-size:.73rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--blue);margin-bottom:10px}
.quiz-q{font-size:1rem;font-weight:700;font-family:'Playfair Display',serif;margin-bottom:16px;line-height:1.45}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:11px 16px;text-align:left;cursor:pointer;font-family:Georgia,serif;font-size:.92rem;color:var(--text);transition:all .2s;line-height:1.5}
.quiz-opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-light)}
.quiz-opt:disabled{cursor:default}
.quiz-opt.quiz-correct{border-color:var(--green);background:var(--green-light);color:var(--green);font-weight:600}
.quiz-opt.quiz-wrong{border-color:var(--danger);background:rgba(179,58,58,.07);color:var(--danger)}
.quiz-feedback{margin-top:14px}
.fb-ok,.fb-no{padding:13px 16px;border-radius:0 6px 6px 0;font-size:.9rem;line-height:1.65}
.fb-ok{background:var(--green-light);border-left:3px solid var(--green)}
.fb-no{background:rgba(179,58,58,.06);border-left:3px solid var(--danger)}
.fb-label{font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;display:block;margin-bottom:6px}
.fb-ok .fb-label{color:var(--green)}
.fb-no .fb-label{color:var(--danger)}

/* STEP GRID */
.step-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:start;margin:10px 0}
.step-circle{width:24px;height:24px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.7rem;flex-shrink:0;margin-top:3px}
.step-text{font-size:.9rem;padding-top:2px;line-height:1.65}

/* BOTTOM NAV */
.bottom-nav{display:flex;justify-content:space-between;align-items:center;margin-top:44px;padding-top:20px;border-top:1px solid var(--border-light)}
.bb{font-family:'JetBrains Mono',monospace;font-size:.85rem;padding:0;border:none;background:none;color:var(--text);transition:all .2s;cursor:pointer}
.bb:hover{color:var(--accent);text-decoration:underline}
.bb:disabled{opacity:.35;cursor:not-allowed}
.bb:disabled:hover{color:var(--text);text-decoration:none}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border);transition:all .3s;cursor:pointer;border:none;padding:0;flex-shrink:0}
.dot.active{background:var(--accent);width:20px;border-radius:4px}

/* TYPOGRAPHY */
p{margin:6px 0}
ul,ol{margin:8px 0 8px 24px}
li{margin:3px 0;line-height:1.7}
strong{font-weight:700}
.dim{color:var(--text-dim)}
h2{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;margin:26px 0 10px;color:var(--text)}
h3{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:600;margin:18px 0 8px;color:var(--text)}

/* SEMIRETTA SVG */
.semiretta-wrap{display:flex;flex-direction:column;align-items:center;margin:20px 0 8px}
.semiretta-cap{font-family:'Fira Code',monospace;font-size:.72rem;letter-spacing:1px;color:var(--text-dim);margin-top:6px}

/* RESPONSIVE */
@media(max-width:640px){
  body{font-size:15.5px}
  .hero h1{font-size:1.65rem}
  .cb{padding:14px 14px}
  .quiz-block{padding:16px 16px}
  .compare-row{grid-template-columns:1fr}
  .math-block{padding:12px 12px}
  .container{padding:80px 18px 60px}
  .topbar-brand{font-size:.9rem}
  .acc-inner{padding:8px 0 16px 24px}
  .acc-title{font-size:.88rem}
  .ct{font-size:.82rem}
  .ct th,.ct td{padding:8px 10px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">ℕ — Numeri Naturali</div>
  <div class="topbar-nav" id="topNav"></div>
  <a href="/" class="topbar-home">← home</a>
</div>
<div class="container" id="app"></div>

<script>
/* ═══════════════ QUIZ ENGINE ═══════════════ */
const QUIZZES = {
  minimo: {
    correct: 0,
    feedbacks: [
      `<span class="fb-label">Corretto</span>
       <p>Esatto. Lo zero è il minimo di \\(\\mathbb{N}\\): ogni altro numero naturale è maggiore di zero.
       L'insieme è illimitato superiormente (non ha massimo), ma ha un inizio preciso in \\(0\\).</p>`,

      `<span class="fb-label">Non esatto</span>
       <p>Attenzione: \\(\\mathbb{N}\\) include lo zero per convenzione. Il minimo è \\(0\\), non \\(1\\).
       È l'insieme \\(\\mathbb{N}^* = \\{1;\\,2;\\,3;\\,\\ldots\\}\\) quello che esclude lo zero,
       e lì il minimo è \\(1\\).</p>`,

      `<span class="fb-label">Non esatto</span>
       <p>\\(\\mathbb{N}\\) ha un minimo preciso: lo zero. È invece il <em>massimo</em> a non esistere —
       per ogni naturale \\(n\\) esiste sempre il successivo \\(n+1\\). L'insieme è illimitato
       <em>superiormente</em>, non inferiormente.</p>`
    ]
  },

  sottrazione: {
    correct: 1,
    feedbacks: [
      `<span class="fb-label">Non esatto</span>
       <p>\\(-2\\) non appartiene a \\(\\mathbb{N}\\), quindi la sottrazione non è eseguibile in questo
       insieme. Per poter sottrarre sempre occorre estendere \\(\\mathbb{N}\\) all'insieme
       \\(\\mathbb{Z}\\) dei numeri interi relativi.</p>`,

      `<span class="fb-label">Corretto</span>
       <p>Esatto. In \\(\\mathbb{N}\\) la sottrazione \\(a - b\\) è definita solo se \\(a \\geq b\\).
       Poiché \\(6 > 4\\), il risultato \\(4 - 6 = -2\\) non appartiene a \\(\\mathbb{N}\\):
       l'operazione non è eseguibile in questo insieme.</p>`,

      `<span class="fb-label">Non esatto</span>
       <p>\\(4 - 6 = -2\\), non zero. E in ogni caso, il punto è che il risultato deve
       appartenere a \\(\\mathbb{N}\\): la sottrazione richiede \\(a \\geq b\\).
       Qui \\(4 &lt; 6\\), dunque l'operazione non è eseguibile in \\(\\mathbb{N}\\).</p>`,

      `<span class="fb-label">Non esatto</span>
       <p>Stai calcolando \\(6 - 4\\) invece di \\(4 - 6\\). La sottrazione <em>non</em> è
       commutativa: \\(a - b \\neq b - a\\) in generale. Il risultato di \\(4 - 6\\) è
       \\(-2 \\notin \\mathbb{N}\\).</p>`
    ]
  },

  divisibilita: {
    correct: 1,
    feedbacks: [
      `<span class="fb-label">Non esatto</span>
       <p>Applica il criterio correttamente: la somma delle cifre è \\(3+7+2+6 = 18\\),
       e \\(18 = 3 \\times 6\\) è divisibile per \\(3\\). Quindi \\(3\\,726\\)
       <em>è</em> divisibile per \\(3\\). Non si guardano le singole cifre, ma la loro <em>somma</em>.</p>`,

      `<span class="fb-label">Corretto</span>
       <p>Esatto. \\(3+7+2+6 = 18 = 3 \\times 6\\): la somma è divisibile per \\(3\\),
       quindi anche il numero lo è. Il criterio afferma: <em>un numero è divisibile per
       \\(3\\) se e solo se la somma delle sue cifre è divisibile per \\(3\\)</em>.</p>`,

      `<span class="fb-label">Non esatto</span>
       <p>La parità (divisibilità per \\(2\\)) è indipendente dalla divisibilità per \\(3\\).
       Il criterio per il \\(3\\) riguarda la somma delle cifre:
       \\(3+7+2+6 = 18\\), divisibile per \\(3\\). I due criteri non si implicano a vicenda.</p>`,

      `<span class="fb-label">Non esatto</span>
       <p>I criteri di divisibilità servono proprio a evitare la divisione esplicita.
       Basta sommare le cifre: \\(3+7+2+6 = 18 = 3 \\times 6\\). Quindi \\(3\\,726\\)
       è divisibile per \\(3\\) senza fare nessuna divisione lunga.</p>`
    ]
  }
};

function answerQuiz(qid, chosen) {
  const q = QUIZZES[qid];
  const block = document.getElementById('quiz-' + qid);
  if (!block || block.dataset.answered) return;
  block.dataset.answered = 'true';
  block.querySelectorAll('.quiz-opt').forEach((opt, i) => {
    opt.disabled = true;
    if (i === q.correct) opt.classList.add('quiz-correct');
    else if (i === chosen) opt.classList.add('quiz-wrong');
  });
  const fb = document.getElementById('quiz-fb-' + qid);
  const ok = chosen === q.correct;
  fb.innerHTML = `<div class="${ok ? 'fb-ok' : 'fb-no'}">${q.feedbacks[chosen]}</div>`;
  if (typeof MathJax !== 'undefined') MathJax.typesetPromise([fb]);
}

function quiz(qid, question, options) {
  return `<div class="quiz-block" id="quiz-${qid}">
    <div class="quiz-eyebrow">Checkpoint</div>
    <div class="quiz-q">${question}</div>
    <div class="quiz-opts">
      ${options.map((o, i) =>
        `<button class="quiz-opt" onclick="answerQuiz('${qid}', ${i})">${o}</button>`
      ).join('')}
    </div>
    <div class="quiz-feedback" id="quiz-fb-${qid}"></div>
  </div>`;
}

/* ═══════════════ ACCORDION ═══════════════ */
function acc(items) {
  return '<div class="accordion">' + items.map((it, i) => `
    <div class="acc-item">
      <button class="acc-header" onclick="toggleAcc(this)">
        <div class="acc-num">${i + 1}</div>
        <div class="acc-title">${it.t}</div>
        <svg class="acc-arrow" viewBox="0 0 20 20" fill="none">
          <path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="acc-body"><div class="acc-inner">${it.h}</div></div>
    </div>`).join('') + '</div>';
}

function toggleAcc(el) {
  const item = el.closest('.acc-item');
  item.classList.toggle('open');
  if (item.classList.contains('open') && typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([item]);
  }
}

/* ═══════════════ SEMIRETTA SVG ═══════════════ */
function semirettaSVG() {
  const nums = [0, 1, 2, 3, 4, 5];
  const ticks = nums.map((n, i) => {
    const x = 56 + i * 72;
    return `<line x1="${x}" y1="28" x2="${x}" y2="46" stroke="#5a524a" stroke-width="1.6"/>
            <text x="${x}" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#2c2520">${n}</text>`;
  }).join('');
  return `<div class="semiretta-wrap">
    <svg viewBox="0 0 510 72" xmlns="http://www.w3.org/2000/svg"
         style="width:100%;max-width:510px;display:block"
         aria-label="Semiretta orientata dei numeri naturali">
      <line x1="18" y1="37" x2="496" y2="37" stroke="#2c2520" stroke-width="1.8"/>
      <path d="M480 25 L500 37 L480 49" fill="none" stroke="#2c2520" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      ${ticks}
    </svg>
    <span class="semiretta-cap">semiretta orientata dei numeri naturali</span>
  </div>`;
}

/* ═══════════════ SCHERMATE ═══════════════ */
const S = [

/* ──── 0 · INTRODUZIONE ──── */
{
  tag: `INTRODUZIONE`,
  title: `Perché così tanti <em>numeri</em>?`,
  nav: `Introduzione`,
  sub: `«Numeri, continuamente numeri… servono davvero tutti questi numeri?» Sì — e ogni famiglia nasce per rispondere a un bisogno preciso. Quella più antica è quella dei numeri naturali.`,
  body: `
    <div class="cb tip">
      <div class="cb-label">Il punto di partenza</div>
      <p>Il bisogno più antico, quello che ha accompagnato l'essere umano fin dalla preistoria, è il <strong>contare</strong>: quante pecore nel gregge, quanti giorni al raccolto, quanti guerrieri nell'accampamento avversario.</p>
      <p>I numeri nati da questo gesto elementare si chiamano <strong>numeri naturali</strong> — naturali perché nessuno li ha inventati: si impongono da soli non appena si ha qualcosa da contare.</p>
    </div>

    <p>Il loro insieme si indica con il simbolo \\(\\mathbb{N}\\). È il mattone su cui si costruisce tutta la matematica: ogni altra famiglia — interi, razionali, reali — nasce come <em>ampliamento</em> di \\(\\mathbb{N}\\), per rispondere a domande a cui i soli naturali non sanno rispondere.</p>

    <div class="cb">
      <div class="cb-label">La domanda guida di questa lezione</div>
      <p>Cosa possiamo fare con i numeri naturali? Quali operazioni sono sempre possibili, e quali no? E dove si esaurisce \\(\\mathbb{N}\\) — dove cioè abbiamo bisogno di qualcosa di più?</p>
    </div>

    <h2>Mappa della lezione</h2>
    <table class="ct">
      <tr><th>#</th><th>Argomento</th></tr>
      <tr>
        <td style="font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:600">2</td>
        <td>L'insieme \\(\\mathbb{N}\\) e l'ordinamento</td>
      </tr>
      <tr>
        <td style="font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:600">3</td>
        <td>Le quattro operazioni in \\(\\mathbb{N}\\)</td>
      </tr>
      <tr>
        <td style="font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:600">4</td>
        <td>Le potenze</td>
      </tr>
      <tr>
        <td style="font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:600">5</td>
        <td>Divisibilità e numeri primi</td>
      </tr>
      <tr>
        <td style="font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:600">6</td>
        <td>Sintesi e ponte verso \\(\\mathbb{Z}\\)</td>
      </tr>
    </table>
  `
},

/* ──── 1 · L'INSIEME ℕ E L'ORDINAMENTO ──── */
{
  tag: `TEORIA`,
  title: `L'insieme \\(\\mathbb{N}\\) e l'<em>ordinamento</em>`,
  nav: `L'insieme ℕ`,
  sub: `Definizione di ℕ, la questione dello zero, le proprietà strutturali, uguaglianza e disuguaglianza. Con un checkpoint finale.`,
  body: `
    <div class="cb">
      <div class="cb-label">Definizione</div>
      <p>L'insieme dei <strong>numeri naturali</strong> è:</p>
      <div class="math-block center">\\[ \\mathbb{N} = \\{0;\\;1;\\;2;\\;3;\\;\\ldots\\} \\]</div>
      <p>I puntini indicano che l'insieme <em>non finisce mai</em>: per ogni naturale \\(n\\) esiste sempre il suo <strong>successivo</strong> \\(n + 1\\).</p>
    </div>

    <div class="cb tip">
      <div class="cb-label">La questione dello zero — ℕ e ℕ*</div>
      <p>La convenzione italiana (e quella europea) include lo zero in \\(\\mathbb{N}\\). Per i soli naturali <em>positivi</em> si usa la notazione:</p>
      <div class="math-block center">\\[ \\mathbb{N}^* = \\{1;\\;2;\\;3;\\;\\ldots\\} \\]</div>
      <p>Il minimo di \\(\\mathbb{N}\\) è \\(0\\); il minimo di \\(\\mathbb{N}^*\\) è \\(1\\).</p>
    </div>

    <h2>Proprietà fondamentali di \\(\\mathbb{N}\\)</h2>
    <table class="ct">
      <tr><th>Proprietà</th><th>Enunciato</th></tr>
      <tr>
        <td><strong>Infinito</strong></td>
        <td>\\(\\mathbb{N}\\) ha infiniti elementi: dato qualunque naturale \\(n\\), esiste \\(n+1 \\in \\mathbb{N}\\).</td>
      </tr>
      <tr>
        <td><strong>Successivo</strong></td>
        <td>Ogni \\(n \\in \\mathbb{N}\\) ha un unico <em>successivo</em> \\(n+1\\).</td>
      </tr>
      <tr>
        <td><strong>Precedente</strong></td>
        <td>Ogni \\(n > 0\\) ha un unico <em>precedente</em> \\(n-1\\). Lo zero non ha precedente in \\(\\mathbb{N}\\).</td>
      </tr>
      <tr>
        <td><strong>Minimo</strong></td>
        <td>\\(0\\) è il minimo: \\(0 \\leq n\\) per ogni \\(n \\in \\mathbb{N}\\).</td>
      </tr>
      <tr>
        <td><strong>Nessun massimo</strong></td>
        <td>Non esiste un naturale più grande di tutti gli altri: \\(\\mathbb{N}\\) è illimitato superiormente.</td>
      </tr>
    </table>

    <h2>Uguaglianza</h2>
    <p>La relazione \\(=\\) in \\(\\mathbb{N}\\) soddisfa tre proprietà:</p>
    ${acc([
      {
        t: `Proprietà riflessiva: \\(a = a\\)`,
        h: `<p>Ogni numero è uguale a se stesso. È la base della logica matematica.</p>
            <div class="math-block">\\[ \\forall\\,a \\in \\mathbb{N}:\\quad a = a \\]</div>`
      },
      {
        t: `Proprietà simmetrica: se \\(a = b\\) allora \\(b = a\\)`,
        h: `<p>L'uguaglianza è <em>simmetrica</em>: si può sempre invertire l'ordine dei due termini.</p>
            <div class="math-block">\\[ a = b \\implies b = a \\]</div>`
      },
      {
        t: `Proprietà transitiva: se \\(a = b\\) e \\(b = c\\) allora \\(a = c\\)`,
        h: `<p>Due numeri entrambi uguali a un terzo sono uguali tra loro.</p>
            <div class="math-block">\\[ a = b \\text{ e } b = c \\implies a = c \\]</div>`
      }
    ])}

    <h2>Disuguaglianza e ordinamento</h2>
    <p>In \\(\\mathbb{N}\\) si usano le relazioni \\(<\\), \\(>\\), \\(\\leq\\), \\(\\geq\\). Per ogni coppia \\(a, b \\in \\mathbb{N}\\) vale esattamente una delle tre condizioni — questa si chiama <strong>proprietà di tricotomia</strong>:</p>
    <div class="math-block center">\\[ a < b \\qquad \\text{oppure} \\qquad a = b \\qquad \\text{oppure} \\qquad a > b \\]</div>
    <p>L'ordinamento di \\(\\mathbb{N}\\) è <em>totale</em>: tutti gli elementi sono tra loro confrontabili.</p>

    <h2>La semiretta orientata</h2>
    <p>I numeri naturali si rappresentano su una <strong>semiretta orientata</strong>: un'origine fissa in \\(0\\) e un verso positivo verso destra. I numeri crescono procedendo da sinistra a destra, senza mai fermarsi.</p>
    ${semirettaSVG()}

    ${quiz(`minimo`,
      `Qual è l'elemento minimo dell'insieme \\(\\mathbb{N}\\)?`,
      [
        `\\(0\\) — lo zero`,
        `\\(1\\) — perché lo zero non è un "vero" numero naturale`,
        `Non esiste: \\(\\mathbb{N}\\) è illimitato in entrambe le direzioni`
      ]
    )}
  `
},

/* ──── 2 · LE QUATTRO OPERAZIONI ──── */
{
  tag: `TEORIA`,
  title: `Le quattro <em>operazioni</em> in \\(\\mathbb{N}\\)`,
  nav: `Operazioni`,
  sub: `Addizione, sottrazione, moltiplicazione e divisione: proprietà di ciascuna e i due punti critici che segnano i limiti di ℕ.`,
  body: `

    <h2>Addizione</h2>
    <div class="cb">
      <div class="cb-label">Chiusura</div>
      <p>La somma di due naturali è sempre un naturale: \\(a + b \\in \\mathbb{N}\\) per ogni \\(a, b \\in \\mathbb{N}\\).</p>
    </div>
    <table class="ct">
      <tr><th>Proprietà</th><th>Formula</th><th>Esempio</th></tr>
      <tr><td>Commutativa</td><td>\\(a + b = b + a\\)</td><td>\\(3 + 7 = 7 + 3\\)</td></tr>
      <tr><td>Associativa</td><td>\\((a+b)+c = a+(b+c)\\)</td><td>\\((2+3)+4 = 2+(3+4)\\)</td></tr>
      <tr><td>Elemento neutro</td><td>\\(a + 0 = a\\)</td><td>\\(5 + 0 = 5\\)</td></tr>
    </table>

    <h2>Sottrazione</h2>
    <div class="cb danger">
      <div class="cb-label">Punto critico (1) — limite di ℕ</div>
      <p>La sottrazione \\(a - b\\) in \\(\\mathbb{N}\\) è definita <strong>solo se \\(a \\geq b\\)</strong>. Se \\(a < b\\), il risultato sarebbe negativo e non appartiene a \\(\\mathbb{N}\\):</p>
      <div class="math-block warn">\\[ 4 - 6 \\notin \\mathbb{N} \\qquad (\\text{non eseguibile in } \\mathbb{N}) \\]</div>
      <p>Questo limite è la ragione per cui, nella prossima lezione, estenderemo \\(\\mathbb{N}\\) all'insieme \\(\\mathbb{Z}\\) dei numeri interi relativi.</p>
    </div>
    <table class="ct">
      <tr><th>Proprietà</th><th>Nota</th></tr>
      <tr><td>Non commutativa</td><td>\\(a - b \\neq b - a\\) in generale: \\(5 - 3 \\neq 3 - 5\\)</td></tr>
      <tr><td>Non associativa</td><td>\\((8-3)-2 = 3\\), ma \\(8-(3-2) = 7\\)</td></tr>
      <tr><td>Elemento neutro (destro)</td><td>\\(a - 0 = a\\)</td></tr>
    </table>

    <h2>Moltiplicazione</h2>
    <table class="ct">
      <tr><th>Proprietà</th><th>Formula</th><th>Esempio</th></tr>
      <tr><td>Commutativa</td><td>\\(a \\cdot b = b \\cdot a\\)</td><td>\\(6 \\cdot 4 = 4 \\cdot 6\\)</td></tr>
      <tr><td>Associativa</td><td>\\((a \\cdot b) \\cdot c = a \\cdot (b \\cdot c)\\)</td><td>\\((2 \\cdot 3) \\cdot 5 = 2 \\cdot (3 \\cdot 5)\\)</td></tr>
      <tr><td>Distributiva</td><td>\\(a \\cdot (b+c) = a \\cdot b + a \\cdot c\\)</td><td>\\(3(4+2) = 12+6\\)</td></tr>
      <tr><td>Elemento neutro</td><td>\\(a \\cdot 1 = a\\)</td><td>\\(9 \\cdot 1 = 9\\)</td></tr>
      <tr><td>Elemento assorbente</td><td>\\(a \\cdot 0 = 0\\)</td><td>\\(17 \\cdot 0 = 0\\)</td></tr>
    </table>

    <h2>Divisione</h2>
    <p>La <strong>divisione esatta</strong> \\(a \\div b\\) in \\(\\mathbb{N}\\) fornisce un risultato naturale solo se \\(b\\) divide esattamente \\(a\\): non è sempre possibile.</p>

    <div class="cb danger">
      <div class="cb-label">Punto critico (2) — divisione per zero</div>
      <p>La divisione per zero è <strong>sempre vietata</strong> in qualunque insieme numerico. L'espressione \\(a \\div 0\\) è matematicamente priva di significato, senza eccezioni.</p>
    </div>

    <div class="cb">
      <div class="cb-label">Divisione con resto — algoritmo euclideo</div>
      <p>Dati \\(a, b \\in \\mathbb{N}\\) con \\(b \\neq 0\\), esistono <strong>unici</strong> \\(q, r \\in \\mathbb{N}\\) tali che:</p>
      <div class="math-block center">\\[ a = b \\cdot q + r \\qquad \\text{con } 0 \\leq r < b \\]</div>
      <p>\\(q\\) è il <strong>quoziente</strong>, \\(r\\) è il <strong>resto</strong>. Se \\(r = 0\\) la divisione è esatta.</p>
      <p style="margin-top:6px">Esempio: \\(29 = 4 \\cdot 7 + 1\\), quindi \\(29 \\div 4\\) dà quoziente \\(7\\) e resto \\(1\\).</p>
    </div>

    ${quiz(`sottrazione`,
      `È possibile eseguire la sottrazione \\(4 - 6\\) nell'insieme \\(\\mathbb{N}\\)?`,
      [
        `Sì: il risultato è \\(-2\\)`,
        `No: il sottraendo è maggiore del minuendo, il risultato non appartiene a \\(\\mathbb{N}\\)`,
        `Sì, ma il risultato è \\(0\\)`,
        `Sì: il risultato è \\(2\\) (si inverte l'ordine)`
      ]
    )}
  `
},

/* ──── 3 · POTENZE ──── */
{
  tag: `TEORIA`,
  title: `Le <em>potenze</em>`,
  nav: `Potenze`,
  sub: `Una notazione compatta per le moltiplicazioni ripetute. Cinque proprietà ne governano il calcolo — e una trappola frequente da tenere sempre a mente.`,
  body: `
    <div class="cb">
      <div class="cb-label">Definizione</div>
      <p>La <strong>potenza</strong> \\(a^n\\) è il prodotto di \\(n\\) fattori tutti uguali ad \\(a\\):</p>
      <div class="math-block center">
        \\[ a^n = \\underbrace{a \\cdot a \\cdot \\ldots \\cdot a}_{n \\text{ fattori}} \\qquad n \\in \\mathbb{N},\\; n \\geq 1 \\]
      </div>
      <p>\\(a\\) è la <strong>base</strong>, \\(n\\) è l'<strong>esponente</strong>.</p>
    </div>

    <h2>Convenzioni speciali</h2>
    <table class="ct">
      <tr><th>Espressione</th><th>Valore</th><th>Nota</th></tr>
      <tr>
        <td>\\(a^1\\)</td>
        <td>\\(a\\)</td>
        <td>L'esponente 1 lascia invariata la base.</td>
      </tr>
      <tr>
        <td>\\(a^0\\) &nbsp;(con \\(a \\neq 0\\))</td>
        <td>\\(1\\)</td>
        <td>Ogni base non nulla elevata a 0 vale 1.</td>
      </tr>
      <tr>
        <td>\\(0^0\\)</td>
        <td>non definito</td>
        <td>Forma indeterminata: non ha significato matematico, non si usa.</td>
      </tr>
    </table>

    <h2>Proprietà delle potenze</h2>
    ${acc([
      {
        t: `Prodotto con la stessa base: \\(a^m \\cdot a^n = a^{m+n}\\)`,
        h: `<p>Per moltiplicare potenze con la stessa base si <strong>sommano</strong> gli esponenti.</p>
            <div class="math-block">\\[ 2^3 \\cdot 2^4 = 2^{3+4} = 2^7 = 128 \\]</div>`
      },
      {
        t: `Quoziente con la stessa base: \\(a^m \\div a^n = a^{m-n}\\) &nbsp;(\\(m > n,\\; a \\neq 0\\))`,
        h: `<p>Per dividere potenze con la stessa base si <strong>sottraggono</strong> gli esponenti.
            Richiede \\(m > n\\) (siamo in \\(\\mathbb{N}\\)) e base diversa da zero.</p>
            <div class="math-block">\\[ 3^5 \\div 3^2 = 3^{5-2} = 3^3 = 27 \\]</div>`
      },
      {
        t: `Potenza di potenza: \\((a^m)^n = a^{m \\cdot n}\\)`,
        h: `<p>Per elevare una potenza ad un esponente si <strong>moltiplicano</strong> gli esponenti.</p>
            <div class="math-block">\\[ (2^3)^4 = 2^{3 \\cdot 4} = 2^{12} = 4096 \\]</div>`
      },
      {
        t: `Prodotto con lo stesso esponente: \\(a^n \\cdot b^n = (a \\cdot b)^n\\)`,
        h: `<p>Le basi si moltiplicano e l'esponente rimane lo stesso.</p>
            <div class="math-block">\\[ 2^4 \\cdot 3^4 = (2 \\cdot 3)^4 = 6^4 = 1296 \\]</div>`
      },
      {
        t: `Quoziente con lo stesso esponente: \\(a^n \\div b^n = (a \\div b)^n\\) &nbsp;(\\(b \\neq 0\\))`,
        h: `<p>Analogamente, le basi si dividono e l'esponente rimane lo stesso.</p>
            <div class="math-block">\\[ 6^3 \\div 2^3 = (6 \\div 2)^3 = 3^3 = 27 \\]</div>`
      }
    ])}

    <div class="cb danger">
      <div class="cb-label">Avvertenza fondamentale</div>
      <p>La potenza di una <strong>somma</strong> non è la somma delle potenze. È uno degli errori più frequenti in algebra:</p>
      <div class="compare-row">
        <div class="compare-card wrong">
          <div class="compare-label">Sbagliato</div>
          \\((a+b)^n = a^n + b^n\\)
        </div>
        <div class="compare-card right">
          <div class="compare-label">Corretto</div>
          \\((a+b)^n \\neq a^n + b^n\\) in generale
        </div>
      </div>
      <p style="margin-top:10px">Verifica con numeri: \\((2+3)^2 = 5^2 = 25\\), mentre \\(2^2 + 3^2 = 4 + 9 = 13 \\neq 25\\).</p>
    </div>

    <h2>Esercizi guidati</h2>
    ${acc([
      {
        t: `Esercizio 1: prodotto e quoziente di potenze`,
        h: `
          <p><strong>Calcola e semplifica:</strong> \\(\\dfrac{5^6 \\cdot 5^2}{5^4}\\)</p>
          <div style="background:rgba(194,24,91,0.04);padding:12px;border-radius:4px;margin:12px 0;border-left:2px solid #c2185b">
            <p style="font-size:0.9rem"><strong>Soluzione passo passo:</strong></p>
            <div class="math-block center" style="margin:8px 0">\\[ \\frac{5^6 \\cdot 5^2}{5^4} = \\frac{5^{6+2}}{5^4} = \\frac{5^8}{5^4} = 5^{8-4} = 5^4 = 625 \\]</div>
            <p style="font-size:0.9rem"><strong>Spiegazione:</strong> Nel numeratore, moltiplichiamo potenze con la stessa base sommando gli esponenti: \\(5^6 \\cdot 5^2 = 5^{6+2} = 5^8\\). Poi dividiamo per \\(5^4\\) sottraendo gli esponenti: \\(5^8 : 5^4 = 5^{8-4} = 5^4\\). Infine calcoliamo: \\(5^4 = 625\\).</p>
          </div>
        `
      },
      {
        t: `Esercizio 2: potenza di potenza e prodotto di potenze`,
        h: `
          <p><strong>Calcola e semplifica:</strong> \\((2^2)^3 \\cdot 2^1\\)</p>
          <div style="background:rgba(194,24,91,0.04);padding:12px;border-radius:4px;margin:12px 0;border-left:2px solid #c2185b">
            <p style="font-size:0.9rem"><strong>Soluzione passo passo:</strong></p>
            <div class="math-block center" style="margin:8px 0">\\[ (2^2)^3 \\cdot 2^1 = 2^{2 \\cdot 3} \\cdot 2^1 = 2^6 \\cdot 2^1 = 2^{6+1} = 2^7 = 128 \\]</div>
            <p style="font-size:0.9rem"><strong>Spiegazione:</strong> Per la potenza di potenza, moltiplichiamo gli esponenti: \\((2^2)^3 = 2^{2 \\times 3} = 2^6\\). Adesso moltiplichiamo \\(2^6 \\cdot 2^1\\) sommando gli esponenti: \\(2^{6+1} = 2^7 = 128\\).</p>
          </div>
        `
      }
    ])}
  `
},

/* ──── 4 · DIVISIBILITÀ E NUMERI PRIMI ──── */
{
  tag: `TEORIA`,
  title: `Divisibilità e <em>numeri primi</em>`,
  nav: `Divisibilità`,
  sub: `Multipli, divisori, criteri di divisibilità, scomposizione in fattori primi. Come si calcolano MCD e mcm con procedimenti rigorosi. Con un checkpoint.`,
  body: `
    <div class="cb">
      <div class="cb-label">Definizione di divisibilità</div>
      <p>Un naturale \\(a\\) è <strong>divisibile</strong> per \\(b \\neq 0\\) se esiste \\(k \\in \\mathbb{N}\\) tale che \\(a = b \\cdot k\\). Si scrive \\(b \\mid a\\). In tal caso:</p>
      <ul>
        <li>\\(b\\) è un <strong>divisore</strong> di \\(a\\);</li>
        <li>\\(a\\) è un <strong>multiplo</strong> di \\(b\\).</li>
      </ul>
    </div>

    <h2>Criteri di divisibilità</h2>
    <p>Permettono di stabilire la divisibilità <em>senza eseguire la divisione</em>, guardando solo le cifre del numero.</p>
    <table class="ct">
      <tr><th>Per</th><th>Criterio</th><th>Esempio</th></tr>
      <tr>
        <td><strong>2</strong></td>
        <td>L'ultima cifra è \\(0, 2, 4, 6\\) oppure \\(8\\).</td>
        <td>\\(348\\) → ultima cifra \\(8\\) ✓</td>
      </tr>
      <tr>
        <td><strong>3</strong></td>
        <td>La somma delle cifre è divisibile per \\(3\\).</td>
        <td>\\(312{:}\\;3+1+2=6\\) ✓</td>
      </tr>
      <tr>
        <td><strong>4</strong></td>
        <td>Le ultime due cifre formano un numero divisibile per \\(4\\).</td>
        <td>\\(1\\,324{:}\\;24 = 4 \\times 6\\) ✓</td>
      </tr>
      <tr>
        <td><strong>5</strong></td>
        <td>L'ultima cifra è \\(0\\) oppure \\(5\\).</td>
        <td>\\(235\\) → ultima cifra \\(5\\) ✓</td>
      </tr>
      <tr>
        <td><strong>9</strong></td>
        <td>La somma delle cifre è divisibile per \\(9\\).</td>
        <td>\\(729{:}\\;7+2+9=18\\) ✓</td>
      </tr>
      <tr>
        <td><strong>10</strong></td>
        <td>L'ultima cifra è \\(0\\).</td>
        <td>\\(4\\,560\\) ✓</td>
      </tr>
      <tr>
        <td><strong>11</strong></td>
        <td>La somma alternata delle cifre (da destra) è divisibile per \\(11\\).</td>
        <td>\\(1\\,331{:}\\;1-3+3-1=0\\) ✓</td>
      </tr>
      <tr>
        <td><strong>25</strong></td>
        <td>Le ultime due cifre formano un numero divisibile per \\(25\\).</td>
        <td>\\(1\\,275{:}\\;75 = 25 \\times 3\\) ✓</td>
      </tr>
    </table>

    <h2>Numeri primi e scomposizione</h2>
    <div class="cb tip">
      <div class="cb-label">Numero primo</div>
      <p>Un naturale \\(p > 1\\) è <strong>primo</strong> se i suoi unici divisori sono \\(1\\) e \\(p\\) stesso.
      I primi numeri primi sono \\(2,\\,3,\\,5,\\,7,\\,11,\\,13,\\,17,\\,19,\\,\\ldots\\)
      Il numero \\(1\\) non è primo per convenzione.</p>
    </div>

    <div class="cb">
      <div class="cb-label">Teorema fondamentale dell'aritmetica</div>
      <p>Ogni naturale \\(n > 1\\) si scrive in modo <strong>unico</strong> come prodotto di numeri primi (a meno dell'ordine dei fattori). Questo si chiama <strong>scomposizione in fattori primi</strong>.</p>
      <div class="math-block center">\\[ 360 = 2^3 \\cdot 3^2 \\cdot 5 \\]</div>
    </div>

    <h2>MCD e mcm</h2>
    ${acc([
      {
        t: `Massimo Comune Divisore (MCD)`,
        h: `<p>Il <strong>MCD</strong> di due numeri è il più grande divisore comune ad entrambi.</p>
            <div class="cb tip" style="margin:10px 0">
              <div class="cb-label">Procedimento</div>
              <div class="step-grid">
                <div class="step-circle">1</div>
                <div class="step-text">Scomponi entrambi i numeri in fattori primi.</div>
                <div class="step-circle">2</div>
                <div class="step-text">Prendi i fattori <em>comuni</em> con l'esponente <strong>minimo</strong>.</div>
              </div>
            </div>
            <p><strong>Esempio:</strong> \\(\\text{MCD}(12,\\,18)\\)</p>
            <div class="math-block">\\[\\begin{aligned}
              12 &= 2^2 \\cdot 3^1 \\\\
              18 &= 2^1 \\cdot 3^2 \\\\[6pt]
              \\text{MCD}(12,\\,18) &= 2^1 \\cdot 3^1 = 6
            \\end{aligned}\\]</div>
            <p class="dim">Fattori comuni: \\(2\\) (esponente minimo \\(1\\)) e \\(3\\) (esponente minimo \\(1\\)).</p>`
      },
      {
        t: `Minimo Comune Multiplo (mcm)`,
        h: `<p>Il <strong>mcm</strong> di due numeri è il più piccolo multiplo comune ad entrambi.</p>
            <div class="cb tip" style="margin:10px 0">
              <div class="cb-label">Procedimento</div>
              <div class="step-grid">
                <div class="step-circle">1</div>
                <div class="step-text">Scomponi entrambi i numeri in fattori primi.</div>
                <div class="step-circle">2</div>
                <div class="step-text">Prendi <em>tutti</em> i fattori (comuni e non) con l'esponente <strong>massimo</strong>.</div>
              </div>
            </div>
            <p><strong>Esempio:</strong> \\(\\text{mcm}(12,\\,18)\\)</p>
            <div class="math-block">\\[\\begin{aligned}
              12 &= 2^2 \\cdot 3^1 \\\\
              18 &= 2^1 \\cdot 3^2 \\\\[6pt]
              \\text{mcm}(12,\\,18) &= 2^2 \\cdot 3^2 = 4 \\cdot 9 = 36
            \\end{aligned}\\]</div>
            <div class="cb success" style="margin-top:14px">
              <div class="cb-label">Relazione MCD – mcm</div>
              <p>Vale sempre la relazione: \\(\\;\\text{MCD}(a,b) \\cdot \\text{mcm}(a,b) = a \\cdot b\\)</p>
              <p>Verifica: \\(6 \\cdot 36 = 216 = 12 \\cdot 18\\) ✓</p>
            </div>`
      }
    ])}

    ${quiz(`divisibilita`,
      `Il numero \\(3\\,726\\) è divisibile per \\(3\\)?`,
      [
        `No: nessuna cifra del numero è divisibile per \\(3\\)`,
        `Sì: la somma delle cifre è \\(3+7+2+6=18\\), divisibile per \\(3\\)`,
        `Sì, ma solo perché il numero è pari`,
        `Non si può stabilire senza eseguire la divisione`
      ]
    )}
  `
},

/* ──── 5 · SINTESI E PONTE ──── */
{
  tag: `SINTESI E PONTE`,
  title: `Cosa abbiamo costruito — e dove <em>ℕ non basta</em>`,
  nav: `Sintesi`,
  sub: `Un bilancio di ℕ: struttura, operazioni, divisibilità. Il limite che resta aperto e la strada verso i numeri interi.`,
  body: `
    <div class="cb success">
      <div class="cb-label">Ciò che abbiamo imparato</div>
      <ul>
        <li>\\(\\mathbb{N} = \\{0;\\,1;\\,2;\\,3;\\,\\ldots\\}\\) è infinito, ordinato totalmente, con minimo \\(0\\) e nessun massimo.</li>
        <li>L'uguaglianza in \\(\\mathbb{N}\\) è riflessiva, simmetrica e transitiva.</li>
        <li>L'addizione e la moltiplicazione sono sempre eseguibili in \\(\\mathbb{N}\\) e godono di proprietà ricche: commutatività, associatività, distributività.</li>
        <li>Le potenze si calcolano con cinque proprietà; attenzione: \\((a+b)^n \\neq a^n + b^n\\).</li>
        <li>Ogni naturale \\(>1\\) si scompone in modo unico in fattori primi; MCD e mcm si trovano con gli esponenti minimi e massimi rispettivamente.</li>
      </ul>
    </div>

    <h2>Il limite di \\(\\mathbb{N}\\)</h2>
    <div class="cb danger">
      <div class="cb-label">La sottrazione non è sempre possibile</div>
      <p>In \\(\\mathbb{N}\\) la sottrazione \\(a - b\\) è definita solo se \\(a \\geq b\\). In caso contrario il risultato è negativo e non appartiene all'insieme:</p>
      <div class="math-block warn">
        \\[ 4 - 6 \\notin \\mathbb{N} \\qquad 1 - 5 \\notin \\mathbb{N} \\qquad 0 - 1 \\notin \\mathbb{N} \\]
      </div>
      <p>Si dice che \\(\\mathbb{N}\\) non è <strong>chiuso</strong> rispetto alla sottrazione. Questo è il limite strutturale di \\(\\mathbb{N}\\).</p>
    </div>

    <div class="cb">
      <div class="cb-label">La soluzione: ampliare l'insieme</div>
      <p>Affiancando a ogni naturale il suo opposto negativo, si costruisce l'insieme dei <strong>numeri interi relativi</strong>:</p>
      <div class="math-block center">\\[ \\mathbb{Z} = \\{\\ldots,\\;-3,\\;-2,\\;-1,\\;0,\\;1,\\;2,\\;3,\\;\\ldots\\} \\]</div>
      <p>In \\(\\mathbb{Z}\\) la sottrazione è <em>sempre</em> eseguibile. E poiché ogni numero naturale è anche un intero, si ha \\(\\mathbb{N} \\subset \\mathbb{Z}\\): \\(\\mathbb{N}\\) è contenuto in \\(\\mathbb{Z}\\).</p>
    </div>

    <h2>La catena degli insiemi numerici</h2>
    <div class="cb tip">
      <div class="cb-label">Una successione di ampliamenti</div>
      <p>Ogni insieme include il precedente e risolve una nuova limitazione:</p>
      <div class="math-block center">\\[ \\mathbb{N} \\subset \\mathbb{Z} \\subset \\mathbb{Q} \\subset \\mathbb{R} \\]</div>
      <div style="display:flex;flex-direction:column;align-items:center;margin:16px 0;gap:6px">
        <img src="matrioska.jpg" alt="Matrioske che rappresentano l'inclusione degli insiemi numerici N, Z, I, Q, R, C" style="max-width:100%;height:auto;max-height:340px">
        <span style="font-family:'Fira Code',monospace;font-size:.72rem;color:var(--text-dim)">ogni insieme più grande contiene tutti quelli più piccoli</span>
      </div>
      <table class="ct" style="margin-top:12px">
        <tr><th>Insieme</th><th>Risolve il problema di…</th></tr>
        <tr><td>\\(\\mathbb{N}\\)</td><td>Contare oggetti</td></tr>
        <tr><td>\\(\\mathbb{Z}\\)</td><td>Sottrarre sempre (numeri negativi)</td></tr>
        <tr><td>\\(\\mathbb{Q}\\)</td><td>Dividere sempre, tranne per zero (frazioni)</td></tr>
        <tr><td>\\(\\mathbb{R}\\)</td><td>Misurare grandezze continue ed estrarre radici</td></tr>
      </table>
    </div>

    <div class="cb tip">
      <div class="cb-label">Prossima lezione</div>
      <p>Costruiremo \\(\\mathbb{Z}\\): come si definiscono i numeri negativi, come si opera con il segno e quali nuove proprietà emergono rispetto a \\(\\mathbb{N}\\).</p>
    </div>
  `
}

]; // fine schermate

/* ═══════════════ APP ═══════════════ */
let cur = 0;
const tot = S.length;

function render() {
  // nav pills
  document.getElementById('topNav').innerHTML = S.map((s, i) =>
    `<button class="nav-pill ${i === cur ? 'active' : ''}" onclick="goTo(${i})">${s.nav}</button>`
  ).join('');

  // screens
  document.getElementById('app').innerHTML = S.map((s, i) => `
    <div class="section ${i === cur ? 'active' : ''}">
      <div class="hero">
        <div class="hero-tag">${s.tag}</div>
        <h1>${s.title}</h1>
        <p class="hero-sub">${s.sub}</p>
      </div>
      ${s.body}
      <div class="bottom-nav">
        <button class="bb" onclick="goTo(${i - 1})" ${i === 0 ? 'disabled' : ''}>← Indietro</button>
        <div class="dots">
          ${S.map((_, j) =>
            `<button class="dot ${j === i ? 'active' : ''}" onclick="goTo(${j})"
             title="Schermata ${j + 1} di ${tot}"></button>`
          ).join('')}
        </div>
        <button class="bb" onclick="goTo(${i + 1})" ${i === tot - 1 ? 'disabled' : ''}>Avanti →</button>
      </div>
    </div>
  `).join('');

  // typeset active section
  if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
    const active = document.querySelector('.section.active');
    if (active) MathJax.typesetPromise([active]);
  }
}

function goTo(idx) {
  if (idx < 0 || idx >= tot) return;
  cur = idx;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goTo(cur + 1);
  if (e.key === 'ArrowLeft')  goTo(cur - 1);
});

// avvia dopo MathJax
if (typeof MathJax !== 'undefined' && MathJax.startup && MathJax.startup.promise) {
  MathJax.startup.promise.then(() => render());
} else {
  render();
  document.body.style.opacity = '1';
}
</script>
</body>
</html>
