function acc(items) {
  return '<div class="accordion">' + items.map((it, i) =>
    '<div class="acc-item">' +
      '<div class="acc-header" onclick="toggleAcc(this)">' +
        '<div class="acc-num">' + (i + 1) + '</div>' +
        '<div class="acc-title">' + it.t + '</div>' +
        '<svg class="acc-arrow" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
      '</div>' +
      '<div class="acc-body"><div class="acc-inner">' + it.h + '</div></div>' +
    '</div>'
  ).join('') + '</div>';
}

function toggleAcc(el) {
  const item = el.parentElement;
  item.classList.toggle('open');
  if (item.classList.contains('open') && typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([item]);
  }
}

const S = [

{
  part:"Parte I — La crisi e i postulati",
  tag:"1887 · UN RISULTATO NEGATIVO",
  title:"L'enigma dell'<em>etere</em>",
  nav:"L'etere",
  body:
    '<div class="hero-img-wrap"><img src="featured.jpg" alt="Cono di luce nello spaziotempo"></div>' +
    '<p>Nella lezione sulle equazioni di Maxwell abbiamo visto come, verso la fine dell\'Ottocento, la teoria elettromagnetica avesse previsto l\'esistenza della luce come onda elettromagnetica, con una velocità nel vuoto \\(c=1/\\sqrt{\\mu_0\\varepsilon_0}\\approx3\\times10^8\\) m/s. Ma un\'onda, si pensava allora, ha sempre bisogno di un mezzo in cui propagarsi — il suono ha bisogno dell\'aria, le onde del mare hanno bisogno dell\'acqua. Di cosa aveva bisogno la luce?</p>' +
    '<div class="cb"><div class="cb-label">L\'ipotesi dell\'etere luminifero</div><p>I fisici ottocenteschi postularono l\'esistenza di un mezzo invisibile e impalpabile, che permeava tutto lo spazio (persino il vuoto interplanetario): l\'<strong>etere luminifero</strong>. La luce, secondo questa ipotesi, si sarebbe propagata rispetto all\'etere esattamente come il suono si propaga rispetto all\'aria — e la velocità \\(c\\) prevista da Maxwell sarebbe stata la velocità della luce <em>rispetto all\'etere</em>, non rispetto a un osservatore qualunque.</p></div>' +
    '<div class="cb tip"><div class="cb-label">Un\'idea verificabile</div><p>Se l\'etere esiste ed è (più o meno) fermo nello spazio, e la Terra vi orbita attraverso muovendosi a circa \\(30\\) km/s attorno al Sole, allora un osservatore terrestre dovrebbe misurare velocità della luce leggermente diverse a seconda della direzione di misura: un po\' più veloce "controvento" rispetto al moto della Terra nell\'etere, un po\' più lenta "sottovento" — esattamente come un nuotatore in un fiume è più lento a risalire la corrente che a scenderla.</p></div>' +
    '<div class="cb warn"><div class="cb-label">1887 — l\'esperimento di Michelson e Morley</div><p>Albert Michelson ed Edward Morley costruirono uno strumento estremamente sensibile (un interferometro) capace di rilevare differenze minime nella velocità della luce lungo direzioni diverse, confrontando i tempi di andata e ritorno di due raggi di luce perpendicolari. Il risultato, ripetuto in mesi diversi dell\'anno (quindi con la Terra in punti diversi della sua orbita) fu, con enorme sorpresa dei due sperimentatori: <strong>nessuna differenza misurabile</strong>, entro la precisione dello strumento. La luce sembrava viaggiare esattamente alla stessa velocità in ogni direzione, indipendentemente dal moto della Terra.</p></div>' +
    '<p>Fu uno dei risultati sperimentali "negativi" più famosi e più fecondi della storia della fisica: un esperimento pensato per <em>confermare</em> l\'esistenza dell\'etere finì, invece, per minarne le fondamenta. Per quasi vent\'anni i fisici tentarono spiegazioni sempre più complicate (contrazioni dell\'apparato, trascinamento parziale dell\'etere) per salvare l\'ipotesi. La soluzione definitiva sarebbe arrivata da tutt\'altra direzione.</p>' +
    acc([
      { t:"Domanda concettuale — l\'analogia del nuotatore", h:'<p>Perché l\'analogia del nuotatore in un fiume rende bene l\'idea di cosa ci si aspettava dall\'esperimento di Michelson-Morley, e perché il risultato ottenuto fu così sorprendente rispetto a questa aspettativa? <em>Traccia</em>: un nuotatore misura velocità diverse a seconda che nuoti a favore o contro corrente rispetto alla riva; ci si aspettava lo stesso per la luce rispetto all\'"etere in movimento" visto dalla Terra — ma la misura non mostrò alcuna differenza, come se non ci fosse nessuna corrente da tener conto.</p>' },
      { t:"Per chi vuole andare oltre il programma", h:'<p>Cerca cosa si intende per "ipotesi ad hoc" in filosofia della scienza, e prova a collegarla ai tentativi (come la contrazione di Lorentz-FitzGerald, proposta prima di Einstein) di salvare l\'ipotesi dell\'etere aggiustandola per farla coincidere col risultato nullo di Michelson-Morley, invece di abbandonarla del tutto.</p>' }
    ])
},

{
  part:"Parte I — La crisi e i postulati",
  tag:"1905 · L'ANNO MIRABILE",
  title:"I due postulati di <em>Einstein</em>",
  nav:"I postulati",
  body:
    '<p>Nel 1905 — lo stesso anno in cui pubblicò anche il lavoro sull\'effetto fotoelettrico e quello sul moto browniano — un impiegato ventiseienne dell\'ufficio brevetti di Berna, Albert Einstein, propose una soluzione radicale: non serviva salvare l\'etere con ipotesi sempre più artificiose. Bisognava semplicemente <strong>abbandonarlo</strong>, e prendere sul serio, fino in fondo, il risultato nullo di Michelson-Morley.</p>' +
    '<div class="cb"><div class="cb-label">Primo postulato — principio di relatività</div><p>Le leggi della fisica hanno la <strong>stessa forma</strong> in tutti i sistemi di riferimento inerziali (cioè non accelerati). Non esiste nessun esperimento, condotto interamente all\'interno di un laboratorio chiuso, capace di rivelare se quel laboratorio è "fermo" o si muove di moto rettilineo uniforme — non esiste, insomma, un sistema di riferimento privilegiato, un "etere" a riposo assoluto rispetto a cui misurare ogni altro moto.</p></div>' +
    '<div class="cb tip"><div class="cb-label">Secondo postulato — costanza della velocità della luce</div><p>La velocità della luce nel vuoto, \\(c\\), ha lo <strong>stesso valore per tutti gli osservatori inerziali</strong>, indipendentemente dal moto della sorgente che l\'ha emessa o dal moto dell\'osservatore che la misura.</p></div>' +
    '<div class="cb danger"><div class="cb-label">Perché questo è così strano</div><p>Nella meccanica di Newton, le velocità si sommano semplicemente: se lanci una palla a \\(10\\) m/s da un treno che viaggia a \\(20\\) m/s, un osservatore a terra la vede muoversi a \\(30\\) m/s. Il secondo postulato dice che questo <strong>non vale per la luce</strong>: se accendi una torcia su un\'astronave che viaggia al \\(90\\%\\) della velocità della luce, sia tu (sull\'astronave) sia un osservatore fermo a terra misurate <em>esattamente la stessa</em> velocità \\(c\\) per quella luce — non \\(c\\) più la velocità dell\'astronave. È un\'affermazione che sembra logicamente assurda, eppure è stata confermata da ogni esperimento condotto da più di un secolo a questa parte.</p></div>' +
    '<p>Einstein non stava proponendo una piccola correzione tecnica: stava chiedendo di riscrivere da zero i concetti di spazio e tempo, considerati fino ad allora assoluti e universali fin dai tempi di Newton. Le conseguenze di questi due postulati, apparentemente innocui, si sarebbero rivelate radicali, ed è a queste conseguenze che sono dedicate le prossime schede.</p>' +
    acc([
      { t:"Domanda concettuale — perché serviva abbandonare l\'etere", h:'<p>In che modo il primo postulato di Einstein rende superfluo il concetto di etere come "sistema di riferimento a riposo assoluto"? <em>Traccia</em>: se nessun esperimento può mai distinguere un sistema di riferimento inerziale "fermo" da uno "in moto uniforme", non ha più senso cercare un sistema privilegiato (l\'etere) rispetto a cui definire il moto assoluto — ogni sistema inerziale è ugualmente legittimo.</p>' },
      { t:"Esercizio concettuale — la torcia sull\'astronave", h:'<p>Un\'astronave viaggia al \\(80\\%\\) di \\(c\\) rispetto alla Terra. Un passeggero a bordo accende una torcia puntata in avanti. Quale velocità misura, per quella luce, il passeggero a bordo? E quale velocità la misura un osservatore fermo sulla Terra? <em>Traccia</em>: entrambi misurano esattamente \\(c\\) — non \\(c+0{,}8c=1{,}8c\\) come direbbe l\'intuizione newtoniana. È proprio questo il contenuto (sorprendente) del secondo postulato.</p>' }
    ])
},

{
  part:"Parte I — La crisi e i postulati",
  tag:"CONSEGUENZA IMMEDIATA",
  title:"La relatività della <em>simultaneità</em>",
  nav:"Simultaneità",
  body:
    '<p>La prima e più immediata vittima dei due postulati è un\'idea che sembrava ovvia a chiunque: che due eventi possano essere oggettivamente "simultanei", cioè accadere nello stesso istante, indipendentemente da chi li osserva.</p>' +
    '<div class="cb"><div class="cb-label">L\'esperimento mentale del treno di Einstein</div><p>Immagina un treno molto lungo, in moto a velocità costante, con un osservatore \\(M\'\\) seduto esattamente al centro della carrozza. Nell\'istante in cui \\(M\'\\) passa davanti a un osservatore \\(M\'\'\\) fermo sul marciapiede, due fulmini colpiscono contemporaneamente le due estremità del treno — contemporaneamente, cioè, <strong>secondo l\'osservatore a terra</strong> \\(M\'\'\\), che si trova a uguale distanza da entrambi i punti d\'impatto.</p></div>' +
    '<div class="cb tip"><div class="cb-label">Cosa vede l\'osservatore sul treno</div><p>La luce dei due lampi impiega lo stesso tempo per raggiungere \\(M\'\'\\) (fermo, a uguale distanza da entrambi), quindi \\(M\'\'\\) li percepisce davvero come simultanei. Ma \\(M\'\\), seduto al centro del treno, nel frattempo si sta muovendo <em>verso</em> il lampo anteriore e <em>allontanandosi</em> da quello posteriore: la luce del lampo anteriore ha meno strada da percorrere per raggiungerlo, quella del lampo posteriore ne ha di più. Risultato: \\(M\'\) vede il lampo anteriore <strong>prima</strong> di quello posteriore — per lui, i due eventi <em>non</em> sono simultanei.</p></div>' +
    '<div class="cb warn"><div class="cb-label">Non è un\'illusione ottica</div><p>Questo non è un semplice "ritardo apparente" dovuto al tempo di percorrenza della luce, correggibile con un calcolo — è una conclusione più profonda: <strong>la simultaneità di due eventi dipende dallo stato di moto dell\'osservatore</strong>. Non esiste un "adesso" universale, condiviso da tutti gli osservatori dell\'universo, come pensava implicitamente Newton. Ogni osservatore inerziale ha il proprio, legittimo, giudizio su quali eventi siano simultanei — e osservatori in moto relativo tra loro, in generale, non sono d\'accordo.</p></div>' +
    '<p>Questa scoperta, di per sé, potrebbe già bastare per una lezione intera. Ma è solo l\'inizio: se la simultaneità è relativa, anche la misura del <strong>tempo trascorso</strong> tra due eventi e la misura delle <strong>lunghezze</strong> nello spazio devono, per coerenza, dipendere dall\'osservatore. Sono le prossime due schede.</p>' +
    acc([
      { t:"Domanda concettuale — chi ha ragione?", h:'<p>Nell\'esperimento del treno, chi ha "ragione" sulla simultaneità dei due fulmini: l\'osservatore a terra o quello sul treno? <em>Traccia</em>: nessuno dei due sbaglia. Entrambi applicano correttamente gli stessi due postulati al proprio sistema di riferimento; la simultaneità stessa, semplicemente, non è una proprietà assoluta degli eventi, ma dipende da chi la misura.</p>' },
      { t:"Per chi vuole andare oltre il programma", h:'<p>Prova a ricostruire, con parole tue, perché nell\'esperimento del treno la conclusione dipenderebbe in modo cruciale dal fatto che la velocità della luce sia la stessa per entrambi gli osservatori (secondo postulato) — cosa cambierebbe, nel ragionamento, se le velocità si sommassero "alla Newton"?</p>' }
    ])
},

{
  part:"Parte II — Dilatazione, contrazione, trasformazioni",
  tag:"L'OROLOGIO CHE RALLENTA",
  title:"La dilatazione dei <em>tempi</em>",
  nav:"Dilatazione tempi",
  body:
    '<p>Se la simultaneità è relativa, anche la durata di un intervallo di tempo tra due eventi deve dipendere dall\'osservatore. La conseguenza — verificata sperimentalmente innumerevoli volte — è tanto sorprendente quanto ben definita quantitativamente.</p>' +
    '<div class="cb"><div class="cb-label">Tempo proprio</div><p>Si chiama <strong>tempo proprio</strong> \\(\\Delta t_0\\) l\'intervallo di tempo tra due eventi misurato da un osservatore per cui i due eventi accadono <em>nello stesso punto dello spazio</em> (per esempio, il tempo segnato da un orologio che porti con sé, senza bisogno di confrontarlo con un altro orologio lontano).</p></div>' +
    '<div class="cb tip"><div class="cb-label">Dilatazione dei tempi</div><p>Un osservatore rispetto a cui quell\'orologio si muove con velocità \\(v\\) misura, per lo stesso intervallo, un tempo <strong>più lungo</strong>:</p><div class="math-block hero-formula">\\[ \\Delta t = \\gamma\\,\\Delta t_0 \\qquad \\text{con}\\quad \\gamma = \\frac{1}{\\sqrt{1-v^2/c^2}} \\]</div><p>Il fattore \\(\\gamma\\) (detto <strong>fattore di Lorentz</strong>) è sempre \\(\\geq 1\\), e cresce rapidamente man mano che \\(v\\) si avvicina a \\(c\\): per velocità ordinarie (auto, aerei) \\(\\gamma\\) è indistinguibile da \\(1\\), ma per velocità prossime a \\(c\\) diverge verso l\'infinito.</p></div>' +
    '<div class="cb warn"><div class="cb-label">Non è un difetto dell\'orologio</div><p>Non si tratta di un orologio che "funziona male" per effetto del moto: ogni fenomeno fisico — il battito cardiaco, il decadimento radioattivo, l\'invecchiamento biologico — rallenta allo stesso modo, visto da un osservatore rispetto a cui l\'oggetto si muove. È il <strong>tempo stesso</strong>, per quell\'osservatore, a scorrere più lentamente per l\'oggetto in moto — non un difetto meccanico di un singolo strumento di misura.</p></div>' +
    '<img src="orologio-luce.png" alt="Orologio a luce: un fotone rimbalza tra due specchi, visto da un osservatore a bordo e da uno a terra rispetto a cui l\'orologio si muove" style="width:100%;height:auto;display:block;margin:1.5rem 0;">' +
    '<div class="cb tip"><div class="cb-label">Un modo semplice per "vedere" perché accade — l\'orologio a luce</div><p>Immagina un orologio fatto da un fotone che rimbalza avanti e indietro tra due specchi paralleli, a distanza \\(d\\): ogni "tic" corrisponde a un rimbalzo. Per un osservatore a bordo, il fotone percorre semplicemente \\(2d\\) ad ogni tic. Per un osservatore rispetto a cui l\'orologio si muove lateralmente, il fotone deve percorrere un tragitto <em>a zig-zag</em>, più lungo di \\(2d\\) — ma la sua velocità resta \\(c\\) per entrambi gli osservatori (secondo postulato!). Un percorso più lungo, alla stessa velocità, richiede più tempo: è esattamente la dilatazione dei tempi, ricavata qui con un semplice teorema di Pitagora invece che con le trasformazioni di Lorentz complete.</p></div>' +
    '<div class="cb success"><div class="cb-label">Una conferma già "in natura" — i muoni cosmici</div><p>I muoni sono particelle instabili, prodotte in alta atmosfera (a circa \\(15\\) km di quota) dall\'impatto dei raggi cosmici, con un tempo di vita medio proprio di soli \\(\\tau_0\\approx2{,}2\\ \\mu\\)s e velocità tipiche attorno a \\(v\\approx0{,}98\\,c\\). Senza dilatazione dei tempi, nella loro breve vita percorrerebbero in media meno di un chilometro — troppo poco per raggiungere la superficie terrestre in quantità apprezzabile. Ma calcolando \\(\\gamma\\approx5\\) per questa velocità, il loro tempo di vita <em>misurato da un osservatore a terra</em> si dilata a circa \\(11\\ \\mu\\)s, sufficiente a percorrere oltre \\(3\\) km — ed è esattamente per questo che i rivelatori di muoni a livello del mare ne registrano un numero enorme ogni giorno.</p></div>' +
    acc([
      { t:"Esercizio — dilatazione dei tempi", h:'<p>Un\'astronave viaggia a \\(v=0{,}8\\,c\\) rispetto alla Terra. Per un osservatore a terra passano \\(\\Delta t=10\\) s. Quanto tempo proprio \\(\\Delta t_0\\) è trascorso, nello stesso intervallo, per un orologio a bordo dell\'astronave? <em>Traccia</em>: \\(\\gamma=1/\\sqrt{1-0{,}64}=1/\\sqrt{0{,}36}=1/0{,}6\\approx1{,}667\\); da \\(\\Delta t=\\gamma\\Delta t_0\\) si ricava \\(\\Delta t_0=\\Delta t/\\gamma=10\\cdot0{,}6=6\\) s.</p>' },
      { t:"Domanda concettuale — chi invecchia di meno?", h:'<p>Se tu resti sulla Terra e un gemello parte su un\'astronave a velocità prossima a \\(c\\), tornando poi indietro, chi dei due sarà più giovane al ritrovo? <em>Traccia</em>: è il celebre "paradosso dei gemelli" — il gemello che viaggia (che deve accelerare per invertire la rotta, uscendo quindi dal caso puramente inerziale trattato in questa lezione) risulta più giovane al ritorno. Non è un vero paradosso logico, ma richiede di considerare con attenzione l\'asimmetria tra i due gemelli.</p>' }

{

  nav:"Trasformazioni",
  body:
    '<p>Dilatazione dei tempi e contrazione delle lunghezze sono casi particolari di una trasformazione più generale, che sostituisce le vecchie <strong>trasformazioni di Galileo</strong> della meccanica classica (dove semplicemente \\(x\'=x-vt\\) e \\(t\'=t\\), col tempo considerato universale) con una versione compatibile con i due postulati di Einstein.</p>' +
    '<div class="cb"><div class="cb-label">Le trasformazioni di Lorentz</div><p>Per un sistema \\(S\'\\) che si muove con velocità \\(v\\) lungo l\'asse \\(x\\) rispetto a un sistema \\(S\\), le coordinate di uno stesso evento nei due sistemi sono legate da:</p><div class="math-block hero-formula">\\[ x\' = \\gamma\\,(x - v t) \\qquad\\qquad t\' = \\gamma\\left(t - \\frac{v x}{c^2}\\right) \\]</div><p>Non si tratta di formule da imparare a memoria in questa sede, ma della struttura da cui, con un po\' di algebra, discendono sia la dilatazione dei tempi sia la contrazione delle lunghezze viste nelle due schede precedenti — sono conseguenze matematiche di queste trasformazioni, non ipotesi indipendenti aggiunte a mano.</p></div>' +
    '<div class="cb tip"><div class="cb-label">Un dettaglio da non perdere — il tempo compare nello spazio</div><p>Guarda la seconda equazione: la coordinata temporale \\(t\'\\) dipende anche dalla posizione spaziale \\(x\\) del sistema \\(S\\). Questo formalizza esattamente la relatività della simultaneità: due eventi con lo stesso \\(t\\) ma \\(x\\) diverso (simultanei in \\(S\\)) in generale <em>non</em> hanno lo stesso \\(t\'\\) — non sono simultanei in \\(S\'\\).</p></div>' +
    '<div class="cb purple"><div class="cb-label">Composizione relativistica delle velocità</div><p>Dalle trasformazioni di Lorentz discende anche una nuova regola per sommare le velocità, che sostituisce la semplice addizione newtoniana. Se un oggetto si muove con velocità \\(u\'\\) rispetto a un sistema \\(S\'\\), che a sua volta si muove con velocità \\(v\\) rispetto a \\(S\\), la velocità dell\'oggetto misurata in \\(S\\) è:</p><div class="math-block hero-formula">\\[ u = \\frac{u\' + v}{1 + \\dfrac{u\'v}{c^2}} \\]</div><p>Per velocità piccole rispetto a \\(c\\), il termine \\(u\'v/c^2\\) al denominatore è trascurabile, e si ritrova l\'approssimazione familiare \\(u\\approx u\'+v\\). Ma questa formula garantisce anche, matematicamente, che sommando due velocità mai superiori a \\(c\\) non si può <strong>mai</strong> ottenere un risultato superiore a \\(c\\) — un limite di velocità incorporato nella struttura stessa dello spaziotempo, non imposto "a mano".</p></div>' +

      { t:"Domanda concettuale — il limite incorporato", h:'<p>Perché, guardando la formula di composizione delle velocità, non è mai possibile ottenere \\(u>c\\) partendo da \\(u\'\\lt c\\) e \\(v\\lt c\\)? <em>Traccia</em>: prova a immaginare cosa succederebbe al denominatore se sia \\(u\'\\) sia \\(v\\) si avvicinassero a \\(c\\) — il denominatore cresce proprio nella giusta misura per "frenare" la somma e mantenerla sotto \\(c\\).</p>' }
    ])

{

  body:
    '<p>Anche una grandezza fondamentale come la quantità di moto deve essere ridefinita in ambito relativistico, perché la sua vecchia forma newtoniana \\(p=mv\\) non si conserva più correttamente negli urti, una volta applicate le trasformazioni di Lorentz.</p>' +

    '<div class="cb"><div class="cb-label">Energia a riposo</div><p>Anche un corpo <strong>fermo</strong>, con massa a riposo \\(m\\), possiede un\'energia intrinseca, legata alla sua massa stessa:</p><div class="math-block hero-formula">\\[ E_0 = m\\,c^2 \\]</div><p>Massa ed energia non sono più due grandezze conservate separatamente, come nella fisica classica: sono due aspetti della <strong>stessa</strong> grandezza fisica, convertibili l\'una nell\'altra. Data l\'enormità del fattore \\(c^2\\approx9\\times10^{16}\\ \\text{m}^2/\\text{s}^2\\), anche una quantità piccolissima di massa corrisponde a una quantità enorme di energia.</p></div>' +
    '<div class="cb tip"><div class="cb-label">Energia totale ed energia cinetica</div><p>Per un corpo in moto a velocità \\(v\\), l\'energia totale (a riposo più cinetica) vale:</p><div class="math-block hero-formula">\\[ E = \\gamma\\,m\\,c^2 \\]</div><p>e l\'energia cinetica relativistica è la differenza tra l\'energia totale e quella a riposo:</p><div class="math-block hero-formula">\\[ K = E - E_0 = (\\gamma - 1)\\,m\\,c^2 \\]</div><p>Per velocità piccole rispetto a \\(c\\), sviluppando \\(\\gamma\\) in serie, questa espressione si riduce con ottima approssimazione alla familiare formula newtoniana \\(K\\approx\\frac12 mv^2\\) — la relatività non "cancella" la meccanica classica, la contiene come caso limite a basse velocità.</p></div>' +

  ).join('');
  document.getElementById('app').innerHTML = html;
  document.querySelectorAll('.acc-item').forEach(el => el.classList.add('open'));
  if (typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([document.getElementById('app')]);
  }
  document.body.style.opacity = '1';
}

if (new URLSearchParams(location.search).get('print') === '1') {
  renderAll();
} else {
  render();
}
</script>
</body>
</html>
