<div class="topbar">

<script>
function acc(items) {
  return '<div class="accordion">' + items.map((it, i) =>
    '<div class="acc-item">' +
      '<div class="acc-header" onclick="toggleAcc(this)">' +
        '<div class="acc-num">' + (i + 1) + '</div>' +
        '<div class="acc-title">' + it.t + '</div>' +
        '<svg class="acc-arrow" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
      '</div>' +
      '<div class="acc-body"><div class="acc-inner">' + it.h + '</div></div>' +
    '</div>'
  ).join('') + '</div>';
}

function toggleAcc(el) {
  const item = el.parentElement;
  item.classList.toggle('open');
  if (item.classList.contains('open') && typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([item]);
  }
}

function plotFn(opts) {
  const W = opts.w || 320, H = opts.h || 320;
  const xmin = opts.xmin, xmax = opts.xmax, ymin = opts.ymin, ymax = opts.ymax;
  const sx = x => (x - xmin) / (xmax - xmin) * W;
  const sy = y => H - (y - ymin) / (ymax - ymin) * H;
  let g = '';

  (opts.grid || []).forEach(v => {
    const x = sx(v);
    if (x >= 0 && x <= W) g += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + H + '" stroke="var(--border-light)" stroke-width="1"/>';
  });
  (opts.gridY || []).forEach(v => {
    const y = sy(v);
    if (y >= 0 && y <= H) g += '<line x1="0" y1="' + y + '" x2="' + W + '" y2="' + y + '" stroke="var(--border-light)" stroke-width="1"/>';
  });

  (opts.asymptotes || []).forEach(a => {
    if (a.type === 'h') {
      const y = sy(a.at);
      g += '<line x1="0" y1="' + y + '" x2="' + W + '" y2="' + y + '" stroke="' + (a.color || '#b8860b') + '" stroke-width="1.3" stroke-dasharray="5 4"/>';
    } else if (a.type === 'o') {
      const x1 = xmin, x2 = xmax;
      const y1 = a.m * x1 + a.q, y2 = a.m * x2 + a.q;
      g += '<line x1="' + sx(x1) + '" y1="' + sy(y1) + '" x2="' + sx(x2) + '" y2="' + sy(y2) + '" stroke="' + (a.color || '#b8860b') + '" stroke-width="1.3" stroke-dasharray="5 4"/>';
    } else {
      const x = sx(a.at);
      g += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + H + '" stroke="' + (a.color || '#b8860b') + '" stroke-width="1.3" stroke-dasharray="5 4"/>';
    }
  });

  const x0 = sx(0), y0 = sy(0);
  if (x0 >= 0 && x0 <= W) g += '<line x1="' + x0 + '" y1="0" x2="' + x0 + '" y2="' + H + '" stroke="var(--text-dim)" stroke-width="1.2"/>';
  if (y0 >= 0 && y0 <= H) g += '<line x1="0" y1="' + y0 + '" x2="' + W + '" y2="' + y0 + '" stroke="var(--text-dim)" stroke-width="1.2"/>';

  (opts.fns || []).forEach(fn => {
    const N = 300;
    let d = '', started = false;
    for (let i = 0; i <= N; i++) {
      const x = xmin + (xmax - xmin) * i / N;
      if (fn.exclude && Math.abs(x - fn.exclude) < (xmax - xmin) / N * 1.5) { started = false; continue; }
      let y;
      try { y = fn.f(x); } catch (e) { y = NaN; }
      if (!isFinite(y) || y < ymin - (ymax - ymin) * 0.6 || y > ymax + (ymax - ymin) * 0.6) {
        started = false;
        continue;
      }
      const X = sx(x), Y = sy(y);
      d += (started ? 'L' : 'M') + X.toFixed(1) + ' ' + Y.toFixed(1) + ' ';
      started = true;
    }
    g += '<path d="' + d + '" fill="none" stroke="' + fn.color + '" stroke-width="2.2" stroke-linecap="round"/>';
  });

  (opts.points || []).forEach(p => {
    const X = sx(p.x), Y = sy(p.y);
    g += '<circle cx="' + X + '" cy="' + Y + '" r="' + (p.r || 3.2) + '" fill="' + (p.color || 'var(--accent)') + '"/>';
    if (p.label) g += '<text x="' + (X + 6) + '" y="' + (Y - 6) + '" font-family="JetBrains Mono, monospace" font-size="11" fill="var(--text)">' + p.label + '</text>';
  });

  return '<div class="graph-wrap' + (opts.wide ? ' wide' : '') + '"><svg viewBox="0 0 ' + W + ' ' + H + '">' + g + '</svg>' +
    (opts.caption ? '<div class="graph-caption">' + opts.caption + '</div>' : '') +
    (opts.legend ? '<div class="legend">' + opts.legend.map(l => '<span><i style="background:' + l.color + '"></i>' + l.label + '</span>').join('') + '</div>' : '') +
    '</div>';
}

const graphVerticale = plotFn({
  xmin: -6, xmax: 6, ymin: -8, ymax: 8, w: 320, h: 320,
  grid: [-6,-4,-2,0,2,4,6], gridY: [-8,-4,0,4,8],
  asymptotes: [{ type: 'v', at: 1, color: '#c2185b' }, { type: 'h', at: 2, color: '#b8860b' }],
  fns: [{ f: x => (2*x)/(x-1), color: '#3a6b8c', exclude: 1 }],
  caption: "f(x) = 2x/(x-1): asintoto verticale x=1, asintoto orizzontale y=2.",
  legend: [{ color: '#3a6b8c', label: 'y = 2x/(x-1)' }, { color: '#c2185b', label: 'asintoto verticale x=1' }, { color: '#b8860b', label: 'asintoto orizzontale y=2' }]
});

const graphObliquo = plotFn({
  xmin: -6, xmax: 8, ymin: -8, ymax: 10, w: 320, h: 320,
  grid: [-6,-4,-2,0,2,4,6,8], gridY: [-8,-4,0,4,8],
  asymptotes: [{ type: 'v', at: 2, color: '#c2185b' }, { type: 'o', m: 1, q: 2, color: '#b8860b' }],
  fns: [{ f: x => (x*x - 1)/(x-2), color: '#4a7c59', exclude: 2 }],
  points: [{ x: -1, y: 0, label: '(-1,0)' }, { x: 1, y: 0, label: '(1,0)' }, { x: 0, y: 0.5, label: '(0,1/2)' }],
  caption: "f(x) = (x²-1)/(x-2): asintoto verticale x=2, asintoto obliquo y=x+2.",
  legend: [{ color: '#4a7c59', label: 'y = (x²-1)/(x-2)' }, { color: '#c2185b', label: 'x=2' }, { color: '#b8860b', label: 'y=x+2' }]
});

const S = [
{
  tag:"IL TASSELLO MANCANTE",
  title:"Dal <em>grafico probabile</em> al grafico <em>rigoroso</em>",
  nav:"Obiettivo",
  body:
    '<p>Nella lezione precedente abbiamo imparato a costruire il <strong>grafico probabile</strong> di una funzione: dominio, simmetrie, intersezioni con gli assi, segno. Con questi ingredienti si arriva a un disegno plausibile, ma con due domande lasciate aperte apposta.</p>' +
    '<div class="cb warn"><div class="cb-label">Le due domande in sospeso</div><ul><li>Cosa succede al grafico <strong>vicino ai punti esclusi dal dominio</strong> (per esempio, dove si annulla un denominatore)? Sale all\'infinito? Scende? Da che parte?</li><li>Cosa succede al grafico quando \\(x\\) diventa <strong>molto grande</strong>, in positivo o in negativo? La curva si stabilizza, cresce per sempre, o si avvicina a una retta?</li></ul></div>' +
    '<p>Entrambe le domande hanno la stessa risposta tecnica: bisogna calcolare un <strong>limite</strong>. Questa lezione è un ripasso completo, guidato da esempi numerici, di tutto il percorso: dall\'equazione al grafico, includendo finalmente anche i limiti.</p>' +
    '<h3>Il percorso completo, in otto tappe</h3>' +
    '<ol><li><strong>Ripasso dei punti principali</strong> — i quattro passi già noti, in sintesi veloce;</li><li><strong>Dominio</strong> — dove la funzione esiste;</li><li><strong>Intersezioni con gli assi</strong> — i primi punti esatti del grafico;</li><li><strong>Simmetrie</strong> — quando conviene disegnare solo metà curva;</li><li><strong>Segno</strong> — dove il grafico sta sopra o sotto l\'asse;</li><li><strong>Limiti</strong> — cosa succede ai bordi del dominio e all\'infinito;</li><li><strong>Resoconto finale</strong> — lo studio completo, con il grafico.</li></ol>' +
    '<div class="cb tip"><div class="cb-label">Perché questa lezione fa la differenza</div><p>Il grafico probabile ti dice <em>dove</em> la curva sta sopra o sotto l\'asse. Il grafico completo ti dice anche <em>come</em> ci arriva e <em>come</em> se ne va. È l\'ultimo tassello prima dello studio di funzione "vero", quello che affronterai fino alla maturità.</p></div>'
},
{
  tag:"1 · RIPASSO",
  title:"I punti principali, <em>in sintesi</em>",
  nav:"Ripasso",
  body:
    '<p>Prima di riprendere ogni passo nel dettaglio, un rapido promemoria di cosa abbiamo già imparato nella lezione precedente — così sappiamo sempre a che punto siamo del percorso.</p>' +
    '<div class="cb"><div class="cb-label">Esempio guida di tutta la lezione</div><p>Lavoreremo su \\(f(x) = \\dfrac{2x}{x-1}\\): una funzione razionale fratta, scelta apposta perché semplice da seguire in ogni passaggio.</p></div>' +
    '<table class="ct"><tr><th>Passo</th><th>Cosa fa</th></tr>' +
    '<tr><td>Dominio</td><td>trova dove la funzione esiste</td></tr>' +
    '<tr><td>Intersezioni</td><td>trova i punti esatti in cui il grafico attraversa gli assi</td></tr>' +
    '<tr><td>Simmetrie</td><td>controlla se il grafico è a specchio (asse \\(y\\) o origine)</td></tr>' +
    '<tr><td>Segno</td><td>stabilisce dove il grafico sta sopra o sotto l\'asse \\(x\\)</td></tr>' +
    '<tr><td>Limiti</td><td>precisano cosa succede ai bordi del dominio e all\'infinito</td></tr></table>' +
    '<div class="cb success"><div class="cb-label">Il piano di lavoro</div><p>Nelle prossime sezioni riprendiamo ciascun passo, uno alla volta, applicandolo sempre allo stesso esempio guida — così a fine lezione avrai visto l\'intero percorso, dall\'equazione al grafico completo, su un caso solo.</p></div>'
},
{
  tag:"2 · DOMINIO",
  title:"Il <em>dominio</em>: dove la funzione esiste",
  nav:"Dominio",
  body:
    '<p>Il dominio è sempre il primo passo: se non sappiamo dove la funzione vive, non possiamo dire nient\'altro su di lei.</p>' +
    '<p>Per \\(f(x) = \\dfrac{2x}{x-1}\\), la condizione è che il denominatore non si annulli:</p>' +
    '\\[ x - 1 \\neq 0 \\quad \\Rightarrow \\quad D = \\mathbb{R}\\setminus\\{1\\} \\]' +
    '<div class="cb success"><div class="cb-label">Cosa significa per il grafico</div><p>In \\(x=1\\) il grafico non può esistere: è un punto "di confine" che terremo d\'occhio più avanti, quando arriveremo ai limiti.</p></div>' +
    acc([
      { t:"Ripasso lampo — le tre condizioni classiche", h:'<table class="ct"><tr><th>Tipo di funzione</th><th>Condizione</th></tr><tr><td>Razionale intera (polinomio)</td><td>nessuna condizione — dominio \\(\\mathbb{R}\\)</td></tr><tr><td>Razionale fratta</td><td>denominatore \\(\\neq 0\\)</td></tr><tr><td>Irrazionale, indice pari</td><td>radicando \\(\\geq 0\\)</td></tr></table><p class="dim">Se compaiono più condizioni insieme, il dominio è la loro intersezione.</p>' }
    ])
},
{
  tag:"3 · INTERSEZIONI",
  title:"<em>Intersezioni</em> con gli assi",
  nav:"Intersezioni",
  body:
    '<p>Le intersezioni con gli assi sono i primi punti <strong>certi</strong> del grafico: coordinate esatte, non approssimazioni.</p>' +
    '<div class="cb"><div class="cb-label">Con l\'asse y</div><p>Si pone \\(x=0\\) (se appartiene al dominio) e si calcola \\(f(0)\\).</p></div>' +
    '<div class="cb tip"><div class="cb-label">Con l\'asse x</div><p>Si risolve \\(f(x)=0\\): per una frazione, basta annullare il numeratore (con il denominatore diverso da zero).</p></div>' +
    '<p>Per il nostro esempio \\(f(x) = \\dfrac{2x}{x-1}\\):</p>' +
    '\\[ f(0) = \\frac{0}{-1} = 0 \\ \\Rightarrow \\ (0,0), \\qquad 2x = 0 \\ \\Rightarrow \\ x=0 \\ \\Rightarrow \\ (0,0) \\]' +
    '<div class="cb success"><div class="cb-label">Un solo punto, due ragioni</div><p>Qui asse \\(x\\) e asse \\(y\\) si incontrano nello stesso punto, l\'origine: capita quando \\(f(0)=0\\). È del tutto normale, e va semplicemente registrato.</p></div>'
},
{
  tag:"4 · SIMMETRIE",
  title:"<em>Simmetrie</em>: funzioni pari e dispari",
  nav:"Simmetrie",
  body:
    '<p>Un controllo veloce che, quando dà esito positivo, dimezza il lavoro: basta guardare il segno di \\(f(-x)\\).</p>' +
    '<div class="cb"><div class="cb-label">Funzione pari</div><p>Se \\(f(-x) = f(x)\\), il grafico è simmetrico rispetto all\'asse \\(y\\).</p></div>' +
    '<div class="cb tip"><div class="cb-label">Funzione dispari</div><p>Se \\(f(-x) = -f(x)\\), il grafico è simmetrico rispetto all\'origine.</p></div>' +
    '<p>Verifichiamo sul nostro esempio, \\(f(x) = \\dfrac{2x}{x-1}\\):</p>' +
    '\\[ f(-x) = \\frac{-2x}{-x-1} = \\frac{2x}{x+1} \\]' +
    '<p>Questo risultato non è uguale né a \\(f(x)\\) né a \\(-f(x)\\): la funzione non è né pari né dispari, e si prosegue senza questa scorciatoia.</p>' +
    '<div class="cb warn"><div class="cb-label">Il caso più comune</div><p>La maggior parte delle funzioni razionali fratte non è simmetrica: niente panico, è la situazione più frequente. Il test si fa comunque, perché quando la simmetria c\'è, conviene sempre sfruttarla.</p></div>'
},
{
  tag:"5 · SEGNO",
  title:"Lo studio del <em>segno</em>",
  nav:"Segno",
  body:
    '<p>Sapere dove il grafico sta sopra l\'asse \\(x\\) (funzione positiva) e dove sta sotto (negativa) restringe molto le forme possibili del grafico.</p>' +
    '<p>Per \\(f(x) = \\dfrac{2x}{x-1}\\): numeratore \\(2x&gt;0\\) per \\(x&gt;0\\); denominatore \\(x-1&gt;0\\) per \\(x&gt;1\\).</p>' +

    acc([
      { t:"Regola pratica per i limiti all\'infinito", h:'<p>Per una funzione razionale fratta \\(N(x)/D(x)\\), il limite per \\(x \\to \\pm\\infty\\) dipende solo dal grado dei due polinomi:</p><table class="ct"><tr><th>Confronto gradi</th><th>Limite</th><th>Conseguenza</th></tr><tr><td>grado(N) &lt; grado(D)</td><td>\\(0\\)</td><td>asintoto orizzontale \\(y=0\\)</td></tr><tr><td>grado(N) = grado(D)</td><td>rapporto dei coefficienti direttori</td><td>asintoto orizzontale \\(y=\\ell\\neq0\\)</td></tr><tr><td>grado(N) = grado(D)+1</td><td>\\(\\pm\\infty\\), ma "in modo ordinato"</td><td>asintoto <strong>obliquo</strong> \\(y=mx+q\\)</td></tr><tr><td>grado(N) &gt; grado(D)+1</td><td>\\(\\pm\\infty\\)</td><td>nessun asintoto</td></tr></table><p class="dim">Nel nostro esempio grado(N)=grado(D)=1: il limite è il rapporto dei coefficienti, \\(2/1=2\\) — esattamente quanto trovato sopra.</p>' },

let currentIdx = 0;

function render() {
  const s = S[currentIdx];
  const html = '<div class="hero">' +
    '<div class="hero-tag">' + s.tag + '</div>' +
    '<h1>' + s.title + '</h1></div>' +
    '<div class="section-body">' + s.body + '</div>' +
    '<div class="bottom-nav">' +
    '<button class="bb" onclick="prev()" ' + (currentIdx === 0 ? 'disabled' : '') + '>← Indietro</button>' +
    '<div class="page-info">' + (currentIdx + 1) + ' / ' + S.length + '</div>' +
    '<button class="bb" onclick="next()" ' + (currentIdx === S.length - 1 ? 'disabled' : '') + '>Avanti →</button>' +
    '</div>';

  document.getElementById('app').innerHTML = html;

  const pills = S.map((s, i) =>
    '<button class="nav-pill ' + (i === currentIdx ? 'active' : '') + '" onclick="go(' + i + ')">' + s.nav + '</button>'
  ).join('');
  document.getElementById('topNav').innerHTML = pills;

  if (typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([document.getElementById('app')]);
  }
  document.body.style.opacity = '1';
}

function prev() { if (currentIdx > 0) { currentIdx--; render(); window.scrollTo(0, 0); } }
function next() { if (currentIdx < S.length - 1) { currentIdx++; render(); window.scrollTo(0, 0); } }
function go(i) { currentIdx = i; render(); window.scrollTo(0, 0); }

render();
</script>
