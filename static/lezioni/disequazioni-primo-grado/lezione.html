<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disequazioni di Primo Grado — Lezione interattiva</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<script>
MathJax = {
  tex: {
    inlineMath: [['\\(','\\)']],
    displayMath: [['\\[','\\]']]
  },
  svg: { fontCache: 'global', scale: 1.05 },
  startup: {
    ready() {
      MathJax.startup.defaultReady();
      MathJax.startup.promise.then(() => { document.body.style.opacity = '1'; });
    }
  }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"></script>
<style>
:root {
  --bg:#faf7f2; --surface:#fff; --surface-alt:#f5f0e8;
  --border:#e4ddd4; --border-light:#ece7de;
  --text:#2c2520; --text-mid:#5a524a; --text-dim:#6e6760;
  --accent:#c2185b; --accent-light:#fce4ec;
  --blue:#3a6b8c; --blue-light:#e8f0f5;
  --green:#4a7c59; --green-light:#eaf5ed;
  --gold:#b8860b;
  --danger:#b33a3a;
}
[data-theme="dark"]{
  --bg:#1a1613; --surface:#241f1a; --surface-alt:#2c2620; --border:#4a4238; --border-light:#3a332c; --text:#f0e9e0; --text-mid:#cbc0b4; --text-dim:#9c9186; --accent:#ed6ea0; --accent-light:#460b1f; --blue:#7fb3d5; --blue-light:#1a2e3a; --green:#8fc9a0; --green-light:#1a2e20; --gold:#e0b34d; --danger:#e57373;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--text);line-height:1.75;font-size:17px;opacity:0;transition:opacity .3s}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--border-light);height:52px;display:flex;align-items:center;padding:0 clamp(16px,4vw,40px);gap:16px}
.topbar-brand{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;color:var(--text);white-space:nowrap;flex-shrink:0}
.topbar-nav{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;flex:1}
.topbar-nav::-webkit-scrollbar{display:none}
.nav-pill{background:none;border:none;font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--text-dim);padding:6px 14px;cursor:pointer;white-space:nowrap;transition:color .2s;border-bottom:2px solid transparent}
.nav-pill:hover{color:var(--text)}
.nav-pill.active{color:var(--accent);font-weight:600;border-bottom:2px solid var(--accent)}
.topbar-home{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--text-dim);text-decoration:none;cursor:pointer;white-space:nowrap;flex-shrink:0}
.topbar-home:hover{color:var(--accent)}

/* LAYOUT */
.container{max-width:780px;margin:0 auto;padding:84px clamp(20px,5vw,48px) 60px}
.section{display:none;animation:appear .4s ease}
.section.active{display:block}
@keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* HERO */
.hero{margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border-light)}
.hero-tag{font-family:'Fira Code',monospace;font-size:.73rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(1.9rem,5vw,2.65rem);font-weight:800;line-height:1.15;margin-bottom:12px}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero-sub{font-size:1.02rem;color:var(--text-mid);line-height:1.7;text-wrap:pretty}

/* CALLOUT */
.cb{background:var(--surface-alt);border-left:2px solid var(--accent);border-radius:0 8px 8px 0;padding:16px 18px;margin:18px 0}
.cb-label{font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-weight:600;color:var(--accent)}
.cb.tip .cb-label{color:var(--blue)}
.cb.warn .cb-label{color:var(--gold)}
.cb.danger .cb-label{color:var(--danger)}
.cb.success .cb-label{color:var(--green)}

/* MATH */
.math-block{background:rgba(0,0,0,.025);padding:12px 16px;margin:10px 0;overflow-x:auto;border-radius:2px}
.math-block.center{text-align:center}
.math-block.result{border-left:2px solid var(--green);background:rgba(74,124,89,.04)}
.math-block.warn{border-left:2px solid var(--danger);background:rgba(179,58,58,.04)}
/* RETTA NUMERICA */
.nl{display:block;width:100%;max-width:620px;height:auto;margin:6px auto;font-family:'JetBrains Mono',monospace}
.nl text{fill:var(--text-mid);font-size:12px}
.nl .nl-lab{fill:var(--text);font-size:13px}
.nl .nl-res{fill:var(--green);font-weight:600}
.nl .nl-tick{fill:var(--text);font-size:12px;font-weight:500}
.nl .nl-axis{stroke:var(--text-dim);stroke-width:1.5}
.nl .nl-guide{stroke:var(--border);stroke-width:1;stroke-dasharray:3 4}
.nl .nl-band{fill:var(--green);opacity:.12}
.nl .nl-bar{stroke:var(--blue);stroke-width:4;stroke-linecap:butt}
.nl .nl-bar.res{stroke:var(--green)}
.nl .nl-arr{fill:var(--blue)}
.nl .nl-arr.res{fill:var(--green)}
.nl .nl-dot{stroke:var(--blue);stroke-width:2.5;fill:var(--blue)}
.nl .nl-dot.open{fill:var(--surface)}
.nl .nl-dot.res{stroke:var(--green);fill:var(--green)}
.nl .nl-dot.res.open{fill:var(--surface)}
.nl-wrap{background:rgba(0,0,0,.025);padding:10px 8px;margin:10px 0;border-radius:2px}
.nl .sg-line{stroke-width:4;stroke-linecap:butt}
.nl .sg-line.pos{stroke:var(--blue)}
.nl .sg-line.neg{stroke:var(--text-dim);stroke-dasharray:6 5;stroke-width:2.5}
.nl .sg-sign{font-size:20px;font-weight:700;paint-order:stroke;stroke:var(--bg);stroke-width:5px}
.nl .sg-sign.p{fill:var(--blue)}
.nl .sg-sign.m{fill:var(--danger)}
.nl .sg-sign.z{font-size:12px;fill:var(--text-mid);font-weight:500}
/* BOTTONI */
.btn-ghost{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:500;letter-spacing:.3px;padding:7px 16px;border:1px solid var(--border);color:var(--text);background:transparent;border-radius:6px;text-decoration:none;transition:border-color .2s,color .2s,background .2s}
.btn-ghost span{display:inline-block;transition:transform .2s}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.btn-ghost:hover span{transform:translateY(2px)}
.doc-links{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 6px}
.cb.plain{border-left-color:var(--border)}
.cb.plain .cb-label{color:var(--text-dim)}
mjx-container[jax="SVG"]{direction:ltr}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}

/* ACCORDION */
.accordion{margin:16px 0}
.acc-item{border-bottom:1px solid rgba(0,0,0,.08)}
.acc-item:last-child{border-bottom:none}
.acc-header{display:flex;align-items:center;gap:12px;padding:14px 0;cursor:pointer;user-select:none;background:none;border:none;width:100%;text-align:left}
.acc-num{width:24px;height:24px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.7rem;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.acc-title{font-weight:600;font-size:.93rem;flex:1;color:var(--text);font-family:Georgia,serif;text-align:left;line-height:1.4}
.acc-arrow{width:16px;height:16px;color:var(--text-dim);transition:transform .3s;flex-shrink:0}
.acc-item.open .acc-arrow{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.acc-item.open .acc-body{max-height:9000px}
.acc-inner{padding:8px 0 18px 36px}

/* TABLE */
.ct{width:100%;border-collapse:collapse;margin:14px 0;font-size:.88rem}
.ct th{text-align:left;padding:10px 14px;font-weight:600;color:var(--accent);border-bottom:1px solid var(--border-light);font-size:.74rem;letter-spacing:.5px;text-transform:uppercase;font-family:'Fira Code',monospace}
.ct td{padding:9px 14px;border-bottom:1px solid var(--border-light);vertical-align:top;line-height:1.65}
.ct tr:last-child td{border-bottom:none}

/* BOTTOM NAV */
.bottom-nav{display:flex;justify-content:space-between;align-items:center;margin-top:44px;padding-top:20px;border-top:1px solid var(--border-light)}
.bb{font-family:'JetBrains Mono',monospace;font-size:.85rem;padding:0;border:none;background:none;color:var(--text);transition:all .2s;cursor:pointer}
.bb:hover{color:var(--accent);text-decoration:underline}
.bb:disabled{opacity:.35;cursor:not-allowed}
.bb:disabled:hover{color:var(--text);text-decoration:none}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border);transition:all .3s;cursor:pointer;border:none;padding:0;flex-shrink:0}
.dot.active{background:var(--accent);width:20px;border-radius:4px}

/* TYPOGRAPHY */
p{margin:6px 0}
ul,ol{margin:8px 0 8px 24px}
li{margin:3px 0;line-height:1.7}
strong{font-weight:700}
.dim{color:var(--text-dim)}
h2{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;margin:26px 0 10px;color:var(--text)}
h3{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:600;margin:18px 0 8px;color:var(--text)}

/* RESPONSIVE */
@media(max-width:640px){
  body{font-size:15.5px}
  .hero h1{font-size:1.65rem}
  .cb{padding:14px 14px}
  .container{padding:80px 18px 60px}
  .topbar-brand{font-size:.9rem}
  .acc-inner{padding:8px 0 16px 24px}
  .acc-title{font-size:.88rem}
  .ct{font-size:.82rem}
  .ct th,.ct td{padding:8px 10px}
}

.mot-theme-toggle{
  position:fixed;top:6px;right:clamp(6px,1.5vw,18px);z-index:400;
  width:40px;height:40px;padding:0;border:0;background:transparent;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);transition:color .2s,transform .2s;
}
.mot-theme-toggle:hover{color:var(--accent);transform:scale(1.1)}
.mot-theme-toggle svg{width:22px;height:22px}
body .topbar{padding-right:calc(clamp(6px,1.5vw,18px) + 44px)}
@media print{.mot-theme-toggle{display:none}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">Disequazioni · 1° grado</div>
  <div class="topbar-nav" id="topNav"></div>
  <a href="/" class="topbar-home">← home</a>
</div>
<div class="container" id="app"></div>

<script>

/* ═══════════════ ACCORDION ═══════════════ */
function acc(items) {
  return '<div class="accordion">' + items.map((it, i) => `
    <div class="acc-item">
      <button class="acc-header" onclick="toggleAcc(this)">
        <div class="acc-num">${i + 1}</div>
        <div class="acc-title">${it.t}</div>
        <svg class="acc-arrow" viewBox="0 0 20 20" fill="none">
          <path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="acc-body"><div class="acc-inner">${it.h}</div></div>
    </div>`).join('') + '</div>';
}

function toggleAcc(el) {
  const item = el.closest('.acc-item');
  item.classList.toggle('open');
  if (item.classList.contains('open') && typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([item]);
  }
}

/* ═══════════════ RETTA NUMERICA (SVG) ═══════════════ */
/* Condizione: ['<',5]  oppure  {l:'x² − 4 ≤ 0', iv:'[-2,2]'}  (unioni: '(-inf,-3)u(1,inf)')
   nl([['<',5],['>=',-2]])            -> condizioni + intersezione
   nl([['>',-1],['<=',5]],{solo:1})   -> solo l'intervallo soluzione */
function iv(str) {
  return str.split('u').map(t => {
    const [a, b] = t.slice(1, -1).split(',').map(x => x.trim());
    return { a: a === '-inf' ? -Infinity : +a, ai: t[0] === '[',
             b: b === 'inf' ? Infinity : +b, bi: t.slice(-1) === ']' };
  });
}
function nl(conds, opt = {}) {
  const f = v => String(v).replace('-', '\u2212');
  const sym = {'<':'<','<=':'\u2264','>':'>','>=':'\u2265'};
  const vars = opt.v || 'x';
  const rows = conds.map(c => Array.isArray(c)
    ? { l: `${vars} ${sym[c[0]]} ${f(c[1])}`,
        runs: [c[0][0] === '>' ? { a: c[1], ai: c[0].length === 2, b: Infinity, bi: false }
                               : { a: -Infinity, ai: false, b: c[1], bi: c[0].length === 2 }] }
    : { l: c.l, runs: iv(c.iv) });
  const vals = [...new Set(rows.flatMap(r => r.runs.flatMap(u => [u.a, u.b]))
    .filter(isFinite))].sort((a, b) => a - b);
  const span = vals.length > 1 ? vals[vals.length - 1] - vals[0] : 2;
  const pad = Math.max(span * 0.4, 1), lo = vals[0] - pad, hi = vals[vals.length - 1] + pad;
  const X0 = 150, X1 = 548, W = 580, RH = 36;
  const px = v => X0 + (v - lo) / (hi - lo) * (X1 - X0);
  // intersezione di insiemi di intervalli
  const meet = (A, B) => A.flatMap(r => B.flatMap(s => {
    let a = r.a, ai = r.ai, b = r.b, bi = r.bi;
    if (s.a > a) { a = s.a; ai = s.ai; } else if (s.a === a) ai = ai && s.ai;
    if (s.b < b) { b = s.b; bi = s.bi; } else if (s.b === b) bi = bi && s.bi;
    return a > b || (a === b && !(ai && bi)) ? [] : [{ a, ai, b, bi }];
  })).sort((p, q) => p.a - q.a);
  const res = rows.map(r => r.runs).reduce(meet);
  const one = r => r.a === r.b ? `{${f(r.a)}}` :
    (r.a === -Infinity ? '(\u2212\u221e' : (r.ai ? '[' : '(') + f(r.a)) + ', ' +
    (r.b === Infinity ? '+\u221e)' : f(r.b) + (r.bi ? ']' : ')'));
  const label = res.length ? res.map(one).join(' \u222a ') : '\u2205';
  const shown = opt.solo ? [] : rows;
  const n = shown.length, gap = n ? 14 : 0, top = 12;
  const yRes = top + n * RH + gap + RH / 2;
  const yAxis = yRes + RH / 2 + 8, H = yAxis + 40;
  const xl = X0 - 4, xr = X1 + 4;
  let o = `<svg class="nl" viewBox="0 0 ${W} ${H}" role="img" aria-label="Retta numerica">`;
  res.forEach(r => {
    const xa = r.a === -Infinity ? xl : px(r.a), xb = r.b === Infinity ? xr : px(r.b);
    o += `<rect class="nl-band" x="${xa}" y="${top - 4}" width="${Math.max(xb - xa, 2)}" height="${yAxis - top + 4}"/>`;
  });
  vals.forEach(v => o += `<line class="nl-guide" x1="${px(v)}" x2="${px(v)}" y1="${top - 4}" y2="${yAxis}"/>`);
  const bars = (runs, y, cls) => runs.map(r => {
    const xa = r.a === -Infinity ? xl : px(r.a), xb = r.b === Infinity ? xr : px(r.b);
    let s = '';
    if (r.a !== r.b) s += `<line class="nl-bar ${cls}" x1="${xa + (r.a === -Infinity ? 6 : 0)}" x2="${xb - (r.b === Infinity ? 6 : 0)}" y1="${y}" y2="${y}"/>`;
    if (r.a === -Infinity) s += `<path class="nl-arr ${cls}" d="M${xa - 2} ${y} l9 -6 v12 z"/>`;
    else s += `<circle class="nl-dot ${cls}${r.ai ? '' : ' open'}" cx="${xa}" cy="${y}" r="5.5"/>`;
    if (r.b === Infinity) s += `<path class="nl-arr ${cls}" d="M${xb + 2} ${y} l-9 -6 v12 z"/>`;
    else if (r.a !== r.b) s += `<circle class="nl-dot ${cls}${r.bi ? '' : ' open'}" cx="${xb}" cy="${y}" r="5.5"/>`;
    return s;
  }).join('');
  shown.forEach((r, i) => {
    const y = top + i * RH + RH / 2;
    o += `<text class="nl-lab" x="${X0 - 18}" y="${y + 4}" text-anchor="end">${r.l}</text>` + bars(r.runs, y, '');
  });
  if (n) o += `<line class="nl-guide" x1="8" x2="${W - 8}" y1="${yRes - RH / 2 - gap / 2 + 2}" y2="${yRes - RH / 2 - gap / 2 + 2}" style="stroke-dasharray:none"/>`;
  o += `<text class="nl-lab nl-res" x="${X0 - 18}" y="${yRes + 4}" text-anchor="end">Soluzione</text>` + bars(res, yRes, 'res');
  if (!res.length) o += `<text class="nl-lab nl-res" x="${(X0 + X1) / 2}" y="${yRes + 5}" text-anchor="middle">nessuna soluzione</text>`;
  o += `<line class="nl-axis" x1="${X0 - 12}" x2="${X1 + 12}" y1="${yAxis}" y2="${yAxis}"/>`;
  vals.forEach(v => o += `<line class="nl-axis" x1="${px(v)}" x2="${px(v)}" y1="${yAxis - 4}" y2="${yAxis + 4}"/><text class="nl-tick" x="${px(v)}" y="${yAxis + 20}" text-anchor="middle">${f(v)}</text>`);
  o += `<text x="${X1 + 14}" y="${yAxis + 20}" text-anchor="end" style="font-style:italic">${vars}</text>`;
  o += `<text class="nl-res" x="${W - 4}" y="${H - 6}" text-anchor="end" style="font-size:12px">S = ${label}</text></svg>`;
  return `<div class="nl-wrap">${o}</div>`;
}

/* ═══════════════ STUDIO DEL SEGNO (SVG) ═══════════════ */
/* sg([{l:'x − 1', z:1, s:1}, {l:'2 − x', z:2, s:-1}], '>')
   z = zero del fattore; s = +1 se positivo a destra di z, -1 se a sinistra
   sq:1 = fattore sempre ≥ 0 (quadrato); den:1 = fattore a denominatore;
   zl = etichetta dello zero (es. '1/2'); opt.nosol = nasconde la soluzione */
function sg(fs, op, opt = {}) {
  const f = v => String(v).replace('-', '−');
  const showSol = !opt.nosol;
  const zlab = {}; fs.forEach(q => { if (q.zl) zlab[q.z] = q.zl; });
  const strict = op.length === 1, pos = op[0] === '>';
  const zs = [...new Set(fs.map(q => q.z))].sort((a, b) => a - b), n = zs.length;
  const span = n > 1 ? zs[n - 1] - zs[0] : 2;
  const pad = Math.max(span * 0.4, 1), lo = zs[0] - pad, hi = zs[n - 1] + pad;
  const X0 = 150, X1 = 548, W = 580, RH = 34;
  const px = v => X0 + (v - lo) / (hi - lo) * (X1 - X0);
  const sgn = (q, x) => q.sq ? 1 : ((x > q.z) === (q.s > 0) ? 1 : -1);
  const samp = i => i === 0 ? zs[0] - 1 : i === n ? zs[n - 1] + 1 : (zs[i - 1] + zs[i]) / 2;
  const prod = i => fs.reduce((p, q) => p * sgn(q, samp(i)), 1);
  const isDen = k => fs.some(q => q.den && q.z === zs[k]);
  // celle: regione i -> 2i, zero k -> 2k+1
  const sat = [];
  for (let i = 0; i <= n; i++) {
    sat[2 * i] = pos ? prod(i) > 0 : prod(i) < 0;
    if (i < n) sat[2 * i + 1] = !strict && !isDen(i);
  }
  const runs = [];
  for (let j = 0; j <= 2 * n; j++) if (sat[j]) {
    let e = j; while (sat[e + 1]) e++;
    const r = {};
    if (j === 0) { r.a = -Infinity; r.ai = false; }
    else if (j % 2 === 0) { r.a = zs[j / 2 - 1]; r.ai = false; }
    else { r.a = zs[(j - 1) / 2]; r.ai = true; }
    if (e === 2 * n) { r.b = Infinity; r.bi = false; }
    else if (e % 2 === 0) { r.b = zs[e / 2]; r.bi = false; }
    else { r.b = zs[(e - 1) / 2]; r.bi = true; }
    runs.push(r); j = e;
  }
  const lab = r => r.a === r.b ? `{${f(r.a)}}` :
    (r.a === -Infinity ? '(−∞' : (r.ai ? '[' : '(') + (zlab[r.a] || f(r.a))) + ', ' +
    (r.b === Infinity ? '+∞)' : (zlab[r.b] || f(r.b)) + (r.bi ? ']' : ')'));
  const solLab = runs.length ? runs.map(lab).join(' ∪ ') : '∅';
  const nf = fs.length, top = 12, gap = 10;
  const yP = top + nf * RH + gap + RH / 2, yS = yP + RH;
  const yAxis = (showSol ? yS : yP) + RH / 2 + 8, H = yAxis + 52;
  const xl = X0 - 4, xr = X1 + 4;
  let o = `<svg class="nl" viewBox="0 0 ${W} ${H}" role="img" aria-label="Studio del segno">`;
  if (showSol) runs.forEach(r => {
    const xa = r.a === -Infinity ? xl : px(r.a), xb = r.b === Infinity ? xr : px(r.b);
    o += `<rect class="nl-band" x="${xa}" y="${top - 4}" width="${Math.max(xb - xa, 2)}" height="${yAxis - top + 4}"/>`;
  });
  zs.forEach(v => o += `<line class="nl-guide" x1="${px(v)}" x2="${px(v)}" y1="${top - 4}" y2="${yAxis}"/>`);

      o += `<line class="sg-line ${s > 0 ? 'pos' : 'neg'}" x1="${a}" x2="${b}" y1="${y}" y2="${y}"/>`);
    o += `<circle class="nl-dot${strict || q.den ? ' open' : ''}" cx="${x}" cy="${y}" r="5.5"/>`;
  });
  o += `<line class="nl-guide" x1="8" x2="${W - 8}" y1="${yP - RH / 2 - gap / 2 + 2}" y2="${yP - RH / 2 - gap / 2 + 2}" style="stroke-dasharray:none"/>`;
  o += `<text class="nl-lab" x="${X0 - 18}" y="${yP + 5}" text-anchor="end">${fs.some(q => q.den) ? 'Quoziente' : 'Prodotto'}</text>`;
  const edges = [xl, ...zs.map(px), xr];
  for (let i = 0; i <= n; i++)
    o += `<text class="sg-sign ${prod(i) > 0 ? 'p' : 'm'}" x="${(edges[i] + edges[i + 1]) / 2}" y="${yP + 6}" text-anchor="middle">${prod(i) > 0 ? '+' : '−'}</text>`;
  zs.forEach((v, k) => o += `<text class="sg-sign z" x="${px(v)}" y="${yP + 4}" text-anchor="middle">${isDen(k) ? '×' : '0'}</text>`);
  if (showSol) o += `<text class="nl-lab nl-res" x="${X0 - 18}" y="${yS + 4}" text-anchor="end">Soluzione</text>`;
  if (showSol) runs.forEach(r => {
    const xa = r.a === -Infinity ? xl : px(r.a), xb = r.b === Infinity ? xr : px(r.b);
    if (r.a !== r.b) o += `<line class="nl-bar res" x1="${xa + (r.a === -Infinity ? 6 : 0)}" x2="${xb - (r.b === Infinity ? 6 : 0)}" y1="${yS}" y2="${yS}"/>`;
    if (r.a === -Infinity) o += `<path class="nl-arr res" d="M${xa - 2} ${yS} l9 -6 v12 z"/>`;
    else o += `<circle class="nl-dot res${r.ai ? '' : ' open'}" cx="${xa}" cy="${yS}" r="5.5"/>`;
    if (r.b === Infinity) o += `<path class="nl-arr res" d="M${xb + 2} ${yS} l-9 -6 v12 z"/>`;
    else if (r.a !== r.b) o += `<circle class="nl-dot res${r.bi ? '' : ' open'}" cx="${xb}" cy="${yS}" r="5.5"/>`;
  });
  if (showSol && !runs.length) o += `<text class="nl-lab nl-res" x="${(X0 + X1) / 2}" y="${yS + 5}" text-anchor="middle">nessuna soluzione</text>`;
  o += `<line class="nl-axis" x1="${X0 - 12}" x2="${X1 + 12}" y1="${yAxis}" y2="${yAxis}"/>`;
  zs.forEach(v => o += `<line class="nl-axis" x1="${px(v)}" x2="${px(v)}" y1="${yAxis - 4}" y2="${yAxis + 4}"/><text class="nl-tick" x="${px(v)}" y="${yAxis + 20}" text-anchor="middle">${zlab[v] || f(v)}</text>`);
  o += `<text x="${X1 + 14}" y="${yAxis + 20}" text-anchor="end" style="font-style:italic">x</text>`;
  const yl = H - 12;
  o += `<line class="sg-line pos" x1="10" x2="34" y1="${yl - 4}" y2="${yl - 4}" style="stroke-width:3"/><text x="40" y="${yl}" style="font-size:11px">positivo</text>`;
  o += `<line class="sg-line neg" x1="108" x2="132" y1="${yl - 4}" y2="${yl - 4}" style="stroke-width:3"/><text x="138" y="${yl}" style="font-size:11px">negativo</text>`;
  if (showSol) o += `<text class="nl-res" x="${W - 4}" y="${yl}" text-anchor="end" style="font-size:12px">S = ${solLab}</text>`;
  o += '</svg>';
  return `<div class="nl-wrap">${o}</div>`;
}

      <p>Un prodotto di fattori è <strong>positivo</strong> se i fattori negativi sono in numero <em>pari</em>, <strong>negativo</strong> se sono in numero <em>dispari</em>. Per la legge di annullamento del prodotto, il segno può cambiare solo dove un fattore si annulla: gli <strong>zeri dei fattori</strong> spezzano la retta in intervalli, e in ciascun intervallo il segno del prodotto è costante.</p>
    </div>

    <h2>Procedura: lo studio del segno</h2>
    <ol>
      <li><strong>Scomponi</strong> il polinomio in fattori di primo grado (raccoglimento, prodotti notevoli).</li>
      <li>Per ogni fattore <strong>studia il segno</strong>: risolvi la disequazione \\(\\text{fattore} > 0\\), che è di primo grado.</li>
      <li>Sulla retta numerica disegna <strong>una riga per fattore</strong>: linea <strong>continua</strong> dove il fattore è positivo, <strong>tratteggiata</strong> dove è negativo.</li>
      <li>Nella riga del <strong>prodotto</strong> applica la regola dei segni in ogni intervallo.</li>
      <li><strong>Leggi la soluzione</strong>: gli intervalli col segno richiesto (\\(>0\\) oppure \\(<0\\)). Gli zeri si includono solo se la disequazione è non stretta (\\(\\geq\\), \\(\\leq\\)).</li>
    </ol>

    <div class="cb warn">
      <div class="cb-label">Attenzione</div>
      <p>Non portare mai i fattori su lati diversi, e non dividere per un'espressione con \\(x\\): non ne conosci il segno. Prima porta tutto a un membro, in modo da avere \\(\\ldots > 0\\) oppure \\(\\ldots < 0\\), poi scomponi.</p>
    </div>

    ${acc([
      {
        t: `Es. 1: Prodotto già scomposto`,
        h: `<p><strong>Risolvere:</strong> \\((x - 1)(x + 3) > 0\\)</p>
            <p><strong>Segno dei fattori:</strong></p>
            <div class="math-block">\\[x - 1 > 0 \\Rightarrow x > 1 \\qquad x + 3 > 0 \\Rightarrow x > -3\\]</div>
            ${sg([{l:'x − 1',z:1,s:1},{l:'x + 3',z:-3,s:1}], '>')}
            <p><strong>Soluzione:</strong> \\(x < -3 \\ \\lor \\ x > 1\\), cioè \\((-\\infty, -3) \\cup (1, +\\infty)\\)</p>`
      },
      {
        t: `Es. 2: Fattore con coefficiente negativo`,
        h: `<p><strong>Risolvere:</strong> \\((2 - x)(x + 3) > 0\\)</p>
            <p><strong>Segno dei fattori:</strong></p>
            <div class="math-block">\\[2 - x > 0 \\Rightarrow x < 2 \\ \\text{(il verso cambia!)} \\qquad x + 3 > 0 \\Rightarrow x > -3\\]</div>
            ${sg([{l:'2 − x',z:2,s:-1},{l:'x + 3',z:-3,s:1}], '>')}
            <p><strong>Soluzione:</strong> \\(-3 < x < 2\\), cioè \\((-3, 2)\\)</p>
            <p>Il fattore \\(2 - x\\) è positivo <em>a sinistra</em> del suo zero: attento a non assumere che sia sempre positivo a destra.</p>`
      },
      {
        t: `Es. 3: Differenza di quadrati`,
        h: `<p><strong>Risolvere:</strong> \\(x^2 - 4 \\leq 0\\)</p>
            <p><strong>Scomposizione:</strong> \\((x - 2)(x + 2) \\leq 0\\)</p>
            <div class="math-block">\\[x - 2 > 0 \\Rightarrow x > 2 \\qquad x + 2 > 0 \\Rightarrow x > -2\\]</div>
            ${sg([{l:'x − 2',z:2,s:1},{l:'x + 2',z:-2,s:1}], '<=')}
            <p>Cerchiamo il segno <strong>negativo</strong>, e la disequazione è non stretta: gli zeri sono inclusi.</p>
            <p><strong>Soluzione:</strong> \\(-2 \\leq x \\leq 2\\), cioè \\([-2, 2]\\)</p>`
      },
      {
        t: `Es. 4: Quadrato di binomio`,
        h: `<p><strong>Risolvere:</strong> \\(x^2 - 4x + 4 > 0\\)</p>
            <p><strong>Scomposizione:</strong> \\((x - 2)^2 > 0\\)</p>
            <p>Un quadrato non è mai negativo: vale zero in \\(x = 2\\) e ovunque altrove è positivo.</p>
            ${sg([{l:'(x − 2)²',z:2,sq:1}], '>')}
            <p><strong>Soluzione:</strong> tutti i reali tranne 2, cioè \\((-\\infty, 2) \\cup (2, +\\infty)\\)</p>
            <div class="cb tip" style="margin-top:10px">
              <div class="cb-label">Stesso polinomio, altri versi</div>
              <p>\\((x-2)^2 \\geq 0\\) è vera per ogni \\(x\\); \\((x-2)^2 < 0\\) non ha soluzioni (\\(\\emptyset\\)); \\((x-2)^2 \\leq 0\\) ha come unica soluzione \\(x = 2\\).</p>
            </div>`
      },
      {
        t: `Es. 5: Tre fattori`,
        h: `<p><strong>Risolvere:</strong> \\(x^3 - 4x \\geq 0\\)</p>
            <p><strong>Scomposizione:</strong> raccoglimento e differenza di quadrati.</p>
            <div class="math-block">\\[x(x^2 - 4) = x(x - 2)(x + 2) \\geq 0\\]</div>
            <div class="math-block">\\[x > 0 \\qquad x - 2 > 0 \\Rightarrow x > 2 \\qquad x + 2 > 0 \\Rightarrow x > -2\\]</div>
            ${sg([{l:'x',z:0,s:1},{l:'x − 2',z:2,s:1},{l:'x + 2',z:-2,s:1}], '>=')}
            <p><strong>Soluzione:</strong> \\(-2 \\leq x \\leq 0 \\ \\lor \\ x \\geq 2\\), cioè \\([-2, 0] \\cup [2, +\\infty)\\)</p>`
      },
      {
        t: `Es. 6: Rapporto tra due fattori`,
        h: `<p><strong>Risolvere:</strong> \\(\\dfrac{x - 1}{x + 2} \\leq 0\\)</p>
            <p>Il segno di un rapporto segue la stessa regola del prodotto. In più, <strong>lo zero del denominatore va sempre escluso</strong>: lì la frazione non esiste.</p>
            <div class="math-block">\\[x - 1 > 0 \\Rightarrow x > 1 \\qquad x + 2 > 0 \\Rightarrow x > -2\\]</div>
            ${sg([{l:'x − 1',z:1,s:1},{l:'x + 2',z:-2,s:1,den:1}], '<=')}
            <p>Il simbolo \\(\\times\\) indica che in \\(x = -2\\) il quoziente non è definito.</p>
            <p><strong>Soluzione:</strong> \\(-2 < x \\leq 1\\), cioè \\((-2, 1]\\)</p>`
      }
    ])}

    <div class="cb plain">
      <div class="cb-label">Esercitazione</div>
      <p>Per esercitarti, scarica gli esercizi sullo studio del segno e sui sistemi di disequazioni, con le soluzioni per controllare.</p>
      <div class="doc-links">
        <a class="btn-ghost" href="esercitazione-studio-segno.pdf" target="_blank" rel="noopener">Esercitazione PDF <span aria-hidden="true">↓</span></a>
        <a class="btn-ghost" href="esercitazione-studio-segno_soluzioni.pdf" target="_blank" rel="noopener">Soluzioni PDF <span aria-hidden="true">↓</span></a>
      </div>
    </div>
  `
},

/* ═══════════════ APP ═══════════════ */
let cur = 0;
const tot = S.length;

function render() {
  // nav pills
  document.getElementById('topNav').innerHTML = S.map((s, i) =>
    `<button class="nav-pill ${i === cur ? 'active' : ''}" onclick="goTo(${i})">${s.nav}</button>`
  ).join('');

  // screens
  document.getElementById('app').innerHTML = S.map((s, i) => `
    <div class="section ${i === cur ? 'active' : ''}">
      <div class="hero">
        <div class="hero-tag">${s.tag}</div>
        <h1>${s.title}</h1>
        <p class="hero-sub">${s.sub}</p>
      </div>
      ${s.body}
      <div class="bottom-nav">
        <button class="bb" onclick="goTo(${i - 1})" ${i === 0 ? 'disabled' : ''}>← Indietro</button>
        <div class="dots">
          ${S.map((_, j) =>
            `<button class="dot ${j === i ? 'active' : ''}" onclick="goTo(${j})"
             title="Sezione ${j + 1} di ${tot}"></button>`
          ).join('')}
        </div>
        <button class="bb" onclick="goTo(${i + 1})" ${i === tot - 1 ? 'disabled' : ''}>Avanti →</button>
      </div>
    </div>
  `).join('');

  // typeset active section
  if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
    const active = document.querySelector('.section.active');
    if (active) MathJax.typesetPromise([active]);
  }
}

function goTo(idx) {
  if (idx < 0 || idx >= tot) return;
  cur = idx;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goTo(cur + 1);
  if (e.key === 'ArrowLeft')  goTo(cur - 1);
});

// avvia dopo MathJax
if (typeof MathJax !== 'undefined' && MathJax.startup && MathJax.startup.promise) {
  MathJax.startup.promise.then(() => render());
} else {
  render();
  document.body.style.opacity = '1';
}
</script>

<script>
(function(){
  var STORAGE_KEY = 'mot-lezioni-theme';
  function applyTheme(dark){
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var sun = document.getElementById('motSunIcon');
    var moon = document.getElementById('motMoonIcon');
    if (sun) sun.style.display = dark ? 'none' : 'block';
    if (moon) moon.style.display = dark ? 'block' : 'none';
  }
  var saved = null;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch(e){}
  var wantsDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(wantsDark);
  document.addEventListener('DOMContentLoaded', function(){
    var btn = document.getElementById('motThemeToggle');
    if (!btn) return;
    applyTheme(wantsDark);
    btn.addEventListener('click', function(){
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      var next = !isDark;
      applyTheme(next);
      try { localStorage.setItem(STORAGE_KEY, next ? 'dark' : 'light'); } catch(e){}
    });
  });
})();
</script>
