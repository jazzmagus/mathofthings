const S = [

{
  tag:"MOTIVAZIONE",
  title:"Perché fondare il <em>ragionamento</em> prima dei numeri",
  nav:"Motivazione",
  body:
    '<p>Ogni dimostrazione che incontrerai nei prossimi anni — che un limite valga un certo numero, che un teorema sia vero per ogni \\(n\\), che due insiemi coincidano — si appoggia su un numero ristretto di <strong>mosse logiche legittime</strong>: negare una proposizione, dedurre da un’implicazione, ragionare per assurdo, generalizzare da un caso base a tutti i successivi. Questa dispensa mette a fuoco quelle mosse, prima di usarle altrove.</p>' +
    '<div class="cb"><div class="cb-label">L’idea guida</div><p>Una dimostrazione non è "spiegare perché qualcosa sembra vero": è una catena finita di passaggi, ciascuno giustificato da una regola logica esplicita, che parte da ipotesi accettate e arriva alla tesi. Imparare queste regole significa poter riconoscere, in qualunque dimostrazione futura, <em>quale mossa</em> si sta usando e <em>perché</em> è lecita.</p></div>' +
    '<p>Il percorso: connettivi logici e tavole di verità, i quantificatori e la loro negazione, le tecniche di dimostrazione diretta e per assurdo, il principio di induzione, e infine l’algebra degli insiemi — dove le stesse regole logiche riappaiono travestite da unione, intersezione e complementare.</p>'
},
{
  tag:"CONNETTIVI",
  title:"Connettivi logici e <em>tavole di verità</em>",
  nav:"Connettivi",
  body:
    '<div class="cb"><div class="cb-label">Proposizione</div><p>Una <strong>proposizione</strong> è un enunciato a cui si può assegnare, senza ambiguità, uno tra i due valori di verità V (vero) o F (falso). "\\(7\\) è primo" è una proposizione (V); "che ora è?" non lo è.</p></div>' +
    '<p>A partire da proposizioni semplici \\(p, q\\), si costruiscono proposizioni composte con i <strong>connettivi</strong>: negazione \\(\\lnot p\\), congiunzione \\(p\\land q\\), disgiunzione \\(p\\lor q\\), implicazione \\(p\\Rightarrow q\\), doppia implicazione \\(p\\Leftrightarrow q\\). Il valore di verità del composto dipende <em>solo</em> dai valori di \\(p\\) e \\(q\\), non dal loro significato.</p>' +
    '<table class="ct"><tr><th>\\(p\\)</th><th>\\(q\\)</th><th>\\(p\\land q\\)</th><th>\\(p\\lor q\\)</th><th>\\(p\\Rightarrow q\\)</th></tr>' +
    '<tr><td>V</td><td>V</td><td>V</td><td>V</td><td>V</td></tr>' +
    '<tr><td>V</td><td>F</td><td>F</td><td>V</td><td>F</td></tr>' +
    '<tr><td>F</td><td>V</td><td>F</td><td>V</td><td>V</td></tr>' +
    '<tr><td>F</td><td>F</td><td>F</td><td>F</td><td>V</td></tr></table>' +
    '<div class="cb warn"><div class="cb-label">Il punto che spiazza sempre</div><p>\\(p\\Rightarrow q\\) è <strong>vera</strong> ogni volta che \\(p\\) è falsa, indipendentemente da \\(q\\): "se la luna è di formaggio, allora \\(2+2=5\\)" è un’implicazione vera, perché l’ipotesi non si verifica mai. Questo non è un capriccio: è l’unica scelta che rende l’implicazione coerente con il suo uso nelle dimostrazioni (vedi il riquadro sulla dimostrazione diretta più avanti).</p></div>' +
    '<div class="cb"><div class="cb-label">Definizione — Tautologia e contraddizione</div><p>Una proposizione composta è una <strong>tautologia</strong> se è vera per ogni assegnazione di valori di verità alle sue componenti; è una <strong>contraddizione</strong> se è sempre falsa. Due proposizioni sono <strong>logicamente equivalenti</strong> (\\(p\\equiv q\\)) se hanno la stessa tavola di verità, cioè se \\(p\\Leftrightarrow q\\) è una tautologia.</p></div>' +
    '<div class="cb purple"><div class="cb-label">Teorema \\(p\\Rightarrow q\\) equivale a \\(\\lnot p \\lor q\\)</div><p><strong>Dimostrazione</strong> (per tavola di verità): nei quattro casi V-V, V-F, F-V, F-F di \\((p,q)\\), i valori di \\(p\\Rightarrow q\\) sono V,F,V,V (dalla tavola sopra); i valori di \\(\\lnot p\\lor q\\) sono, rispettivamente, F\\(\\lor\\)V=V, F\\(\\lor\\)F=F, V\\(\\lor\\)V=V, V\\(\\lor\\)F=V. Le due colonne coincidono riga per riga, quindi \\((p\\Rightarrow q)\\Leftrightarrow(\\lnot p\\lor q)\\) è una tautologia. \\(\\blacksquare\\)</p></div>' +
    '<div class="cb tip"><div class="cb-label">Perché conta</div><p>Questa equivalenza è ciò che rende naturale il comportamento di \\(p\\Rightarrow q\\) quando \\(p\\) è falsa: se \\(p\\) è falsa, \\(\\lnot p\\) è vera, e "vera \\(\\lor\\) qualsiasi cosa" è sempre vera.</p></div>'
},
{
  tag:"QUANTIFICATORI",
  title:"<em>Quantificatori</em>: negazione e scambio di ordine",
  nav:"Quantificatori",
  body:
    '<div class="cb"><div class="cb-label">Quantificatore universale ed esistenziale</div><p>\\(\\forall x\\in A,\\ P(x)\\) significa "per ogni \\(x\\) nell’insieme \\(A\\), la proprietà \\(P(x)\\) è vera". \\(\\exists x\\in A,\\ P(x)\\) significa "esiste (almeno) un \\(x\\) in \\(A\\) per cui \\(P(x)\\) è vera".</p></div>' +
    '<div class="cb"><div class="cb-label">Teorema — negazione dei quantificatori</div><p>\\[ \\lnot\\big(\\forall x\\in A,\\ P(x)\\big) \\ \\equiv\\ \\exists x\\in A,\\ \\lnot P(x) \\]<br>\\[ \\lnot\\big(\\exists x\\in A,\\ P(x)\\big) \\ \\equiv\\ \\forall x\\in A,\\ \\lnot P(x) \\]</p></div>' +
    '<div class="cb purple"><div class="cb-label">Dimostrazione (per doppia implicazione, ragionando sul significato)</div><p>Dire che "non è vero che \\(P(x)\\) valga per ogni \\(x\\)" equivale a dire che c’è almeno un \\(x\\) che fa da controesempio, cioè per cui \\(P(x)\\) è falsa: questo è precisamente \\(\\exists x, \\lnot P(x)\\). Viceversa, se \\(\\exists x, \\lnot P(x)\\) è vera, allora quell’\\(x\\) contraddice \\(\\forall x, P(x)\\), quindi \\(\\forall x, P(x)\\) è falsa. Le due proposizioni si implicano a vicenda, dunque sono equivalenti. La seconda uguaglianza segue applicando la prima a \\(\\lnot P\\) e negando entrambi i membri. \\(\\blacksquare\\)</p></div>' +
    '<div class="cb warn"><div class="cb-label">Errore classico da evitare</div><p>Negare "ogni studente ha superato l’esame" <strong>non</strong> significa "nessuno studente ha superato l’esame", ma "almeno uno studente non l’ha superato". Confondere \\(\\exists x,\\lnot P(x)\\) con \\(\\forall x,\\lnot P(x)\\) è l’errore più comune nella negazione di enunciati quantificati.</p></div>' +
    '<div class="cb"><div class="cb-label">L’ordine dei quantificatori conta</div><p>\\(\\forall x\\,\\exists y,\\ P(x,y)\\) e \\(\\exists y\\,\\forall x,\\ P(x,y)\\) non sono equivalenti in generale. Nella prima, \\(y\\) può dipendere da \\(x\\) (uno diverso per ogni \\(x\\)); nella seconda, un unico \\(y\\) deve andare bene per tutti gli \\(x\\) simultaneamente.</p></div>' +
    '<div class="cb tip"><div class="cb-label">Esempio decisivo (e già familiare)</div><p>La definizione di limite \\(\\forall\\varepsilon>0\\,\\exists\\delta>0:\\ |x-c|<\\delta\\Rightarrow|f(x)-\\ell|<\\varepsilon\\) ha questa struttura: \\(\\delta\\) può (anzi, deve in generale) dipendere da \\(\\varepsilon\\). Scambiare l’ordine dei quantificatori darebbe una condizione molto più forte — e quasi mai verificata.</p></div>'
},
{
  tag:"DIMOSTRAZIONI",
  title:"Dimostrazione <em>diretta</em> e per <em>assurdo</em>",
  nav:"Assurdo",
  body:
    '<div class="cb"><div class="cb-label">Dimostrazione diretta di \\(p\\Rightarrow q\\)</div><p>Si assume \\(p\\) vera e si deduce \\(q\\) tramite una catena di passaggi logicamente validi. È legittima proprio perché \\(p\\Rightarrow q\\) è automaticamente vera quando \\(p\\) è falsa (sezione Connettivi): basta occuparsi del solo caso \\(p\\) vera.</p></div>' +
    '<div class="cb"><div class="cb-label">Esempio — dimostrazione diretta</div><p><strong>Proposizione:</strong> se \\(n\\) è pari, allora \\(n^2\\) è pari.<br><strong>Dimostrazione:</strong> \\(n\\) pari significa \\(n=2k\\) per qualche intero \\(k\\). Allora \\(n^2=4k^2=2(2k^2)\\), che è il doppio dell’intero \\(2k^2\\), dunque pari. \\(\\blacksquare\\)</p></div>' +
    '<div class="cb"><div class="cb-label">Dimostrazione per assurdo</div><p>Per dimostrare che una proposizione \\(P\\) è vera, si assume \\(\\lnot P\\) e si deduce una contraddizione (una proposizione della forma \\(r\\land\\lnot r\\), sempre falsa). Poiché da premesse vere non si può dedurre il falso, l’ipotesi \\(\\lnot P\\) deve essere falsa, dunque \\(P\\) è vera.</p></div>' +
    '<div class="cb purple"><div class="cb-label">Perché funziona (giustificazione logica)</div><p>Se \\(\\lnot P\\) porta, attraverso passaggi validi, a una contraddizione, allora \\(\\lnot P\\Rightarrow(r\\land\\lnot r)\\) è vera. Ma \\(r\\land\\lnot r\\) è sempre falsa; l’unico modo perché un’implicazione con conseguente falso sia vera è che l’ipotesi sia falsa (dalla tavola di verità di \\(\\Rightarrow\\)). Dunque \\(\\lnot P\\) è falsa, cioè \\(P\\) è vera. \\(\\blacksquare\\)</p></div>' +
    '<div class="cb"><div class="cb-label">Teorema \\(\\sqrt2\\) è irrazionale</div><p><strong>Dimostrazione (per assurdo).</strong> Supponiamo, per assurdo, che \\(\\sqrt2\\) sia razionale: \\(\\sqrt2=\\dfrac{p}{q}\\) con \\(p,q\\) interi, \\(q\\ne0\\), e frazione ridotta ai minimi termini (cioè \\(\\text{MCD}(p,q)=1\\)).</p>' +
    '<p>Elevando al quadrato: \\(2=\\dfrac{p^2}{q^2}\\), cioè \\(p^2=2q^2\\). Dunque \\(p^2\\) è pari; per l’esempio precedente (contrapposto: se \\(n^2\\) è pari, \\(n\\) è pari — lo si dimostra allo stesso modo), anche \\(p\\) è pari: \\(p=2k\\).</p>' +
    '<p>Sostituendo: \\((2k)^2=2q^2 \\Rightarrow 4k^2=2q^2 \\Rightarrow q^2=2k^2\\). Quindi \\(q^2\\) è pari, e per lo stesso argomento \\(q\\) è pari.</p>' +
    '<p>Ma allora \\(p\\) e \\(q\\) sono entrambi pari, cioè hanno \\(2\\) come divisore comune: contraddice l’ipotesi \\(\\text{MCD}(p,q)=1\\). Assurdo. Dunque \\(\\sqrt2\\) non è razionale. \\(\\blacksquare\\)</p></div>' +
    '<div class="cb tip"><div class="cb-label">Dimostrazione per contronominale (cugina dell’assurdo)</div><p>Per dimostrare \\(p\\Rightarrow q\\), a volte è più comodo dimostrare l’equivalente <strong>contronominale</strong> \\(\\lnot q\\Rightarrow\\lnot p\\) (equivalenza che segue dalla tavola di verità di \\(\\Rightarrow\\), verificabile riga per riga). È diversa dall’assurdo: qui si dimostra direttamente un’altra implicazione, senza assumere la tesi negata e cercare una contraddizione esplicita.</p></div>'
},
{
  tag:"INDUZIONE",
  title:"Il <em>principio di induzione</em>",
  nav:"Induzione",
  body:
    '<div class="cb"><div class="cb-label">Principio di induzione</div><p>Sia \\(P(n)\\) una proprietà definita per ogni intero \\(n\\ge n_0\\). Se valgono:</p>' +
    '<p><strong>(Base)</strong> \\(P(n_0)\\) è vera;</p>' +
    '<p><strong>(Passo induttivo)</strong> per ogni \\(k\\ge n_0\\), \\(P(k)\\Rightarrow P(k+1)\\);</p>' +
    '<p>allora \\(P(n)\\) è vera per ogni \\(n\\ge n_0\\).</p></div>' +
    '<div class="cb tip"><div class="cb-label">L’immagine delle tessere del domino</div><p>La base fa cadere la prima tessera; il passo induttivo garantisce che ogni tessera, cadendo, fa cadere la successiva. Insieme, queste due condizioni assicurano che <em>tutte</em> le tessere cadranno, non solo un numero finito — è esattamente la differenza tra verificare \\(P(n)\\) caso per caso (impossibile per infiniti \\(n\\)) e dimostrarla per ogni \\(n\\) in un colpo solo.</p></div>' +
    '<div class="cb"><div class="cb-label">Teorema — somma dei primi \\(n\\) interi</div><p>Per ogni \\(n\\ge1\\): \\(\\displaystyle\\sum_{i=1}^{n} i = \\frac{n(n+1)}{2}\\).</p></div>' +
    '<div class="cb purple"><div class="cb-label">Dimostrazione per induzione</div>' +
    '<p><strong>Base</strong> (\\(n=1\\)): \\(\\sum_{i=1}^1 i = 1\\), e \\(\\frac{1\\cdot2}{2}=1\\). Coincidono.</p>' +
    '<p><strong>Passo induttivo</strong>: supponiamo vera l’ipotesi induttiva \\(\\sum_{i=1}^{k} i = \\frac{k(k+1)}{2}\\) per un certo \\(k\\ge1\\), e dimostriamo che vale per \\(k+1\\):</p>' +
    '<div class="math-block">\\[ \\sum_{i=1}^{k+1} i = \\sum_{i=1}^{k} i + (k+1) = \\frac{k(k+1)}{2} + (k+1) = (k+1)\\left(\\frac{k}{2}+1\\right) = \\frac{(k+1)(k+2)}{2} \\]</div>' +

let currentIdx = 0;

function render() {
  const s = S[currentIdx];

    '<div class="hero-tag">' + s.tag + '</div>' +
    '<h1>' + s.title + '</h1></div>' +

    '<div class="bottom-nav">' +
    '<button class="bb" onclick="prev()" ' + (currentIdx === 0 ? 'disabled' : '') + '>← Indietro</button>' +
    '<div class="page-info">' + (currentIdx + 1) + ' / ' + S.length + '</div>' +
    '<button class="bb" onclick="next()" ' + (currentIdx === S.length - 1 ? 'disabled' : '') + '>Avanti →</button>' +
    '</div>';

  document.getElementById('app').innerHTML = html;

  const pills = S.map((s, i) =>
    '<button class="nav-pill ' + (i === currentIdx ? 'active' : '') + '" onclick="go(' + i + ')">' + s.nav + '</button>'
  ).join('');
  document.getElementById('topNav').innerHTML = pills;

  if (typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([document.getElementById('app')]);
  }
  document.body.style.opacity = '1';
}

function prev() { if (currentIdx > 0) { currentIdx--; render(); window.scrollTo(0, 0); } }
function next() { if (currentIdx < S.length - 1) { currentIdx++; render(); window.scrollTo(0, 0); } }
function go(i) { currentIdx = i; render(); window.scrollTo(0, 0); }

render();
